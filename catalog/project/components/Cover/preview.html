<div class="cover">
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!-- blocks: scarf（大きなピル 380×110）、terrain（角 corner-block の板 220×110）、hazard（小さなピル 90×50）、metal（円 r=30）、accent（ピル 150×110）
     arrangement: 上に横一列の帯（高さ110）。大きさをそろえず、右へいくほど小さく
     pattern: 丸いもの・やわらかい（大きな丸み）→ 円と丸い粒。地形の板の上に player-body の粒を12個（地形の「粒」の決まりから）
     scales: 角は corner-block（6px）と corner-pill、間は hud-gap（8px）の倍数 -->
<style>
.cover { width: 960px; height: 288px; position: relative; background: var(--ui-panel); overflow: hidden; }
.cover svg { position: absolute; inset: 0; }
.scarf { fill: var(--scarf); } .terrain { fill: var(--terrain); } .hazard { fill: var(--hazard); } .metal { fill: var(--metal); } .accent { fill: var(--accent); } .grain { fill: var(--player-body); opacity: .85; }
.block { rx: var(--corner-block); }
.cover .name { position: absolute; left: 48px; top: 160px; margin: 0; font: 800 64px/0.95 var(--font-round); color: var(--ui-ink); letter-spacing: .02em; white-space: nowrap; }
.cover .tag { position: absolute; left: 50px; top: 236px; margin: 0; font: 500 14px/1.4 var(--font-round); color: var(--ui-muted); }
</style>

<circle class="grain" cx="640" cy="44" r="4"></circle><circle class="grain" cx="512" cy="120" r="3"></circle><circle class="grain" cx="614" cy="120" r="3"></circle>
</svg>
