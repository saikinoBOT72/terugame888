<title>壁蹴りタワー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  /* Layout: one fixed 360x640 game frame, centered and scaled; menus are rounded cards over it.

  :root {
    --cave: #2a2433;      /* 洞窟の奥 */
    --panel: #3a3146;     /* メニューの板 */
    --cream: #fff4e6;     /* 文字 */
    --dim: #c8b8c4;
    --pink: #ff6fa1;      /* マフラー＝主役の色 */
    --pink-deep: #d84f84;
    --teal: #8ee3d0;      /* 光るキノコ */
    --font-round: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  html { box-sizing: border-box; }
  body {
    background: var(--cave); color: var(--cream); overflow: hidden;
    font: 500 13px/1.6 var(--font-round);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { width: 100%; height: 100%; display: grid; place-items: center; }
  #frame { position: relative; --u: 1; border-radius: calc(var(--u) * 10px); overflow: hidden; }
  #cv { display: block; touch-action: none; cursor: pointer; }
  .ov {
    position: absolute; inset: 0; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    padding: calc(var(--u) * 18px); background: rgba(30, 24, 38, .45);
  }
  .card {
    width: 100%; box-sizing: border-box; display: grid; justify-items: center; gap: calc(var(--u) * 10px);
    background: var(--panel); border-radius: calc(var(--u) * 18px);
    padding: calc(var(--u) * 22px) calc(var(--u) * 18px);
    box-shadow: 0 calc(var(--u) * 6px) 0 rgba(0,0,0,.25);
    text-align: center; font-size: calc(var(--u) * 13px);
  }
  .ov h1 { margin: 0; font-weight: 800; font-size: calc(var(--u) * 34px); line-height: 1.15; letter-spacing: .04em; }
  .ov h1 span { color: var(--pink); }
  .ov h2 { margin: 0; font-weight: 800; font-size: calc(var(--u) * 24px); }
  .ov p { margin: 0; color: var(--dim); }
  .tagline { color: var(--teal) !important; font-size: calc(var(--u) * 13px); }
  .how { display: grid; gap: calc(var(--u) * 4px); text-align: left; font-size: calc(var(--u) * 12.5px); }
  .how div { display: flex; gap: calc(var(--u) * 8px); align-items: baseline; }
  .how b { font-weight: 800; color: var(--pink); min-width: calc(var(--u) * 84px); }
  .btn {

    background: var(--pink); border: 0; border-radius: 999px;
    padding: calc(var(--u) * 10px) calc(var(--u) * 34px); cursor: pointer;
    box-shadow: 0 calc(var(--u) * 4px) 0 var(--pink-deep);
  }

  .sub {
    font: inherit; font-size: calc(var(--u) * 12.5px); color: var(--cream); background: transparent;
    border: 2px solid rgba(255,244,230,.25); border-radius: 999px; padding: calc(var(--u) * 5px) calc(var(--u) * 16px); cursor: pointer;

<div id="app">

    <section id="ovTitle" class="ov">

    <section id="ovPause" class="ov" hidden>

    </section>
    <section id="ovEnd" class="ov" hidden>
      <div class="card">

      </div>
    </section>

'use strict';

/* =====================================================================

const MOVE = {

  airJumps: 1, airVy: 300, airMode: 'keep',

  // 斜めの壁から蹴るときの倍率（横, 上）。下向きの斜面は横向き多め、上向きの斜面は上向き多め

/* ---------- 画面と単位 ---------- */
const CELL = 18, COLS = 20;          // 1マス18px、横20マス

const R = 11, HB = 10, HIT = 8;      // 見た目の半径 / 地形との当たり / トゲ・敵との当たり

const MAX_HP = 3, INVINCIBLE = 1.1;
const LAVA = { delay: 3, base: 14, perM: 0.12, leash: 160, catchup: 0.9 };

/* =====================================================================
   パーツ（ステージの部品）
   1文字 = 1マス。上の行がパーツの上。横は必ず20文字。
     #  壁        .  空間       ^  トゲ（となりの壁から生える）
     /  \  45度の斜め（まわりの壁から向きを自動で決める）。上向きも下向きも張り付ける
     B  コウモリ
   床も足場も、すべてマス単位のブロック（#）で作る
   つなぎ目のルール：
     - パーツのいちばん下の行といちばん上の行が「つなぎ口」。
       前のパーツの上のつなぎ口と、次のパーツの下のつなぎ口の形が同じものだけがつながる。
     - 上下それぞれ2行はトゲなし（どの高さで入ってきても立て直せるように）。
   ===================================================================== */
const PIECES = {};
function piece(id, opt, art) {

  for (const r of rows) if (r.length !== COLS) throw new Error(`${id}: 行の長さが${r.length}文字（20文字にする）: "${r}"`);
  PIECES[id] = { id, diff: opt.diff || 1, rows: rows.slice().reverse() };   // 内部では下の行から
}

`);

/* ---------- 高さ100mごとのプール ---------- */
const POOLS = [
  { from: 0, name: '地底の洞窟', pieces: ['z1_open', 'z1_alternate', 'z1_longwall', 'z1_funnel', 'z1_shelves', 'z1_pillar', 'z1_blocks', 'z1_sideleft'] },
  { from: 100, name: '根っこの坑道', pieces: ['z2_dense', 'z2_narrow', 'z2_bats', 'z2_pillarspikes', 'z2_shelfspikes', 'z1_longwall', 'z1_sideleft', 'z1_pillar'] },
];
const poolAt = m => { let p = POOLS[0]; for (const q of POOLS) if (m >= q.from) p = q; return p; };

/* =====================================================================
   地形（マス目 → 当たり判定の線分）
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

function newWorld() { return { rows: [], edges: [], edgeRow: -1, placed: [], bats: [], ends: new Map() }; }
// 行 r は y = -(r+1)*CELL 〜 -r*CELL（上がマイナス）。r < 0 は地面、範囲外の列は壁
function raw(w, c, r) { if (c < 0 || c >= COLS || r < 0) return '#'; const row = w.rows[r]; return row ? row[c] : '.'; }
const isWall = t => t === '#';
function tile(w, c, r) {
  const t = raw(w, c, r);
  if (t === '/') {   // ◢（右下が壁）か ◤（左上が壁）
    const br = isWall(raw(w, c + 1, r)) + isWall(raw(w, c, r - 1)), tl = isWall(raw(w, c - 1, r)) + isWall(raw(w, c, r + 1));
    return br >= tl ? 'BR' : 'TL';
  }
  if (t === '\\') {  // ◣（左下が壁）か ◥（右上が壁）
    const bl = isWall(raw(w, c - 1, r)) + isWall(raw(w, c, r - 1)), tr = isWall(raw(w, c + 1, r)) + isWall(raw(w, c, r + 1));
    return bl >= tr ? 'BL' : 'TR';
  }
  return t;
}
const SIDES = { '#': 'LRTB', BR: 'RB', BL: 'LB', TL: 'LT', TR: 'RT' };
const solidSide = (t, s) => (SIDES[t] || '').includes(s);
function addEdge(w, ax, ay, bx, by, nx, ny, kind, r) {
  const e = { ax, ay, bx, by, nx, ny, kind, minX: Math.min(ax, bx), maxX: Math.max(ax, bx), minY: Math.min(ay, by), maxY: Math.max(ay, by), smoothA: false, smoothB: false };
  (w.edges[r] || (w.edges[r] = [])).push(e);
  // まっすぐつながる線同士のつなぎ目は「角」として当たらないようにする（マスの境目で引っかからない）
  for (const [px, py, end] of [[ax, ay, 'A'], [bx, by, 'B']]) {
    const k = `${px},${py},${nx.toFixed(3)},${ny.toFixed(3)},${kind}`, other = w.ends.get(k);
    if (other) { e['smooth' + end] = true; other.e['smooth' + other.end] = true; } else w.ends.set(k, { e, end });
  }
}
function buildEdges(w, upto) {
  const S = Math.SQRT1_2;
  for (let r = w.edgeRow + 1; r <= upto; r++) {
    if (r === 0) for (let c = 0; c < COLS; c++) if (!solidSide(tile(w, c, 0), 'B')) addEdge(w, c * CELL, 0, (c + 1) * CELL, 0, 0, -1, 'wall', 0);
    for (let c = 0; c < COLS; c++) {
      const t = tile(w, c, r), x0 = c * CELL, x1 = x0 + CELL, yT = -(r + 1) * CELL, yB = -r * CELL;
      if (!SIDES[t]) continue;
      if (solidSide(t, 'L') && !solidSide(tile(w, c - 1, r), 'R')) addEdge(w, x0, yB, x0, yT, -1, 0, 'wall', r);
      if (solidSide(t, 'R') && !solidSide(tile(w, c + 1, r), 'L')) addEdge(w, x1, yB, x1, yT, 1, 0, 'wall', r);
      if (solidSide(t, 'T') && !solidSide(tile(w, c, r + 1), 'B')) addEdge(w, x0, yT, x1, yT, 0, -1, 'wall', r);
      if (solidSide(t, 'B') && !solidSide(tile(w, c, r - 1), 'T')) addEdge(w, x0, yB, x1, yB, 0, 1, 'wall', r);
      if (t === 'BR') addEdge(w, x0, yB, x1, yT, -S, -S, 'wall', r);
      if (t === 'BL') addEdge(w, x0, yT, x1, yB, S, -S, 'wall', r);
      if (t === 'TL') addEdge(w, x1, yT, x0, yB, S, S, 'wall', r);
      if (t === 'TR') addEdge(w, x0, yT, x1, yB, -S, S, 'wall', r);
    }
  }
  w.edgeRow = Math.max(w.edgeRow, upto);
}
function appendRows(w, rows) {
  const r0 = w.rows.length;
  for (const row of rows) w.rows.push(row);
  buildEdges(w, w.rows.length - 2);   // いちばん上の行は、上が決まってから
  return r0;
}
// トゲのマス → 当たる四角（となりの壁にくっついた側）
function spikeRect(w, c, r) {
  const x0 = c * CELL, x1 = x0 + CELL, yT = -(r + 1) * CELL, yB = -r * CELL, d = 11;
  if (isWall(raw(w, c - 1, r))) return [x0, yT + 2, x0 + d, yB - 2, 'L'];
  if (isWall(raw(w, c + 1, r))) return [x1 - d, yT + 2, x1, yB - 2, 'R'];
  if (isWall(raw(w, c, r - 1))) return [x0 + 2, yB - d, x1 - 2, yB, 'B'];
  if (isWall(raw(w, c, r + 1))) return [x0 + 2, yT, x1 - 2, yT + d, 'T'];
  return [x0 + 3, yT + 3, x1 - 3, yB - 3, ''];
}
function spikeHit(w, x, y) {
  const r0 = Math.floor(-(y + HIT) / CELL), r1 = Math.floor(-(y - HIT) / CELL), c0 = Math.floor((x - HIT) / CELL), c1 = Math.floor((x + HIT) / CELL);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (raw(w, c, r) !== '^') continue;
    const [a, b, cc, d, side] = spikeRect(w, c, r);
    const nx = clamp(x, a, cc), ny = clamp(y, b, d);
    if ((x - nx) ** 2 + (y - ny) ** 2 < HIT * HIT) return side || 'X';
  }
  return null;
}

/* =====================================================================
   動き（ゲームとチェックで共通）
   ===================================================================== */
function newBody(x, y, side) { return { x, y, vx: 0, vy: 0, side, wn: { x: -side || 1, y: 0 }, slideV: 0, ground: false, prevY: y, air: MOVE.airJumps, face: -side || 1 }; }
function collide(w, b, res) {
  const r0 = Math.floor(-(b.y + HB + 2) / CELL), r1 = Math.floor(-(b.y - HB - 2) / CELL);
  for (let r = Math.max(0, r0 - 1); r <= r1 + 1; r++) {

    else if (q.kind === 'spark') { ctx.globalAlpha = a; ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, 2, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
    else if (q.kind === 'puff') { ctx.globalAlpha = a; ctx.fillStyle = (q.r > 5 ? ART.scarf : ART.body); ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1.5 - a * 0.5), 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  }
  ctx.font = `800 13px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life); ctx.fillStyle = ART.mushCap; ctx.fillText(f.text, f.x, f.y); }
  ctx.globalAlpha = 1;
}
function heart(x, y, full) {
  const s = 12; ctx.beginPath(); ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y - s * 0.1, x - s * 0.55, y - s * 0.1, x - s * 0.55, y + s * 0.25);
  ctx.bezierCurveTo(x - s * 0.55, y + s * 0.55, x - s * 0.1, y + s * 0.7, x, y + s * 0.9);
  ctx.bezierCurveTo(x + s * 0.1, y + s * 0.7, x + s * 0.55, y + s * 0.55, x + s * 0.55, y + s * 0.25);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 0.1, x, y - s * 0.1, x, y + s * 0.3); ctx.closePath();

}
function drawHud() {
  ctx.fillStyle = ART.pill; rr(ctx, 8, 8, 64, 22, [11, 11, 11, 11]); ctx.fill();
  for (let i = 0; i < MAX_HP; i++) heart(22 + i * 18, 13, i < G.hp);
  const label = `${Math.floor(G.best)}m`;
  ctx.font = `800 15px ${FONT}`; const tw = ctx.measureText(label).width;
  ctx.fillStyle = ART.pill; rr(ctx, W / 2 - tw / 2 - 14, 8, tw + 28, 24, [12, 12, 12, 12]); ctx.fill();
  ctx.fillStyle = ART.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, W / 2, 20.5);
  ctx.font = `500 10px ${FONT}`; ctx.fillStyle = 'rgba(255,244,230,.6)'; ctx.fillText(poolAt(G.best).name, W / 2, 40);
  ctx.textAlign = 'right'; ctx.font = `500 11px ${FONT}`; ctx.fillText(G.time.toFixed(1) + 's', W - 12, 20);
  if (state === 'play' && G.lavaY > cam.y + H) {
    const m = Math.max(0, Math.round((G.lavaY - P.y) / PX_PER_M)), txt = `▼ 溶岩まで ${m}m`;
    ctx.font = `800 12px ${FONT}`; const w2 = ctx.measureText(txt).width + 24;
    ctx.fillStyle = m < 6 ? 'rgba(255,122,89,.9)' : ART.pill; rr(ctx, W / 2 - w2 / 2, H - 34, w2, 22, [11, 11, 11, 11]); ctx.fill();
    ctx.fillStyle = ART.ink; ctx.textAlign = 'center'; ctx.fillText(txt, W / 2, H - 23);
  }
  if (showCheck) { ctx.textAlign = 'left'; ctx.font = '11px system-ui'; ctx.fillStyle = '#0f0'; ctx.fillText(checkLabel, 8, 58); }
}

function draw() {
  const k = scale * dpr;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (!world) return;
  drawBackground();
  const sx = cam.shake ? (Math.random() - 0.5) * cam.shake : 0, sy = cam.shake ? (Math.random() - 0.5) * cam.shake : 0;
  ctx.save(); ctx.translate(sx, -cam.y + sy);
  const b0 = Math.floor(-(cam.y + H) / CELL / BAND) - 1, b1 = Math.floor(-cam.y / CELL / BAND) + 1;
  for (let b = b0; b <= b1; b++) { const band = bandCanvas(b); if (band) ctx.drawImage(band.c, 0, band.yTop, W, band.hpx); }
  if (debug) {
    ctx.font = '10px system-ui'; ctx.textAlign = 'left';
    for (const p of world.placed) { const y = -p.r0 * CELL; ctx.fillStyle = 'rgba(242,181,68,.7)'; ctx.fillRect(0, y, W, 1); ctx.fillText(p.id, 40, y - 4); }
    for (const list of world.edges) if (list) for (const e of list) {
      ctx.strokeStyle = e.ny < -0.8 ? '#0f0' : e.ny > 0.8 ? '#f44' : '#4af';
      ctx.beginPath(); ctx.moveTo(e.ax, e.ay); ctx.lineTo(e.bx, e.by); ctx.stroke();
    }
  }
  if (showCheck) drawCheck();
  for (const b of world.bats) if (Math.abs(b.y - P.y) < H) drawBat(b);
  if (state !== 'dying' && state !== 'end') drawPlayer();
  drawParticles();
  drawLava();
  ctx.restore();
  // 画面の上下を少し暗く（洞窟らしさ）
  const v = ctx.createLinearGradient(0, 0, 0, H);
  v.addColorStop(0, 'rgba(20,16,26,.35)'); v.addColorStop(0.15, 'rgba(20,16,26,0)'); v.addColorStop(0.85, 'rgba(20,16,26,0)'); v.addColorStop(1, 'rgba(20,16,26,.3)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (state !== 'title') drawHud();
}
// V：今いるパーツの到達チェック結果を重ねる（緑＝安全に出口へ行ける着地点、橙＝ダメージを受けないと進めない、赤＝詰み）
let checkLabel = '';
function drawCheck() {
  const pl = world.placed.find(p => -P.y / CELL >= p.r0 - 0.5 && -P.y / CELL <= p.r1 + 1) || world.placed[world.placed.length - 1];
  if (!checkCache[pl.id]) { checkCache[pl.id] = checkPiece(pl.id); }
  const res = checkCache[pl.id], base = -pl.r0 * CELL;
  checkLabel = `${pl.id}: ${res.ok ? 'OK' : 'NG'}  入口 ${res.entryOk}/${res.entries}  痛い場所 ${res.hurtSpots}  詰み ${res.softlocks}`;
  const col = { good: 'rgba(80,255,120,.8)', hurt: 'rgba(255,170,40,.9)', lock: 'rgba(255,40,40,1)' };
  for (const p of res.points) { ctx.fillStyle = col[p.kind]; ctx.fillRect(p.x - 2, base + p.y - 2, 4, 4); }
}

/* =====================================================================
   効果音（やわらか）
   ===================================================================== */
let actx = null, noiseBuf = null, muted = store.get('kabe_muted', false);
function audio() {
  if (muted) return null;
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, dur, type, vol, f2 = 0, delay = 0, attack = 0.004) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, hp, lp = 12000) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, s = a.createBufferSource(), g = a.createGain(), f1 = a.createBiquadFilter(), f2 = a.createBiquadFilter();
  s.buffer = noiseBuf; f1.type = 'highpass'; f1.frequency.value = hp; f2.type = 'lowpass'; f2.frequency.value = lp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f1).connect(f2).connect(g).connect(a.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  kick() { tone(300, 0.14, 'triangle', 0.12, 520); noise(0.04, 0.03, 3000, 6000); },
  air() { tone(660, 0.22, 'sine', 0.1, 990, 0, 0.01); tone(990, 0.18, 'sine', 0.05, 1320, 0.05, 0.01); },
  land() { tone(160, 0.08, 'sine', 0.1, 110, 0, 0.003); noise(0.04, 0.025, 400, 2000); },
  hurt() { tone(420, 0.3, 'triangle', 0.12, 160, 0, 0.003); tone(400, 0.3, 'triangle', 0.08, 150, 0.02, 0.003); },
  die() { tone(520, 0.5, 'triangle', 0.12, 140, 0, 0.003); tone(260, 0.6, 'sine', 0.1, 70, 0.08, 0.01); },
  lava() { tone(240, 0.9, 'sine', 0.14, 60, 0, 0.01); noise(0.8, 0.05, 100, 900); },
  tick() { tone(1320, 0.25, 'sine', 0.06, 0, 0, 0.005); },
  start() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.35, 'sine', 0.08, 0, i * 0.1, 0.01)); },
};

/* ---------- menus & loop ---------- */
const ov = { title: $('ovTitle'), pause: $('ovPause'), end: $('ovEnd') };
function showOnly(n) { for (const k in ov) ov[k].hidden = k !== n; }
function renderBest() { const b = store.get('kabe_best', 0); $('bestTitle').textContent = b ? `最高 ${b}m` : ''; }
function startGame() { showOnly(null); newGame(); state = 'play'; $('pauseBtn').hidden = false; acc = 0; last = performance.now(); sfx.start(); }
function showEnd() {
  const m = Math.floor(G.best), best = store.get('kabe_best', 0);
  if (m > best) store.set('kabe_best', m);
  $('endTitle').textContent = { lava: '溶岩に呑まれた', spike: 'トゲで力尽きた', bat: 'コウモリにやられた' }[G.cause] || 'おしまい';
  const st = $('endStats'); st.textContent = '';
  for (const [a, b, isNew] of [['高さ', m + 'm', m > best], ['タイム', G.time.toFixed(1) + '秒'], ['最高', Math.max(m, best) + 'm']]) {
    const dt = document.createElement('dt'); dt.textContent = a; const dd = document.createElement('dd'); dd.textContent = b + (isNew ? ' 新記録' : ''); if (isNew) dd.className = 'new'; st.append(dt, dd);
  }
  showOnly('end'); $('btnRetry').focus({ preventScroll: true });
}
const muteLabel = () => { $('btnMute').textContent = muted ? '音：オフ' : '音：オン'; };
$('btnMute').onclick = () => { muted = !muted; store.set('kabe_muted', muted); muteLabel(); if (!muted) sfx.tick(); };
muteLabel();
$('btnStart').onclick = startGame; $('btnRetry').onclick = startGame; $('btnQuit').onclick = startGame;
$('btnToTitle').onclick = () => { state = 'title'; newGame(); renderBest(); showOnly('title'); };
$('btnResume').onclick = () => { showOnly(null); state = 'play'; last = performance.now(); };
$('pauseBtn').onclick = () => { if (state === 'play') { state = 'pause'; showOnly('pause'); } };
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowUp') {
    if (e.target.tagName === 'BUTTON' && state !== 'play') return;
    e.preventDefault(); if (e.repeat) return;
    if (state === 'title') startGame(); else press();
  } else if (e.key === 'Escape' || e.key === 'p') { if (state === 'play') $('pauseBtn').onclick(); else if (state === 'pause') $('btnResume').onclick(); }
  else if (e.key === 'd' || e.key === 'D') debug = !debug;
  else if (e.key === 'v' || e.key === 'V') showCheck = !showCheck;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') $('pauseBtn').onclick(); });

let last = performance.now(), acc = 0;
function loop(now) {
  const frame = Math.min(0.1, Math.max(0, now - last) / 1000) * MOVE.speed; last = now;
  if (state === 'play') { acc += frame; while (acc >= DT && state === 'play') { update(DT); acc -= DT; } }
  else if (state === 'title') { G.time += frame; updateScarf(frame); }
  else if (state === 'dying') G.time += frame;
  updateEffects(frame);
  draw();
  requestAnimationFrame(loop);
}
resize(); renderBest(); newGame();
if (document.fonts && document.fonts.load) document.fonts.load(`800 15px "M PLUS Rounded 1c"`).catch(() => {});
requestAnimationFrame(loop);
window.__kabe = { checkAll, checkPiece, _dbg: { newWorld, appendRows, newBody, kick, physStep, airJump, canAct, spikeHit, collide }, CHECK, PIECES, get state() { return state; }, get P() { return P; }, get G() { return G; }, get world() { return world; }, press, startGame };
})();
