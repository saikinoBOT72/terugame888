<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<title>ふたりで — おばけじゃんぴんぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="catalog/project/tokens.css">
<style>
  /* 本編と同じ見た目（統一カタログの色・丸ゴシック・クリーム色のボタン）。赤はマフラーとハートだけなので、1P は水色・2P はからし色 */
  :root { --panel: var(--ui-panel); --cream: var(--ui-ink); --dim: var(--ui-muted); --p1: #8fd0ff; --p2: #f2b544;
    --st: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-right, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg-top, #1b1426); color: var(--cream); font: 500 14px/1.6 var(--font-round); overflow: hidden; overscroll-behavior: none; }
  *, *::before, *::after { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; }

  /* 2つの画面：ノッチ・ホームバーの内側。タイトルも左右に分かれて、それぞれの画面の中に出る（1P にモードとスタート） */
  #wrap { position: fixed; top: var(--st); right: var(--sr); bottom: var(--sb); left: var(--sl); display: flex; gap: 4px; background: #000; }
  .side { position: relative; flex: 1; min-width: 0; overflow: hidden; }
  .side iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .done { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20,15,28,.6); z-index: 3; pointer-events: none; }
  .done b { font-weight: 800; font-size: clamp(28px, 6vmin, 54px); paint-order: stroke fill; -webkit-text-stroke: 7px rgba(20,15,28,.92); }

  /* タイトルの下の帯（左右の画面のあいだ）：画質・コントローラーを選び直す */
  #bar { position: fixed; left: 50%; bottom: calc(var(--sb) + 8px); transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px);
    background: rgba(20,15,28,.85); border: 1px solid rgba(255,244,230,.14); border-radius: 999px; padding: 4px 6px 4px 6px; }

  /* 板（画面全体）：入りきらないときはスクロール */
  .ov { position: fixed; inset: 0; z-index: 5; display: flex; overflow: auto; touch-action: pan-y; background: rgba(20,15,28,.62);
    padding: calc(var(--st) + 14px) calc(var(--sr) + 14px) calc(var(--sb) + 14px) calc(var(--sl) + 14px); }
  .card { margin: auto; width: min(100%, 620px); display: grid; justify-items: center; gap: 12px; text-align: center;
    background: var(--panel); border-radius: 22px; padding: 22px 20px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .big2 { font-weight: 800; font-size: clamp(30px, 6vmin, 46px); line-height: 1.1; paint-order: stroke fill; -webkit-text-stroke: 6px rgba(20,15,28,.92); text-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .big2 .c1 { color: var(--p1); } .big2 .c2 { color: var(--p2); }
  .modeChip { font-weight: 800; font-size: 13px; color: var(--ui-panel, #1b1426); background: var(--glow); border-radius: 999px; padding: 1px 14px; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .btn { font: inherit; font-weight: 800; font-size: 18px; color: var(--ui-panel, #1b1426); background: var(--cream); border: 0; border-radius: 999px;
    padding: 11px 34px; cursor: pointer; box-shadow: 0 4px 0 var(--dim); transition: transform .1s, box-shadow .1s; }
  .btn.big { font-size: 22px; padding: 12px 52px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 4px 0 var(--dim), 0 0 0 7px rgba(255,244,230,.16); } }
  .btn:active { transform: translateY(3px) scale(.96); box-shadow: 0 1px 0 var(--dim); }
  .sub { font: inherit; font-size: 12.5px; color: var(--cream); background: transparent; border: 2px solid rgba(255,244,230,.25); border-radius: 999px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
  .sel, .btn:focus-visible, .sub:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }

  /* 3・2・1 */
  #ovCount { background: transparent; pointer-events: none; }
  #count { margin: auto; font-weight: 800; font-size: clamp(90px, 24vmin, 200px); color: var(--glow); paint-order: stroke fill; -webkit-text-stroke: 12px rgba(20,15,28,.9); text-shadow: 0 8px 0 rgba(0,0,0,.35); }
  #count.go { font-size: clamp(56px, 14vmin, 120px); color: var(--cream); }
  #count.pop { animation: pop .55s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(1.8); opacity: 0; } 40% { opacity: 1; } to { transform: scale(1); } }

  /* 結果 */
  .res { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
  .rc { --c: var(--p1); display: grid; justify-items: center; gap: 2px; padding: 10px 8px; border-radius: 18px; background: rgba(0,0,0,.22); border: 3px solid transparent; }
  .rc.p2 { --c: var(--p2); }
  .rc.won { border-color: var(--c); }
  .rc .tag { font-weight: 800; color: #1b1426; background: var(--c); border-radius: 999px; padding: 0 12px; }
  .rc canvas { width: 110px; height: 88px; }
  .rc .m { font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
  .rc .why { font-size: 12px; color: var(--dim); min-height: 1.5em; }

  #toast { position: fixed; left: 50%; top: calc(var(--st) + 12px); transform: translateX(-50%); z-index: 9; background: rgba(20,15,28,.92); color: var(--cream);
    padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 800; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <div class="side" id="s0"><div class="done" id="d0" hidden><b></b></div></div>
  <div class="side" id="s1"><div class="done" id="d1" hidden><b></b></div></div>
</div>

<div id="bar">
  <button class="sub" id="btnFx" type="button">画質：きれい</button>
  <button class="sub" id="btnReset" type="button">コントローラーを選び直す</button>
</div>

<section class="ov" id="ovCount" hidden><div id="count">3</div></section>

<!-- 一時停止 -->
<section class="ov" id="ovPause" hidden>
  <div class="card" style="width:min(100%,360px)">
    <div class="big2">一時停止</div>
    <span class="modeChip" id="pauseMode"></span>
    <button class="btn big" id="btnResume" type="button" data-nav>つづける</button>
    <div class="row"><button class="sub" id="btnRestart" type="button" data-nav>やり直す</button><button class="sub" id="btnQuit" type="button" data-nav>タイトルへ</button></div>
  </div>
</section>

<!-- 結果 -->
<section class="ov" id="ovEnd" hidden>
  <div class="card">
    <span class="modeChip" id="endMode"></span>
    <div class="big2" id="winTitle"></div>
    <div class="res">
      <div class="rc" id="rc0"><span class="tag">1P</span><canvas id="rv0" width="220" height="176"></canvas><span class="m" id="rm0"></span><span class="why" id="rw0"></span></div>
      <div class="rc p2" id="rc1"><span class="tag">2P</span><canvas id="rv1" width="220" height="176"></canvas><span class="m" id="rm1"></span><span class="why" id="rw1"></span></div>
    </div>
    <div class="row"><button class="btn big" id="btnAgain" type="button" data-nav>もう一回</button></div>
    <div class="row"><button class="sub" id="btnMenu" type="button" data-nav>タイトルへ</button></div>
  </div>
</section>
<div id="toast" hidden></div>

<script src="catalog/project/components/bundle.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const ready = [false, false], frames = [], NAME = ['1P', '2P'];
const MODE_NAME = { simple: 'シンプルジャンプモード', advance: 'アドバンスモード' };
let phase = 'start', seed = 0, actx = null, endAt = 0, fx = store.get('kabe_vs_fx', true), result = null, countDrawn = false, mode = 'advance';
// 2人で1つ：溶岩（ゲームの座標。上がマイナス）・試合の時計（秒。障害物はこれで動くので2人とも同じ動きになる）
const world = { y: 200, delay: 3, clock: 0 };

function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2600); }

// 音：親ページで1つ作り、2つの画面が使う（iPad はタップした所でしか音を出せないため）
function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
addEventListener('pointerdown', unlockAudio, true);

/* ---------- 本編（iframe）とのやりとり ---------- */
const api = i => { try { return frames[i].contentWindow.__vs || null; } catch (e) { return null; } };
window.__vsAudio = () => { unlockAudio(); return actx; };
window.__vsReady = side => {
  ready[side] = true; const a = api(side); if (!a) return;
  a.fx(fx); padsChanged();
  if (ready[0] && ready[1]) { mode = api(0).modeNow(); api(1).mode(mode); }
};
window.__vsStart = m => { mode = m; unlockAudio(); start(); };          // 1P のタイトルの「スタート」
window.__vsMode = m => { mode = m; const b = api(1); if (b) b.mode(m); };   // 1P がモードを選んだ → 2P のタイトルにも出す
window.__vsBack = () => { location.href = './'; };                       // 1P のタイトルの「もどる」
window.__vsEnd = () => {};   // 勝ち負けは毎フレームの loop で見る
window.__vsLava = y => { world.y = Math.min(world.y, y); world.delay = 0; };   // ガチャ所の「溶岩を近づける」（相手の 2m 下までは本編側で止めてある）
for (const i of [0, 1]) {
  const f = document.createElement('iframe');
  f.src = `index.html?vs=${i}&seed=1`; f.title = NAME[i]; f.setAttribute('scrolling', 'no'); f.setAttribute('allow', 'autoplay; gamepad');
  $('s' + i).prepend(f); frames.push(f);
}

/* ---------- 結果のおばけ（本編と同じ Kabe で、その人のマフラーの色で描く） ---------- */
const PAL = Kabe.stagePal('underground', 0);
function drawGhost(cv, scarf, side, pose, t) {
  const g = cv.getContext('2d'), w = cv.width, h = cv.height, c = Kabe.SCARF.color;
  g.clearRect(0, 0, w, h);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(w / 2, h * 0.86, w * 0.2, h * 0.05, 0, 0, Math.PI * 2); g.fill();
  Kabe.SCARF.color = scarf || 'red';
  try { Kabe.ghost(g, PAL, 'sheet', pose, w / 2, h * 0.5 + (pose === 'cheer' ? Math.sin(t * 6) * 3 : Math.sin(t * 2.2 + side) * 2), t, side ? -1 : 1, h / 52); }
  finally { Kabe.SCARF.color = c; }
}

/* ---------- 画質（2画面ぶん描くので重ければ「かるい」に） ---------- */
function setFx(on, auto) {
  fx = on; store.set('kabe_vs_fx', on); $('btnFx').textContent = '画質：' + (on ? 'きれい' : 'かるい');
  for (const i of [0, 1]) { const a = api(i); if (a) a.fx(on); }
  if (auto) toast('重かったので画質を「かるい」にした');
}
$('btnFx').onclick = () => setFx(!fx);
setFx(fx);
const perf = { t: 0, n: 0, sum: 0 };   // 始まってから数秒の FPS を見る
function watchFps(g, dt) {
  if (!fx || perf.t > 8) return;
  perf.t += dt; if (perf.t < 2) return;
  perf.n++; perf.sum += Math.min(g[0].fps, g[1].fps);
  if (perf.t > 8 && perf.sum / perf.n < 42) setFx(false, true);
}

/* ---------- 親の板（一時停止・結果）のメニュー：スティックの左右で選んで A で決定 ---------- */
const OVS = ['ovCount', 'ovPause', 'ovEnd'];
const nav = { box: null, i: 0 };
let usingPad = false;
function show(id) {
  for (const k of OVS) $(k).hidden = k !== id;
  $('bar').hidden = phase !== 'start';
  nav.box = id ? $(id) : null; nav.i = Math.max(0, navItems().findIndex(b => b.classList.contains('big'))); markSel();   // はじめは大きいボタン
}
const navItems = () => nav.box ? [...nav.box.querySelectorAll('[data-nav]')].filter(b => !b.disabled && b.offsetParent) : [];
function markSel() { const it = navItems(); for (const [i, b] of it.entries()) b.classList.toggle('sel', i === nav.i && usingPad); }
function menuKey(k) {
  const it = navItems(); if (!it.length || k === 'B') return;
  if (!usingPad) { usingPad = true; markSel(); if (k !== 'A') return; }
  if (k === 'A') { it[nav.i].click(); return; }
  nav.i = (nav.i + (k === 'SL' ? -1 : 1) + it.length) % it.length; markSel();
}

/* ---------- 試合の流れ：タイトル（左右に分かれる）→ 3・2・1 → プレイ（一時停止）→ 結果 ---------- */
function start() {
  if (phase !== 'start' && phase !== 'end' && phase !== 'pause') return;
  if (!ready[0] || !ready[1] || !api(0) || !api(1)) { toast('よみこみ中…もう少し待ってね'); return; }
  unlockAudio();
  phase = 'count'; show('ovCount'); countDrawn = false; for (const i of [0, 1]) $('d' + i).hidden = true;
  seed = (Math.random() * 4294967295) >>> 0 || 1;
  api(0).start(seed, mode); api(1).start(seed, mode);   // 先に作って見せておき、数え終わるまで動かさない
  const g = api(0).get(); world.y = g.lavaY; world.delay = g.delay; world.clock = 0;
  const steps = ['3', '2', '1', 'スタート！'];
  const tick = i => {
    const el = $('count'); el.textContent = steps[i]; el.className = i === 3 ? 'go' : ''; void el.offsetWidth; el.classList.add('pop');
    if (i < 3) { setTimeout(() => tick(i + 1), 650); return; }
    phase = 'play'; lastT = performance.now(); perf.t = perf.n = perf.sum = 0;
    setTimeout(() => { if (phase === 'play') show(null); }, 600);
  };
  tick(0);
}
function pause() {
  if (phase !== 'play') return;
  phase = 'pause'; $('pauseMode').textContent = MODE_NAME[mode]; show('ovPause');
  for (const i of [0, 1]) for (const k of PAD_KEYS) { const a = api(i); if (a) a.input(k, false); }
}
function resume() { if (phase !== 'pause') return; phase = 'play'; show(null); lastT = performance.now(); }
function toTitle() { phase = 'start'; show(null); for (const i of [0, 1]) { const a = api(i); if (a) a.title(); $('d' + i).hidden = true; } }
$('btnAgain').onclick = start; $('btnRestart').onclick = start;
$('btnResume').onclick = resume; $('btnQuit').onclick = toTitle; $('btnMenu').onclick = toTitle;

const CAUSE = { lava: '呑まれた', spike: 'トゲで力尽きた', box: 'トゲの箱で力尽きた', spin: '回る棒で力尽きた', pend: '振り子で力尽きた', ball: '鉄球で力尽きた', mine: '機雷で力尽きた', bend: 'トゲブロックで力尽きた' };
// 勝負がついた：out[i] が true の人が落ちた（2人同時なら高い方の勝ち）
function decide(out, g) {
  phase = 'over';
  for (const i of [0, 1]) { if (!out[i]) api(i).halt(); }
  const win = out[0] && out[1] ? (g[0].m === g[1].m ? -1 : g[0].m > g[1].m ? 0 : 1) : out[0] ? 1 : 0;
  for (const i of [0, 1]) {
    const d = $('d' + i), b = d.querySelector('b'); d.hidden = false;
    b.textContent = win < 0 ? 'ひきわけ' : i === win ? 'かち！' : 'まけ'; b.style.color = i === win ? `var(--p${i + 1})` : 'var(--cream)';
  }
  result = { win, out, g };
  setTimeout(() => {
    phase = 'end';
    $('endMode').textContent = MODE_NAME[mode];
    $('winTitle').innerHTML = win < 0 ? 'ひきわけ！' : `<span class="c${win + 1}">${NAME[win]}</span> のかち！`;
    for (const i of [0, 1]) {
      $('rc' + i).classList.toggle('won', i === win);
      $('rm' + i).textContent = g[i].m + 'm';
      const why = out[i] ? (g[i].cause === 'lava' || g[i].sunk ? g[i].rise + 'に呑まれた' : CAUSE[g[i].cause] || '落ちた') : '';
      $('rw' + i).textContent = mode === 'simple' ? [why, `やられた ${g[i].downs}回`].filter(Boolean).join('・') : why || `結晶 ${g[i].got}個`;
    }
    show('ovEnd'); endAt = performance.now();
  }, 1400);
}

/* ---------- 入力：k は A（画面の右）・B（画面の左）・SR（右下）・SL（左下）・P（一時停止） ---------- */
const PAD_KEYS = ['A', 'B', 'SR', 'SL'];
function input(side, k, down) {
  if (phase === 'play') {
    if (k === 'P') { if (down) pause(); return; }
    const a = api(side); if (a) a.input(k, down); return;
  }
  if (phase === 'start') { if (k !== 'P') { const a = api(side); if (a) a.input(k, down); } return; }   // タイトル：それぞれの画面のメニュー（1P はモード・スタート、2P は着せ替え）
  if (!down || phase === 'count' || phase === 'over') return;
  if (phase === 'end' && performance.now() - endAt < 1500) return;   // 結果が出てすぐの連打では押さない
  if (k === 'P') { if (phase === 'pause') resume(); return; }
  menuKey(k);
}
const KEYS = { d: [0, 'A'], a: [0, 'B'], c: [0, 'SR'], z: [0, 'SL'], ' ': [0, 'A'],
  ArrowRight: [1, 'A'], ArrowLeft: [1, 'B'], '.': [1, 'SR'], ',': [1, 'SL'], Enter: [1, 'A'], Escape: [0, 'P'], p: [0, 'P'] };
const keyOf = key => KEYS[key.length === 1 ? key.toLowerCase() : key];
function onKey(key, down, repeat) { const m = keyOf(key); if (m && !repeat) input(m[0], m[1], down); }
window.__vsKey = onKey;   // 画面（iframe）に入力が向いていても、ここに届く
addEventListener('keydown', e => { if (keyOf(e.key)) e.preventDefault(); onKey(e.key, true, e.repeat); });
addEventListener('keyup', e => onKey(e.key, false, false));
addEventListener('pointermove', () => { if (usingPad) { usingPad = false; markSel(); } });

/* ---------- コントローラー ----------
   ボタンを押した順に 1P・2P（参加）。リモコンなどコントローラー扱いの機器が混ざっても、押さなければ入らない。
   Safari は入力が向いているページにしか状態を渡さないことがあるので、親と左右の画面の両方から読んで新しい方を使う。
   割り当て：A（ボタン0）＝画面の右、B（ボタン1）＝画面の左、左スティック（十字キーも）右＝右下・左＝左下、スタート（9・セレクト 8）＝一時停止。
   スティックは倒し始め 0.55・戻し 0.35 で切り替える（真ん中付近でばたつかない）。標準の並びでないものは十字キーの代わりにハット（軸9） */
const slot = [null, null], prev = [{}, {}], padName = ['', ''];
function padKeys(p, was) {
  const b = i => !!(p.buttons[i] && p.buttons[i].pressed), x = p.axes[0] || 0;
  const std = p.mapping === 'standard', hat = !std && p.axes.length > 9 ? p.axes[9] : 9;   // ハット：-1 上・-0.43 右・0.14 下・0.71 左（離すと 3.3）
  const dl = std ? b(14) : hat > 0.3 && hat < 1.1, dr = std ? b(15) : hat > -0.8 && hat < -0.1;
  return { A: b(0), B: b(1), SR: dr || x > (was.SR ? 0.35 : 0.55), SL: dl || x < (was.SL ? -0.35 : -0.55), P: b(9) || b(8) };
}
function allPads() {
  const map = new Map(), navs = [navigator];
  for (const f of frames) { try { navs.push(f.contentWindow.navigator); } catch (e) {} }
  for (const n of navs) {
    let list; try { list = n.getGamepads ? n.getGamepads() : []; } catch (e) { continue; }
    for (const p of list || []) if (p && p.connected) { const o = map.get(p.index); if (!o || p.timestamp > o.timestamp) map.set(p.index, p); }
  }
  return map;
}
const anyPressed = p => p.buttons.some(b => b && b.pressed);
const nameOf = p => (p.id || '').replace(/\s*\(.*$/, '').replace(/^[0-9a-f]{4}-[0-9a-f]{4}-/i, '').slice(0, 22) || 'コントローラー';
// それぞれの画面のタイトルに、参加したコントローラーの名前を出す
function padsChanged() { for (const i of [0, 1]) { const a = api(i); if (a) a.pad(padName[i] || null); } }
$('btnReset').onclick = () => { slot[0] = slot[1] = null; prev[0] = {}; prev[1] = {}; padName[0] = padName[1] = ''; padsChanged(); toast('ボタンを押した順に 1P・2P になる'); };
function pollPads() {
  const pads = allPads();
  for (const i of [0, 1]) if (slot[i] != null && !pads.has(slot[i])) { slot[i] = null; prev[i] = {}; padName[i] = ''; padsChanged(); pause(); toast(`${NAME[i]} のコントローラーが外れた`); }
  for (const [idx, p] of pads) {
    if (slot.includes(idx) || !anyPressed(p)) continue;
    const i = slot.indexOf(null); if (i < 0) break;
    slot[i] = idx; prev[i] = padKeys(p, {}); padName[i] = nameOf(p); padsChanged();   // 参加したボタンは操作にしない
    usingPad = true; markSel(); toast(`${NAME[i]} にコントローラーが入った`);
  }
  for (const i of [0, 1]) {
    const p = slot[i] != null ? pads.get(slot[i]) : null;
    if (!p) continue;
    const now = padKeys(p, prev[i]);
    for (const k of [...PAD_KEYS, 'P']) if (now[k] !== !!prev[i][k]) input(i, k, now[k]);
    prev[i] = now;
  }
}

/* ---------- 溶岩（2人で1つ） ----------
   基本の速さ ×（ブレーキ（3m以内で持っている人がいれば）＋ 2人の欲ばりの上乗せ） */
let lastT = performance.now();
function lavaStep(g, dt) {
  if (world.delay > 0) { world.delay -= dt; return; }
  world.y -= g[0].speed * (Math.min(g[0].brake, g[1].brake) + g[0].greed + g[1].greed) * dt;
}

/* ---------- 毎フレーム：コントローラー → 溶岩と時計 → 2つの画面を同じフレームで動かす ---------- */
function loop() {
  const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;   // 本編と同じく 0.1 秒まで
  pollPads();
  const a0 = api(0), a1 = api(1), g = a0 && a1 ? [a0.get(), a1.get()] : null;
  if (g && g[0] && g[1]) {
    if (phase === 'play') { lavaStep(g, dt); world.clock += dt; }
    a0.put(g[1], world); a1.put(g[0], world);
    // 一時停止・数えている間は止める（数え始めに1回だけ描いて、新しい縦穴を見せておく）
    if (phase !== 'pause' && phase !== 'count') { a0.frame(); a1.frame(); }
    else if (phase === 'count' && !countDrawn) { a0.frame(); a1.frame(); countDrawn = true; }
    if (phase === 'play') {
      watchFps(g, dt);
      const out = g.map(x => x.sunk || ((x.st === 'dying' || x.st === 'end') && !x.down));   // シンプルジャンプの復活待ち（down）は負けにしない
      if (out[0] || out[1]) decide(out, g);
    }
  }
  if (phase === 'end' && result) for (const i of [0, 1]) drawGhost($('rv' + i), result.g[i].scarf, i, result.win < 0 ? 'stand' : i === result.win ? 'cheer' : 'dizzy', now / 1000);
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
show(null);
requestAnimationFrame(loop);
})();
</script>
