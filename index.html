<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--BODY-START-->
<title>蹴り登りの塔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  /* Layout: one fixed-ratio 360x640 game frame, centered and scaled to fit; menus are overlays inside the frame. */
  :root {
    --ink: #f3ecd8;
    --ink-dim: #a99f8a;
    --stone: #14121c;
    --gold: #ffd34d;
    --ember: #ff6a3d;
    --font-pixel: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  html { box-sizing: border-box; }
  body {
    background: var(--stone); color: var(--ink);
    font-family: var(--font-pixel);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
  #frame { position: relative; --u: 1; box-shadow: 0 0 0 1px #2a2638, 0 20px 60px rgba(0,0,0,.6); }
  #cv { display: block; touch-action: none; cursor: pointer; }
  .ov {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 12px);
    padding: calc(var(--u) * 20px);
    background: rgba(10, 8, 16, 0.72);
    text-align: center; font-size: calc(var(--u) * 13px); line-height: 1.6;
    box-sizing: border-box;
  }
  .ov h1 {
    margin: 0; font-weight: 400; font-size: calc(var(--u) * 40px); line-height: 1.1; letter-spacing: .04em;
    text-shadow: 0 calc(var(--u)*3px) 0 #000, 0 0 calc(var(--u)*18px) rgba(255,106,61,.55);
  }
  .ov h2 { margin: 0; font-weight: 400; font-size: calc(var(--u) * 24px); letter-spacing: .06em; }
  .ov p { margin: 0; color: var(--ink-dim); }
  .eyebrow { font-size: calc(var(--u) * 11px); letter-spacing: .3em; color: var(--ember); }
  .how { display: grid; gap: calc(var(--u) * 4px); text-align: left; }
  .how div { display: flex; gap: calc(var(--u) * 8px); align-items: baseline; }
  .how b { font-weight: 400; color: var(--gold); min-width: calc(var(--u) * 92px); }
  .btn {
    font: inherit; font-size: calc(var(--u) * 16px);
    color: #1a1208; background: var(--gold); border: 0; border-radius: calc(var(--u) * 3px);
    padding: calc(var(--u) * 10px) calc(var(--u) * 26px);
    box-shadow: 0 calc(var(--u)*4px) 0 #8a6a12; cursor: pointer;
  }
  .btn:active { transform: translateY(calc(var(--u)*3px)); box-shadow: 0 calc(var(--u)*1px) 0 #8a6a12; }
  .btn:focus-visible, .sub:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .sub {
    font: inherit; font-size: calc(var(--u) * 12px); color: var(--ink);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); border-radius: calc(var(--u) * 3px);
    padding: calc(var(--u) * 6px) calc(var(--u) * 10px); cursor: pointer;
  }
  .best { font-size: calc(var(--u) * 12px); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: auto auto; gap: calc(var(--u) * 2px) calc(var(--u) * 18px); font-variant-numeric: tabular-nums; text-align: left; margin: 0; }
  .stats dt { color: var(--ink-dim); }
  .stats dd { margin: 0; text-align: right; }
  .newbest { color: var(--gold); }
  #pauseBtn {
    position: absolute; right: calc(var(--u) * 6px); bottom: calc(var(--u) * 6px);
    width: calc(var(--u) * 30px); height: calc(var(--u) * 30px);
    font: inherit; font-size: calc(var(--u) * 12px); color: var(--ink);
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.2); border-radius: calc(var(--u) * 3px); cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div id="frame">
    <canvas id="cv" aria-label="ゲーム画面"></canvas>
    <button id="pauseBtn" type="button" aria-label="一時停止" hidden>II</button>

    <section id="ovTitle" class="ov">
      <div class="eyebrow">PROTOTYPE ・ 0〜100m</div>
      <h1>蹴り登りの塔</h1>
      <p>壁を蹴って、下から迫る溶岩より速く登れ。</p>
      <div class="how">
        <div><b>壁でタップ</b><span>反対の壁へ蹴り跳ぶ</span></div>
        <div><b>空中でタップ</b><span>2段ジャンプ（壁に着くと回復）</span></div>
        <div><b>トゲ・コウモリ</b><span>触れるとHP-1</span></div>
        <div><b>溶岩</b><span>触れたら終わり</span></div>
      </div>
      <button class="btn" id="btnStart" type="button">登りはじめる</button>
      <div class="best" id="bestTitle"></div>
      <button class="sub" id="btnMute" type="button">音：オン</button>
    </section>

    <section id="ovPause" class="ov" hidden>
      <h2>一時停止</h2>
      <button class="btn" id="btnResume" type="button">つづける</button>
      <button class="sub" id="btnQuit" type="button">やり直す</button>
    </section>

    <section id="ovEnd" class="ov" hidden>
      <div class="eyebrow" id="endEyebrow">GAME OVER</div>
      <h2 id="endTitle">溶岩に呑まれた</h2>
      <p id="endNote" hidden></p>
      <dl class="stats" id="endStats"></dl>
      <button class="btn" id="btnRetry" type="button">もう一度登る</button>
      <button class="sub" id="btnToTitle" type="button">タイトルへ</button>
    </section>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   TUNING  — 操作感・難しさの数値はここにまとめる
   ===================================================================== */
const W = 360, H = 640;              // 画面（論理ピクセル）
const PR = 11;                       // プレイヤー半径（見た目）
const HB = 10;                       // 壁・床との当たり判定の半径
const HIT = PR - 3;                  // トゲ・敵との当たり判定（見た目より少し小さく）
const PX_PER_M = 60;                 // 1m = 60px（100m = 6000px）

const GRAVITY = 640;                 // 小さいほどふわっと（落下速度の上限なし＝素直な放物線）
const KICK_VX = 270;                 // 壁キックの横速度
const KICK_VY = 440;                 // 壁キックの上向き速度
const AIR_JUMPS = 1;                 // 2段ジャンプの回数（基本1回）
const AIR_JUMP_VY = 380;             // 2段ジャンプの上向き速度
const AIR_JUMP_MODE = 'keep';        // 'keep' = 向きそのまま / 'flip' = 向きを反転
const SLIDE_SPEED = 74;              // 壁をずり落ちる速さ
const INPUT_BUFFER = 0.14;           // 着地直前の入力を覚えておく秒数

const MAX_HP = 3;
const INVINCIBLE = 1.1;              // 被弾後の無敵時間

const LAVA_DELAY = 2.0;              // スタートから溶岩が動き出すまで
const LAVA_SPEED_BASE = 28;          // px/s
const LAVA_SPEED_PER_M = 0.3;        // 高さ1mごとに足す速さ
const LAVA_CATCHUP = 0.9;            // 画面外に離れすぎたら追いつく強さ
const LAVA_LEASH = 160;              // 画面下端からこれ以上離れると追いつき始める（px）

const MIN_WALL = 16;                 // 壁の最低の厚み
const MAX_INNER = W - MIN_WALL * 2;  // 縦穴のいちばん広い幅
const START_L = 34, START_R = W - 34;// スタート地点の縦穴
const BAT_FROM_M = 15;               // コウモリが出はじめる高さ
const BAT_R = 9;                     // コウモリの当たり判定

const PROTO_LIMIT_M = 100;           // 叩き台はここまで

/* =====================================================================
   ZONES — 100mごとに地形の作り方を切り替える
   ゾーンごとに「地形パーツ」の出やすさ（重み）を決める。
   パーツ = 縦穴を数m〜10mぶん作る関数（下の CHUNKS）。
   ===================================================================== */
const ZONES = [
  {
    from: 0, to: 100, name: '苔むす縦穴',
    theme: { bg: '#0d1714', far: '#14231d', wall: '#2c4a3c', wall2: '#355645', mortar: '#13201b', accent: '#9be37a', plank: '#7a5a3a' },
    // d = ゾーン内の難しさ 0→1、m = 高さ(m)
    weights: (d, m) => ({
      straight: 22, side: 12, lean: 12 + 8 * d, funnel: 12, zigzag: 5 + 10 * d,
      shelves: 10, platforms: 9, pillar: m > 20 ? 6 + 8 * d : 0,
    }),
  },
  // { from: 100, to: 200, name: '錆びた坑道', theme: {...}, weights: ... },
];
const zoneAt = m => ZONES.find(z => m >= z.from && m < z.to) || ZONES[ZONES.length - 1];

/* ---------- 地形パーツ ----------
   どれも (g, y, d, m) を受け取り、y から上へ地形を作って、てっぺんの y を返す。
   g.pt(side, x, y)   左(-1)/右(1)の壁の線を (x, y) まで伸ばす（同じ y なら段差、違う x なら斜め）
   g.poly(points)     縦穴の中の岩（時計回り）  g.plank(x0, x1, y)  下から抜けられる足場
   g.L / g.R          今の左右の壁の位置 */
const CHUNKS = {
  // まっすぐ。幅と位置はランダム
  straight(g, y, d, m) {
    const w = pickWidth(d), cx = pickCenter(w, d);
    y = goTo(g, y, cx - w / 2, cx + w / 2);
    const top = y - rand(300, 600) * (w < 170 ? 0.8 : 1);
    up(g, top);
    hazards(g, y, top, d, m, { bats: w >= 170, narrow: w < 170 });
    return top;
  },
  // 左右どちらかの端に寄った細めの縦穴
  side(g, y, d, m) {
    const w = rand(125, 200), L = rng() < 0.5 ? MIN_WALL : W - MIN_WALL - w;
    y = goTo(g, y, L, L + w);
    const top = y - rand(320, 560);
    up(g, top);
    hazards(g, y, top, d, m, { bats: w >= 170, narrow: w < 170 });
    return top;
  },
  // 両方の壁が同じ向きに傾いた、斜めの煙突
  lean(g, y, d, m) {
    const w = rand(150, 250), cx = pickCenter(w, d);
    y = goTo(g, y, cx - w / 2, cx + w / 2);
    const lo = MIN_WALL, hi = W - MIN_WALL - w;
    let dx = rand(70, 160) * (rng() < 0.5 ? -1 : 1);
    if (g.L + dx < lo || g.L + dx > hi) dx = -dx;
    dx = clamp(g.L + dx, lo, hi) - g.L;
    const top = y - Math.max(rand(300, 500), Math.abs(dx) / 0.45);
    g.pt(-1, g.L + dx, top); g.pt(1, g.R + dx, top);
    hazards(g, y, top, d, m, { bats: w >= 170, narrow: w < 170 });
    return top;
  },
  // じわじわ狭くなる／広くなる
  funnel(g, y, d, m) {
    const w0 = g.R - g.L;
    let w1 = pickWidth(d);
    if (Math.abs(w1 - w0) < 80) w1 = w0 > 200 ? rand(115, 150) : rand(270, MAX_INNER);
    const cx1 = pickCenter(w1, d), L1 = cx1 - w1 / 2, R1 = cx1 + w1 / 2;
    const top = y - Math.max(rand(280, 440), Math.abs(L1 - g.L) / 0.6, Math.abs(R1 - g.R) / 0.6);
    g.pt(-1, L1, top); g.pt(1, R1, top);
    hazards(g, y, top, d, m, { bats: Math.min(w0, w1) >= 170, narrow: Math.min(w0, w1) < 170 });
    return top;
  },
  // 左右に何度も曲がるクネクネ道（段差か斜め）
  zigzag(g, y, d, m) {
    const w = rand(150, 215), cx = pickCenter(w, d);
    y = goTo(g, y, cx - w / 2, cx + w / 2);
    let dir = rng() < 0.5 ? -1 : 1;
    const n = 3 + (rng() < 0.5 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      y -= rand(110, 170); up(g, y);
      let shift = rand(40, 85) * dir;
      shift = clamp(g.L + shift, MIN_WALL, W - MIN_WALL - w) - g.L;
      dir = -dir;
      if (rng() < 0.6) { y -= rand(30, 60); g.pt(-1, g.L + shift, y); g.pt(1, g.R + shift, y); }
      else { g.pt(-1, g.L + shift, y); g.pt(1, g.R + shift, y); }
    }
    y -= 100; up(g, y);
    return y;
  },
  // 壁から張り出した岩棚（上に立てる・下は天井）
  shelves(g, y, d, m) {
    const w = rand(240, MAX_INNER), cx = pickCenter(w, d);
    y = goTo(g, y, cx - w / 2, cx + w / 2);
    const top = y - rand(480, 680);
    up(g, top);
    let sy = y - rand(90, 140), side = rng() < 0.5 ? -1 : 1;
    while (sy > top + 90) {
      const sw = rand(55, Math.min(115, w * 0.42));
      if (side < 0) g.poly(rectPts(g.L - 12, sy - 14, g.L + sw, sy));
      else g.poly(rectPts(g.R - sw, sy - 14, g.R + 12, sy));
      sy -= rand(140, 200); side = -side;
    }
    return top;
  },
  // 宙に浮いた板の足場（下から抜けられる）
  platforms(g, y, d, m) {
    const w = rand(250, MAX_INNER), cx = pickCenter(w, d);
    y = goTo(g, y, cx - w / 2, cx + w / 2);
    const top = y - rand(480, 680);
    up(g, top);
    let sy = y - rand(100, 150);
    while (sy > top + 80) {
      const pw = rand(60, 100), x0 = rand(g.L + 30, g.R - 30 - pw);
      g.plank(x0, x0 + pw, sy);
      if (m > BAT_FROM_M && rng() < lerp(0.15, 0.4, d)) g.addBat(sy - rand(50, 80), lerp(45, 80, d));
      sy -= rand(130, 190);
    }
    return top;
  },
  // 真ん中に柱。左右2本の細い道に分かれる（柱にも張り付ける）
  pillar(g, y, d, m) {
    const w = rand(270, MAX_INNER), cx = clamp(W / 2 + rand(-15, 15), MIN_WALL + w / 2, W - MIN_WALL - w / 2);
    y = goTo(g, y, cx - w / 2, cx + w / 2);
    const top = y - rand(420, 620);
    up(g, top);
    const pw = rand(44, Math.min(90, w - 180));
    const pcx = (g.L + g.R) / 2 + rand(-1, 1) * Math.max(0, (w - 180 - pw) / 2) * 0.6;
    const pt = top + 70, pb = y - 70, k = pw * 0.45;
    g.poly([[pcx, pt], [pcx + pw / 2, pt + k], [pcx + pw / 2, pb - k], [pcx, pb], [pcx - pw / 2, pb - k], [pcx - pw / 2, pt + k]]);
    return top;
  },
};

// 区間の中にトゲとコウモリを置く（区間の端から40pxは空ける）
function hazards(g, yBot, yTop, d, m, o) {
  let sy = yBot - 40;
  for (;;) {
    const gap = lerp(180, 105, d) * rand(0.85, 1.15) * (o.narrow ? 1.25 : 1);
    const len = Math.min(o.narrow ? 110 : 160, lerp(50, 140, d) * rand(0.8, 1.2));
    const gapBottom = sy;
    sy -= gap;
    if (sy - len < yTop + 40) break;
    if (o.bats && m > BAT_FROM_M && rng() < lerp(0.25, 0.6, d)) g.addBat((gapBottom + sy) / 2, lerp(45, 85, d) * rand(0.85, 1.15));
    const side = rng() < 0.5 ? -1 : 1;
    if (!g.addSpike(side, sy - len, sy)) g.addSpike(-side, sy - len, sy);
    if (rng() < lerp(0, 0.5, d)) {   // 上の方では反対の壁にも少しずらしてもう1本
      const y2 = sy - len - rand(90, 130), len2 = Math.min(140, len * rand(0.7, 1.0));
      if (y2 - len2 > yTop + 40 && g.addSpike(-side, y2 - len2, y2)) sy = y2 - len2 + 60;
    }
    sy -= len;
  }
}
function pickWidth(d) {
  const r = rng(), pn = lerp(0.15, 0.35, d);
  return r < pn ? rand(115, 165) : r < pn + 0.3 ? rand(260, MAX_INNER) : rand(170, 255);
}
function pickCenter(w, d) {
  const lo = MIN_WALL + w / 2, hi = W - MIN_WALL - w / 2;
  return rng() < lerp(0.3, 0.6, d) ? rand(lo, hi) : clamp(W / 2 + rand(-25, 25), lo, hi);
}
// 今の壁から新しい壁の位置へ：段差か斜めでつなぐ
function goTo(g, y, L, R) {
  if (Math.abs(L - g.L) < 2 && Math.abs(R - g.R) < 2) return y;
  if (rng() < 0.5) { g.pt(-1, L, y); g.pt(1, R, y); return y; }
  const h = clamp(Math.max(Math.abs(L - g.L), Math.abs(R - g.R)) * rand(0.5, 1.0), 40, 140);
  g.pt(-1, L, y - h); g.pt(1, R, y - h);
  return y - h;
}
const up = (g, y) => { g.pt(-1, g.L, y); g.pt(1, g.R, y); };
const rectPts = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];

function genZone(g, y) {
  const m = -y / PX_PER_M, d = clamp((m - 5) / 90, 0, 1);
  const wts = zoneAt(m).weights(d, m);
  let r = rng() * Object.values(wts).reduce((a, b) => a + b, 0);
  for (const k in wts) { if ((r -= wts[k]) < 0) return CHUNKS[k](g, y, d, m); }
  return CHUNKS.straight(g, y, d, m);
}
// 叩き台の上限より上：何もない普通の縦穴
function genPlain(g, y) { y = goTo(g, y, START_L, START_R); up(g, y - 600); return y - 600; }

/* ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hash2 = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = Math.random;
const rand = (a, b) => a + rng() * (b - a);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const PIXEL_FONT = '"DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif';

/* ---------- canvas ---------- */
const cv = $('cv'), ctx = cv.getContext('2d'), frameEl = $('frame');
let scale = 1, dpr = 1;
function resize() {
  const box = $('app').getBoundingClientRect();
  scale = Math.min((box.width || innerWidth) / W, (box.height || innerHeight) / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  cv.style.width = frameEl.style.width = cw + 'px';
  cv.style.height = frameEl.style.height = ch + 'px';
  frameEl.style.setProperty('--u', scale.toFixed(4));
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
}
addEventListener('resize', resize); resize();

/* ---------- audio ---------- */
let actx = null, muted = store.get('kr_muted', false), noiseBuf = null;
function audio() {
  if (muted) return null;
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.4, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, dur, type = 'square', vol = 0.06, f2 = 0, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), gn = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.12, hp = 600) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, s = a.createBufferSource(), gn = a.createGain(), fl = a.createBiquadFilter();
  s.buffer = noiseBuf; fl.type = 'highpass'; fl.frequency.value = hp;
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl).connect(gn).connect(a.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  kick() { tone(220, 0.09, 'square', 0.05, 440); noise(0.05, 0.05, 2000); },
  air() { tone(520, 0.12, 'triangle', 0.06, 1040); },
  land() { noise(0.04, 0.04, 900); },
  bump() { tone(140, 0.07, 'square', 0.04); },
  hurt() { noise(0.25, 0.16, 300); tone(200, 0.25, 'sawtooth', 0.06, 70); },
  die() { tone(330, 0.6, 'sawtooth', 0.07, 50); noise(0.5, 0.12, 200); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'square', 0.045, 0, i * 0.08)); },
  tick() { tone(990, 0.05, 'square', 0.03); },
};

/* ---------- game state ---------- */
let state = 'title';   // title | play | pause | dead | clear | end
let G = null;          // 1回のプレイ
let P = null;          // プレイヤー
const cam = { y: 0, shake: 0 };
let particles = [], inputBuf = 0, debug = false;

/* ---------- 地形データ ----------
   地形はすべて「線分」。線分ごとに外向きの法線 (nx, ny) を持つ。
   法線が上向き＝床、下向き＝天井、横向き＝壁（張り付ける）。 */
function newGame(seed) {
  rng = mulberry32(seed);
  G = {
    seed, time: 0, hp: MAX_HP, cause: '',
    edges: [], wallEdges: { '-1': [], '1': [] }, prof: { '-1': [], '1': [] }, polys: [], planks: [],
    spikes: [], bats: [], torches: [],
    L: START_L, R: START_R, genY: 0, lavaY: 160, lavaDelay: LAVA_DELAY, lastMark: 0,
  };
  G.prof[-1].push({ x: START_L, y: 3000 }); G.prof[1].push({ x: START_R, y: 3000 });
  G.pt = (side, x, y) => {
    const pts = G.prof[side], a = pts[pts.length - 1];
    if (Math.abs(a.x - x) < 0.01 && Math.abs(a.y - y) < 0.01) return;
    pts.push({ x, y });
    const dx = x - a.x, dy = y - a.y, l = Math.hypot(dx, dy);
    const e = addEdge(a.x, a.y, x, y, side < 0 ? -dy / l : dy / l, side < 0 ? dx / l : -dx / l, 'wall');
    e.side = side;
    if (Math.abs(dy) > 0.5) G.wallEdges[side].push(e);
    if (side < 0) G.L = x; else G.R = x;
  };
  G.poly = pts => {
    G.polys.push(pts);
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length], l = Math.hypot(bx - ax, by - ay);
      addEdge(ax, ay, bx, by, (by - ay) / l, -(bx - ax) / l, 'rock');
    }
  };
  G.plank = (x0, x1, y) => { G.planks.push({ x0, x1, y }); addEdge(x0, y, x1, y, 0, -1, 'oneway'); };
  G.addSpike = (side, top, bot) => {
    const clash = G.spikes.some(s => s.side === -side && !(bot + 70 < s.top || top - 70 > s.bot));
    if (clash || top < -PROTO_LIMIT_M * PX_PER_M + 40) return false;
    G.spikes.push({ side, top, bot });
    return true;
  };
  G.addBat = (y, speed) => {
    if (y < -PROTO_LIMIT_M * PX_PER_M + 60) return;
    const a = wallX(-1, y), b = wallX(1, y);
    G.bats.push({ x: rand(a + 30, b - 30), baseY: y, y, vx: rng() < 0.5 ? speed : -speed, t: rng() * 6 });
  };
  G.poly(rectPts(-200, 0, W + 200, 3000));          // 地面
  up(G, -5 * PX_PER_M);                             // 最初の5mは普通の幅でトゲなし
  G.genY = -5 * PX_PER_M;
  P = { x: START_L + HB, y: -HB, vx: 0, vy: 0, side: -1, wn: { x: 1, y: 0 }, slideV: 0, ground: false, prevY: -HB,
        air: AIR_JUMPS, inv: 0, squash: 0, face: 1, best: 0, trail: [] };
  cam.y = 60 - H; cam.shake = 0;
  particles = []; inputBuf = 0;
  generateUpTo(cam.y - H);
}
function addEdge(ax, ay, bx, by, nx, ny, kind) {
  const e = { ax, ay, bx, by, nx, ny, kind, minX: Math.min(ax, bx), maxX: Math.max(ax, bx), minY: Math.min(ay, by), maxY: Math.max(ay, by) };
  G.edges.push(e);
  return e;
}
// その高さでの左右の壁のx（段差は除く）
function wallX(side, y) {
  const list = G.wallEdges[side];
  for (let i = list.length - 1; i >= 0; i--) {
    const e = list[i];
    if (y >= e.minY && y <= e.maxY) return e.ax + (e.bx - e.ax) * (y - e.ay) / (e.by - e.ay);
  }
  return side < 0 ? START_L : START_R;
}

function heightM() { return Math.max(0, -P.y - HB) / PX_PER_M; }

function generateUpTo(yTop) {
  const limit = -PROTO_LIMIT_M * PX_PER_M;
  while (G.genY > yTop) G.genY = G.genY > limit ? genZone(G, G.genY) : genPlain(G, G.genY);
  while ((G.torches.length ? G.torches[G.torches.length - 1].y : 0) - 380 > yTop) {
    const n = G.torches.length;
    G.torches.push({ y: -260 - n * 380, side: n % 2 ? 1 : -1 });
  }
}

/* ---------- input ---------- */
function press() { if (state === 'play') { inputBuf = INPUT_BUFFER; tryJump(); } }
function tryJump() {
  const p = P;
  if (p.side !== 0 || p.ground) {           // 壁キック（床に立っているときは開けている方へ）
    let dir;
    if (p.side !== 0) dir = -p.side;
    else { const c = (wallX(-1, p.y) + wallX(1, p.y)) / 2; dir = Math.abs(p.x - c) < 24 ? (p.face || 1) : (p.x < c ? 1 : -1); }
    p.vx = dir * KICK_VX; p.vy = -KICK_VY;
    if (p.side !== 0) burst(p.x + p.side * HB, p.y, 7, '#d8cfb8', dir * 60, 0.35);
    else burst(p.x, p.y + HB, 7, '#d8cfb8', 0, 0.35);
    p.side = 0; p.ground = false; p.air = AIR_JUMPS; p.face = dir; p.squash = -0.3;
    inputBuf = 0; sfx.kick();
    return;
  }
  if (p.air > 0) {                          // 2段ジャンプ
    const toWall = p.vx > 0 ? (wallX(1, p.y) - HB - p.x) / p.vx : p.vx < 0 ? (p.x - wallX(-1, p.y) - HB) / -p.vx : 1;
    if (toWall >= 0 && toWall < 0.08) return; // 壁の直前なら壁キックのために入力を取っておく
    if (AIR_JUMP_MODE === 'flip') p.vx = -Math.sign(p.vx || 1) * KICK_VX * 0.9;
    else if (Math.abs(p.vx) < KICK_VX * 0.5) p.vx = (p.vx === 0 ? (p.face || 1) : Math.sign(p.vx)) * KICK_VX * 0.7;
    p.vy = -AIR_JUMP_VY;
    p.air--; p.face = Math.sign(p.vx); p.squash = -0.3;
    ring(p.x, p.y, '#bfe8ff'); burst(p.x, p.y + 8, 6, '#bfe8ff', 0, 0.3, 70);
    inputBuf = 0; sfx.air();
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); audio(); press(); });
addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'z' || k === 'Z') {
    if (e.target.tagName === 'BUTTON' && state !== 'play') return;
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'title') { startGame(); return; }
    press();
  } else if (k === 'Escape' || k === 'p' || k === 'P') {
    if (state === 'play') pause(); else if (state === 'pause') resume();
  } else if (k === 'd' || k === 'D') {
    debug = !debug;
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pause(); });

/* ---------- effects ---------- */
function burst(x, y, n, color, vx = 0, life = 0.5, spread = 120) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: vx + (Math.random() - 0.5) * spread * 1.2, vy: (Math.random() - 0.8) * spread, life, max: life, color, size: 1.5 + Math.random() * 2, g: 300 });
}
function ring(x, y, color) { particles.push({ ring: true, x, y, life: 0.35, max: 0.35, color }); }

/* ---------- player physics ---------- */
// 円と線分の当たり。押し出して、めり込む向きの速度を消す。触れた面の種類を返す
function collide(p, res) {
  const r = HB;
  for (const e of G.edges) {
    if (e.maxY < p.y - r - 1 || e.minY > p.y + r + 1 || e.maxX < p.x - r - 1 || e.minX > p.x + r + 1) continue;
    if ((p.x - e.ax) * e.nx + (p.y - e.ay) * e.ny < -0.5) continue;      // 裏側からは当たらない
    if (e.kind === 'oneway' && (p.vy < 0 || p.prevY + r > e.ay + 1)) continue;
    const ex = e.bx - e.ax, ey = e.by - e.ay;
    const t = clamp(((p.x - e.ax) * ex + (p.y - e.ay) * ey) / (ex * ex + ey * ey), 0, 1);
    const cx = e.ax + ex * t, cy = e.ay + ey * t;
    const vx = p.x - cx, vy = p.y - cy, dist = Math.hypot(vx, vy);
    if (dist >= r) continue;
    const nx = dist > 1e-4 ? vx / dist : e.nx, ny = dist > 1e-4 ? vy / dist : e.ny;
    p.x = cx + nx * r; p.y = cy + ny * r;
    const vn = p.vx * nx + p.vy * ny;
    if (vn < 0) { p.vx -= vn * nx; p.vy -= vn * ny; }
    if (ny < -0.6) res.floor = true;
    else if (ny > 0.6) { res.ceil = true; res.ceilV = Math.max(res.ceilV, -vn); }
    else res.wall = { x: nx, y: ny };
  }
  return res;
}
function movePlayer(dt) {
  const p = P;
  p.prevY = p.y;
  if (p.side !== 0) {                       // 壁に沿ってずり落ちる（斜めの壁なら斜めに）
    p.slideV += (SLIDE_SPEED - p.slideV) * Math.min(1, dt * 7);
    let tx = -p.wn.y, ty = p.wn.x; if (ty < 0) { tx = -tx; ty = -ty; }
    p.vx = tx * p.slideV - p.wn.x * 40; p.vy = ty * p.slideV - p.wn.y * 40;
    p.face = -p.side;
  } else if (p.ground) {
    p.vx = 0; p.vy = 40;
  } else {
    p.vy += GRAVITY * dt;
  }
  p.x += p.vx * dt; p.y += p.vy * dt;
  const c = { floor: false, ceil: false, ceilV: 0, wall: null };
  collide(p, c); collide(p, c);

  if (p.side !== 0) {
    const sameWall = c.wall && (c.wall.x > 0 ? -1 : 1) === p.side;
    if (sameWall) p.wn = c.wall;
    else if (c.floor) { p.side = 0; p.ground = true; }
    else { p.side = 0; p.vx = -p.wn.x * 90; p.vy = Math.max(0, p.slideV); }   // 壁がなくなった→壁の方へ落ちる
    if (p.side !== 0 && c.floor) p.slideV = 0;
  } else if (p.ground) {
    if (!c.floor) { p.ground = false; p.vy = 0; }
    else { p.vx = 0; p.vy = 0; }
  } else {
    if (c.floor) {
      p.ground = true; p.vx = 0; p.vy = 0; p.air = AIR_JUMPS; p.squash = 0.35; sfx.land();
      if (inputBuf > 0) tryJump();
    } else if (c.wall) {
      landWall(c.wall);
    }
    if (c.ceil && c.ceilV > 60) { sfx.bump(); burst(p.x, p.y - HB, 4, '#cfc6ae', 0, 0.3, 60); }
  }
}
function landWall(n) {
  const p = P;
  p.side = n.x > 0 ? -1 : 1; p.wn = n; p.ground = false;
  p.slideV = Math.min(0, p.vy) * 0.2; p.vx = 0; p.vy = 0;
  p.squash = 0.35; p.air = AIR_JUMPS;
  burst(p.x + p.side * HB, p.y, 4, '#cfc6ae', -p.side * 40, 0.3, 50);
  sfx.land();
  if (inputBuf > 0) tryJump();
}

/* ---------- update ---------- */
function update(dt) {
  updateParticles(dt);
  cam.shake = Math.max(0, cam.shake - dt * 30);
  if (state === 'dead') { G.endT += dt; if (G.endT > 1.2) showEnd(); return; }
  if (state === 'clear') {
    G.endT += dt; P.y -= 200 * dt; P.x += (W / 2 - P.x) * Math.min(1, dt * 4);
    cam.y += (P.y - H * 0.5 - cam.y) * Math.min(1, dt * 4);
    if (G.endT > 1.4) showEnd();
    return;
  }
  if (state !== 'play') return;

  G.time += dt;
  const p = P;
  if (inputBuf > 0) { inputBuf -= dt; tryJump(); }
  p.inv = Math.max(0, p.inv - dt);
  p.squash += (0 - p.squash) * Math.min(1, dt * 12);

  const speed = Math.max(Math.abs(p.vx), Math.abs(p.vy), SLIDE_SPEED);
  const steps = Math.max(2, Math.ceil(speed * dt / 3));
  for (let i = 0; i < steps; i++) movePlayer(dt / steps);

  if (p.side === 0 && !p.ground) { p.trail.push({ x: p.x, y: p.y }); if (p.trail.length > 8) p.trail.shift(); }
  else if (p.trail.length) p.trail.shift();
  if (p.side !== 0 && p.slideV > 20 && Math.random() < dt * 8) particles.push({ x: p.x + p.side * HB, y: p.y + 6, vx: -p.side * 10, vy: 20, life: 0.3, max: 0.3, color: '#cfc6ae', size: 1.5, g: 0 });

  const m = heightM();
  p.best = Math.max(p.best, m);
  const mark = Math.floor(p.best / 10);
  if (mark > G.lastMark) { G.lastMark = mark; sfx.tick(); }

  // camera
  cam.y += (p.y - H * 0.62 - cam.y) * Math.min(1, dt * 5);
  cam.y = Math.min(cam.y, 60 - H);
  generateUpTo(cam.y - H);

  // lava
  if (G.lavaDelay > 0) G.lavaDelay -= dt;
  else {
    let sp = LAVA_SPEED_BASE + p.best * LAVA_SPEED_PER_M;
    const gap = G.lavaY - (cam.y + H + LAVA_LEASH);
    if (gap > 0) sp += gap * LAVA_CATCHUP;
    G.lavaY -= sp * dt;
  }
  if (p.y + PR * 0.4 > G.lavaY) { G.cause = 'lava'; die(); return; }

  // spikes（壁の線に沿って生えている）
  for (const s of G.spikes) {
    if (p.y < s.top - HIT * 0.6 || p.y > s.bot + HIT * 0.6) continue;
    const wx = wallX(s.side, clamp(p.y, s.top, s.bot)), dx = s.side < 0 ? p.x - wx : wx - p.x;
    if (dx > -20 && dx < 13 + HIT * 0.9) { hurt(-s.side, 'spike'); break; }
  }
  // bats
  updateBats(dt);
  for (const b of G.bats) {
    if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 < (HIT + BAT_R) ** 2) { hurt(Math.sign(p.x - b.x) || 1, 'bat'); break; }
  }
  if (state !== 'play') return;

  if (m >= PROTO_LIMIT_M) clear();
}

function updateBats(dt) {
  for (const b of G.bats) {
    if (!visible(b.baseY, 400)) continue;
    b.t += dt; b.x += b.vx * dt;
    const lo = wallX(-1, b.y) + 14, hi = wallX(1, b.y) - 14;
    if (b.x < lo) { b.x = lo; b.vx = Math.abs(b.vx); }
    if (b.x > hi) { b.x = hi; b.vx = -Math.abs(b.vx); }
    b.y = b.baseY + Math.sin(b.t * 2.6) * 16;
  }
}

function hurt(dirX, cause) {
  const p = P;
  if (p.inv > 0) return;
  G.hp--; p.inv = INVINCIBLE; cam.shake = 9; sfx.hurt();
  burst(p.x, p.y, 14, '#ff6f7d', 0, 0.5, 160);
  // 当たった物から弾き飛ばす（2段ジャンプは残る）
  p.side = 0; p.ground = false; p.vx = dirX * KICK_VX * 0.75; p.vy = -260;
  if (G.hp <= 0) { G.cause = cause; die(); }
}
function die() {
  state = 'dead'; G.endT = 0; sfx.die(); cam.shake = 14;
  burst(P.x, P.y, 50, '#f3ecd8', 0, 1.2, 240); burst(P.x, P.y, 30, '#ff5a4f', 0, 1.0, 200);
  $('pauseBtn').hidden = true;
}
function clear() {
  state = 'clear'; G.endT = 0; sfx.clear();
  burst(P.x, P.y, 40, zoneAt(0).theme.accent, 0, 1.0, 220);
  $('pauseBtn').hidden = true;
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    if (!q.ring) { q.vy += (q.g || 0) * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  }
}

/* ---------- draw ---------- */
const visible = (y, pad = 40) => y > cam.y - pad && y < cam.y + H + pad;

function draw() {
  const k = scale * dpr;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const th = zoneAt(Math.max(0, -(cam.y + H / 2) / PX_PER_M)).theme;
  ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
  if (!G) return;
  const sh = cam.shake;
  ctx.save();
  ctx.translate(sh ? (Math.random() - 0.5) * sh : 0, sh ? (Math.random() - 0.5) * sh : 0);
  drawBackdrop(th);
  ctx.translate(0, -cam.y);
  drawTorchGlow();
  drawMarks(th);
  drawTerrain(th);
  drawTorches();
  drawSpikes();
  drawBats();
  if (state !== 'dead' && state !== 'end') drawPlayer();
  drawParticles();
  drawLava();
  if (debug) drawDebug();
  ctx.restore();
  if (state !== 'title') drawHud(th);
}

function drawBackdrop(th) {
  ctx.fillStyle = th.far;
  const py = cam.y * 0.45, off = ((py % 48) + 48) % 48, base = Math.floor(py / 48);
  for (let r = -1; r < H / 48 + 2; r++) {
    const row = base + r, y = r * 48 - off;
    for (let c = 0; c < 6; c++) {
      const v = hash2(row, c); if (v < 0.55) continue;
      ctx.globalAlpha = 0.25 + v * 0.35;
      ctx.fillRect(-30 + c * 72 + (row & 1 ? 36 : 0), y, 66, 42);
    }
  }
  ctx.globalAlpha = 1;
}

// レンガ模様（世界座標のグリッドに揃えるので、形がどう変わっても模様がつながる）
function bricks(x0, y0, x1, y1, th) {
  ctx.fillStyle = th.mortar; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  const bh = 16, bw = 22;
  for (let r = Math.floor(y0 / bh); r * bh < y1; r++) {
    const st = (r & 1) ? 11 : 0;
    for (let c = Math.floor((x0 - st) / bw); c * bw + st < x1; c++) {
      const v = hash2(r, c);
      ctx.fillStyle = v > 0.5 ? th.wall2 : th.wall; ctx.fillRect(c * bw + st + 1, r * bh + 1, bw - 2, bh - 2);
      if (v > 0.86) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(c * bw + st + 1, r * bh + bh - 5, bw - 2, 3); }
    }
  }
}
function profilePath(side) {
  const pts = G.prof[side], far = side < 0 ? -60 : W + 60;
  ctx.moveTo(far, pts[0].y);
  for (const q of pts) ctx.lineTo(q.x, q.y);
  ctx.lineTo(far, pts[pts.length - 1].y);
  ctx.closePath();
}
function drawTerrain(th) {
  const y0 = cam.y - 20, y1 = cam.y + H + 20;
  ctx.save();
  ctx.beginPath();
  profilePath(-1); profilePath(1);
  for (const pts of G.polys) {
    let lo = Infinity, hi = -Infinity; for (const q of pts) { lo = Math.min(lo, q[1]); hi = Math.max(hi, q[1]); }
    if (hi < y0 || lo > y1) continue;
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  ctx.clip();
  bricks(-1, y0, W + 1, y1, th);
  ctx.restore();
  // 面の縁：床は明るく、天井は暗く、壁は細い光と影
  for (const e of G.edges) {
    if (e.kind === 'oneway' || e.maxY < y0 || e.minY > y1) continue;
    if (e.ny < -0.6) { ctx.strokeStyle = th.accent; ctx.globalAlpha = 0.5; ctx.lineWidth = 2; }
    else if (e.ny > 0.6) { ctx.strokeStyle = '#000'; ctx.globalAlpha = 0.5; ctx.lineWidth = 3; }
    else { ctx.strokeStyle = th.accent; ctx.globalAlpha = 0.22; ctx.lineWidth = 1; }
    ctx.beginPath(); ctx.moveTo(e.ax, e.ay); ctx.lineTo(e.bx, e.by); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 板の足場
  for (const pl of G.planks) {
    if (!visible(pl.y)) continue;
    ctx.fillStyle = th.plank; ctx.fillRect(pl.x0, pl.y, pl.x1 - pl.x0, 5);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(pl.x0, pl.y, pl.x1 - pl.x0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    for (let x = pl.x0 + 6; x < pl.x1 - 4; x += 18) ctx.fillRect(x, pl.y + 5, 2, 4);
  }
}
function drawTorchGlow() {
  for (const t of G.torches) {
    if (!visible(t.y, 90)) continue;
    const x = wallX(t.side, t.y) - t.side * 6, fl = 0.85 + Math.sin(G.time * 13 + t.y) * 0.1;
    const gr = ctx.createRadialGradient(x, t.y, 2, x, t.y, 90 * fl);
    gr.addColorStop(0, 'rgba(255,170,80,.26)'); gr.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = gr; ctx.fillRect(x - 90, t.y - 90, 180, 180);
  }
}
function drawTorches() {
  for (const t of G.torches) {
    if (!visible(t.y)) continue;
    const x = wallX(t.side, t.y) - t.side * 3, h = 9 + Math.sin(G.time * 17 + t.y) * 2;
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(x - 3, t.y, 6, 8);
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.ellipse(x, t.y - 2, 4, h / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff1c2'; ctx.beginPath(); ctx.ellipse(x, t.y, 2, 3, 0, 0, Math.PI * 2); ctx.fill();
  }
}
// 10mごとの目盛りと100mのゴール
function drawMarks(th) {
  ctx.font = '11px ' + PIXEL_FONT; ctx.textBaseline = 'middle';
  const m0 = Math.max(10, Math.floor(-(cam.y + H) / PX_PER_M / 10) * 10), m1 = -cam.y / PX_PER_M + 10;
  for (let m = m0; m <= m1 && m <= PROTO_LIMIT_M; m += 10) {
    const y = -m * PX_PER_M, a = wallX(-1, y), b = wallX(1, y), cx = (a + b) / 2;
    if (m === PROTO_LIMIT_M) {
      const gr = ctx.createLinearGradient(0, y - 70, 0, y + 30);
      gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.6, th.accent); gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 0.25 + Math.sin(G.time * 3) * 0.08; ctx.fillStyle = gr; ctx.fillRect(a, y - 70, b - a, 100); ctx.globalAlpha = 1;
      ctx.fillStyle = th.accent; ctx.fillRect(a, y - 1, b - a, 2);
      ctx.font = '14px ' + PIXEL_FONT; ctx.textAlign = 'center'; ctx.fillText('▲ 100m ▲', cx, y - 14);
      ctx.font = '11px ' + PIXEL_FONT;
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(a + 8, y, b - a - 16, 1);
      ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.textAlign = 'center'; ctx.fillText(m + 'm', cx, y - 8);
    }
  }
}
function drawSpikes() {
  for (const s of G.spikes) {
    if (s.bot < cam.y - 10 || s.top > cam.y + H + 10) continue;
    const d = -s.side;
    for (let y = s.top; y < s.bot - 1; y += 10) {
      const h = Math.min(10, s.bot - y), xa = wallX(s.side, y), xb = wallX(s.side, y + h), xm = (xa + xb) / 2;
      ctx.fillStyle = '#c9ccd6'; ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xm + d * 14, y + h / 2); ctx.lineTo(xb, y + h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7d8193'; ctx.beginPath(); ctx.moveTo(xm, y + h / 2); ctx.lineTo(xm + d * 14, y + h / 2); ctx.lineTo(xb, y + h); ctx.closePath(); ctx.fill();
    }
  }
}
function drawBats() {
  for (const b of G.bats) {
    if (!visible(b.y)) continue;
    ctx.save(); ctx.translate(b.x, b.y);
    const w = Math.sin(b.t * 16) * 6;
    ctx.fillStyle = '#4b3f73';
    ctx.beginPath(); ctx.moveTo(-3, -2); ctx.lineTo(-15, -6 + w); ctx.lineTo(-11, 2); ctx.lineTo(-6, 1 + w * 0.3); ctx.lineTo(-3, 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3, -2); ctx.lineTo(15, -6 + w); ctx.lineTo(11, 2); ctx.lineTo(6, 1 + w * 0.3); ctx.lineTo(3, 4); ctx.fill();
    ctx.fillStyle = '#6d5fa3'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff4f6a'; const ex = b.vx > 0 ? 1.5 : -1.5;
    ctx.fillRect(-3 + ex, -2, 2, 2); ctx.fillRect(1 + ex, -2, 2, 2);
    ctx.restore();
  }
}
function drawHeart(x, y, s, color) {
  ctx.fillStyle = color;
  const px = [[1,0],[2,0],[4,0],[5,0],[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[1,3],[2,3],[3,3],[4,3],[5,3],[2,4],[3,4],[4,4],[3,5]];
  for (const [a, b] of px) ctx.fillRect(x + (a - 3.5) * s, y + (b - 3) * s, s, s);
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawPlayer() {
  const p = P;
  for (let i = 0; i < p.trail.length; i++) {
    const t = p.trail[i];
    ctx.globalAlpha = (i + 1) / p.trail.length * 0.22; ctx.fillStyle = '#bfe8ff';
    ctx.beginPath(); ctx.arc(t.x, t.y, PR * 0.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = (p.inv > 0 && Math.floor(p.inv * 18) % 2) ? 0.35 : 1;
  ctx.save(); ctx.translate(p.x, p.y);
  const sc = p.side !== 0 ? p.side : -Math.sign(p.vx || p.face || 1), wave = Math.sin(G.time * 20) * 2, dy = (p.side || p.ground) ? 6 : 0;
  ctx.fillStyle = '#ff5a4f';
  ctx.beginPath(); ctx.moveTo(sc * 2, -3); ctx.lineTo(sc * 16, -6 + wave + dy); ctx.lineTo(sc * 14, wave + dy); ctx.lineTo(sc * 2, 2); ctx.fill();
  ctx.scale(1 + p.squash * 0.5, 1 - p.squash * 0.4);
  ctx.fillStyle = '#f3ecd8'; roundRect(-9, -10, 18, 20, 6); ctx.fill();
  ctx.fillStyle = '#ff5a4f'; ctx.fillRect(-9, -3, 18, 4);
  ctx.fillStyle = '#1a1424'; const ex = p.face * 3;
  ctx.fillRect(ex - 4, -8, 2.5, 4); ctx.fillRect(ex + 1.5, -8, 2.5, 4);
  ctx.fillStyle = '#c9bfa6';
  if (p.side !== 0) { ctx.fillRect(p.side * 8, -6, 3 * p.side, 4); ctx.fillRect(p.side * 8, 4, 3 * p.side, 4); }
  else { ctx.fillRect(-7, 9, 5, 3); ctx.fillRect(2, 9, 5, 3); }
  ctx.restore(); ctx.globalAlpha = 1;
  // 2段ジャンプ残り（足元の小さな点）
  if (p.side === 0 && !p.ground && p.air > 0) { ctx.fillStyle = '#bfe8ff'; ctx.fillRect(p.x - 1.5, p.y + 15, 3, 3); }
}
function drawParticles() {
  for (const q of particles) {
    const a = q.life / q.max; ctx.globalAlpha = Math.max(0, a);
    if (q.ring) { ctx.strokeStyle = q.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, PR + (1 - a) * 26, 0, Math.PI * 2); ctx.stroke(); }
    else { ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
  }
  ctx.globalAlpha = 1;
}
function drawLava() {
  const y = G.lavaY, bottom = cam.y + H + 40;
  if (y > bottom) return;
  const gl = ctx.createLinearGradient(0, y - 90, 0, y);
  gl.addColorStop(0, 'rgba(255,90,40,0)'); gl.addColorStop(1, 'rgba(255,90,40,.35)');
  ctx.fillStyle = gl; ctx.fillRect(0, y - 90, W, 90);
  const t = G.time;
  ctx.fillStyle = '#c2381f'; ctx.beginPath(); ctx.moveTo(0, bottom);
  for (let x = 0; x <= W; x += 12) ctx.lineTo(x, y + Math.sin(x * 0.06 + t * 3) * 4 + Math.sin(x * 0.13 - t * 2) * 2);
  ctx.lineTo(W, bottom); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff6a3d'; ctx.beginPath(); ctx.moveTo(0, bottom);
  for (let x = 0; x <= W; x += 12) ctx.lineTo(x, y + 6 + Math.sin(x * 0.05 - t * 2.4) * 3);
  ctx.lineTo(W, bottom); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd36a';
  for (let i = 0; i < 6; i++) { const bx = ((hash2(i, 3) * W + t * 12 * (i % 2 ? 1 : -1)) % W + W) % W; ctx.fillRect(bx, y + 14 + hash2(i, 9) * 30, 3, 3); }
}
function drawDebug() {
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#0ff'; ctx.beginPath(); ctx.arc(P.x, P.y, HB, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#0f0'; ctx.beginPath(); ctx.arc(P.x, P.y, HIT, 0, Math.PI * 2); ctx.stroke();
  for (const e of G.edges) {
    if (!visible(e.minY) && !visible(e.maxY)) continue;
    ctx.strokeStyle = e.ny < -0.6 ? '#0f0' : e.ny > 0.6 ? '#f00' : e.kind === 'oneway' ? '#ff0' : '#0af';
    ctx.beginPath(); ctx.moveTo(e.ax, e.ay); ctx.lineTo(e.bx, e.by); ctx.stroke();
    const mx = (e.ax + e.bx) / 2, my = (e.ay + e.by) / 2;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx + e.nx * 8, my + e.ny * 8); ctx.stroke();
  }
  ctx.strokeStyle = '#f0f';
  for (const b of G.bats) { ctx.beginPath(); ctx.arc(b.x, b.y, BAT_R, 0, Math.PI * 2); ctx.stroke(); }
}
function drawHud(th) {
  const gr = ctx.createLinearGradient(0, 0, 0, 44);
  gr.addColorStop(0, 'rgba(0,0,0,.65)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, 44);
  for (let i = 0; i < MAX_HP; i++) drawHeart(16 + i * 17, 16, 2, i < G.hp ? '#ff6f7d' : 'rgba(255,255,255,.18)');
  ctx.font = '13px ' + PIXEL_FONT; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f3ecd8'; ctx.textAlign = 'center';
  ctx.fillText(`${Math.floor(P.best)}m / ${PROTO_LIMIT_M}m`, W / 2, 16);
  ctx.textAlign = 'right'; ctx.fillStyle = '#a99f8a';
  ctx.fillText(G.time.toFixed(1) + 's', W - 12, 16);
  const prog = clamp(P.best / PROTO_LIMIT_M, 0, 1), lavaProg = clamp(-G.lavaY / PX_PER_M / PROTO_LIMIT_M, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(W - 7, 60, 3, 220);
  ctx.fillStyle = th.accent; ctx.fillRect(W - 7, 60 + 220 * (1 - prog), 3, 220 * prog);
  ctx.fillStyle = '#ff6a3d'; ctx.fillRect(W - 9, 60 + 220 * (1 - lavaProg) - 1, 7, 2);
  if (state === 'play' && G.lavaY > cam.y + H) {
    const m = Math.max(0, Math.round((G.lavaY - P.y) / PX_PER_M));
    ctx.fillStyle = m < 10 ? '#ff6a3d' : 'rgba(255,106,61,.6)'; ctx.textAlign = 'center'; ctx.font = '12px ' + PIXEL_FONT;
    ctx.fillText(`▼ 溶岩まで ${m}m`, W / 2, H - 14);
  }
  if (debug) { ctx.fillStyle = '#0f0'; ctx.textAlign = 'left'; ctx.font = '10px monospace'; ctx.fillText(`seed ${G.seed}  edges ${G.edges.length}  spikes ${G.spikes.length}  bats ${G.bats.length}`, 8, H - 40); }
}

/* ---------- menus ---------- */
const ov = { title: $('ovTitle'), pause: $('ovPause'), end: $('ovEnd') };
function showOnly(name) { for (const k in ov) ov[k].hidden = k !== name; }
function renderBest() {
  const b = store.get('kr_proto_best', null);
  $('bestTitle').textContent = b ? `最高 ${b.m}m` + (b.t ? `・100m最速 ${b.t.toFixed(1)}秒` : '') : 'まだ記録はありません';
}
function startGame() {
  audio(); showOnly(null);
  newGame((Math.random() * 0xffffff) | 0);
  state = 'play'; $('pauseBtn').hidden = false; last = performance.now();
}
function pause() { state = 'pause'; showOnly('pause'); }
function resume() { showOnly(null); state = 'play'; last = performance.now(); }
function showEnd() {
  state = 'end';
  const m = Math.floor(P.best), cleared = m >= PROTO_LIMIT_M;
  const best = store.get('kr_proto_best', { m: 0, t: 0 });
  const newM = m > best.m, newT = cleared && (!best.t || G.time < best.t);
  store.set('kr_proto_best', { m: Math.max(m, best.m), t: newT ? G.time : best.t });
  $('endEyebrow').textContent = cleared ? 'CLEAR' : 'GAME OVER';
  $('endTitle').textContent = cleared ? '100m 到達！' : G.cause === 'lava' ? '溶岩に呑まれた' : G.cause === 'spike' ? 'トゲで力尽きた' : G.cause === 'bat' ? 'コウモリにやられた' : 'やり直し';
  $('endNote').hidden = !cleared;
  $('endNote').textContent = 'ここから先はまだ作っていません';
  const st = $('endStats'); st.textContent = '';
  const rows = [['高さ', `${m}m`, newM && !cleared], ['タイム', `${G.time.toFixed(1)}秒`, newT], ['残りHP', `${Math.max(0, G.hp)} / ${MAX_HP}`], ['最高', `${Math.max(m, best.m)}m`]];
  for (const [a, b, hl] of rows) {
    const dt = document.createElement('dt'); dt.textContent = a;
    const dd = document.createElement('dd'); dd.textContent = b + (hl ? ' 更新！' : ''); if (hl) dd.className = 'newbest';
    st.append(dt, dd);
  }
  showOnly('end'); $('btnRetry').focus({ preventScroll: true });
}
$('btnStart').addEventListener('click', startGame);
$('btnRetry').addEventListener('click', startGame);
$('btnToTitle').addEventListener('click', () => { attract(); renderBest(); showOnly('title'); });
$('btnResume').addEventListener('click', resume);
$('btnQuit').addEventListener('click', startGame);
$('pauseBtn').addEventListener('click', () => { if (state === 'play') pause(); });
const muteLabel = () => { $('btnMute').textContent = muted ? '音：オフ' : '音：オン'; };
$('btnMute').addEventListener('click', () => { muted = !muted; store.set('kr_muted', muted); muteLabel(); });
muteLabel();

// タイトル画面の背景：ゆっくり上へ流れる
function attract() { newGame(12345); G.lavaDelay = 1e9; state = 'title'; $('pauseBtn').hidden = true; }

/* ---------- loop ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (state === 'title') {
    G.time += dt; cam.y -= 30 * dt;
    if (cam.y < -PROTO_LIMIT_M * PX_PER_M) cam.y = 60 - H;
    generateUpTo(cam.y - H);
    updateBats(dt);
    P.y = cam.y + H * 0.62;
    P.side = Math.floor(G.time / 0.9) % 2 ? 1 : -1; P.wn = { x: -P.side, y: 0 };
    P.x = wallX(P.side, P.y) - P.side * HB; P.face = -P.side;
  } else update(dt);
  draw();
  requestAnimationFrame(loop);
}
renderBest(); attract();
if (document.fonts && document.fonts.load) document.fonts.load('16px "DotGothic16"').catch(() => {});
requestAnimationFrame(loop);

window.__kr = { get state() { return state; }, get G() { return G; }, get P() { return P; }, press, startGame };
})();
</script>
