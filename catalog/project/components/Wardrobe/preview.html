<!-- @dsCard group="キャラ" height=560 width=760 subtitle="着せ替え：着る4つ・かぶる4つ・ろうそく・石灯籠" -->
<style>
.wd-row { display: grid; grid-template-columns: 110px 150px minmax(0, 1fr); gap: 10px; padding: 10px; align-items: center; }
.wd-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.wd-items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 0 10px 10px; }
.wd-h { font: 800 12px "M PLUS Rounded 1c", sans-serif; padding: 4px 10px 0; opacity: .8; }
@media (max-width: 560px) { .wd-row { grid-template-columns: 1fr 1fr; } .wd-cols { grid-column: 1 / -1; } .wd-items { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
<div class="wd-row" id="root"></div>
<div class="wd-h">着る（どれか1つ）</div>
<div class="wd-items" id="wear"></div>
<div class="wd-h">かぶる（なしでもよい）</div>
<div class="wd-items" id="hat"></div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap';document.head.appendChild(l);})();
var root = document.getElementById('root');
function fig(w, h, zoom, label, draw) {
  var f = document.createElement('figure'); f.className = 'kabe-fig'; var cv = Kabe.canvas(w, h, zoom, label), cap = document.createElement('figcaption'); cap.textContent = label;
  f.appendChild(cv.c); f.appendChild(cap); Kabe.animate(function (t) { var P = Kabe.pal('underground'), g = cv.g; g.setTransform(cv.k, 0, 0, cv.k, 0, 0); g.clearRect(0, 0, w, h); Kabe.background(g, P, 0, 0, w, h, t, 0); draw(g, P, t); }); return f;
}
root.appendChild(fig(40, 40, 2.4, 'ろうそく', function (g, P, t) { Kabe.candle(g, P, 20, 23, 1.3, t); }));
root.appendChild(fig(70, 92, 1.6, '石灯籠', function (g, P, t) { var k = (t % 4) / 4, st = k < 0.33 ? 1 : k < 0.66 ? 2 : 3; Kabe.gachaLantern(g, P, 35, 47, t, 0.3, Kabe.gemTone(P, st)[0]); }));
var cols = document.createElement('div'); cols.className = 'wd-cols'; root.appendChild(cols);
Kabe.SCARF_COLORS.forEach(function (c) { cols.appendChild(fig(44, 40, 1.6, c.name + ' ' + '★★★'.slice(0, c.star), function (g, P, t) { Kabe.scarfItem(g, P, 23, 16, 1.2, t, c.id); })); });
// 品物：アイコン（色は順に変わる）と、着た姿（立つ ⇄ 跳ぶ。ひもの流れで動く）
var POSE = ['stand', 'jump', 'cling', 'fall'];
function item(box, kind, it) {
  box.appendChild(fig(96, 56, 1.5, it.name, function (g, P, t) {
    var cs = it.id === 'stripe' ? Kabe.SCARF_COLORS : Kabe.OUTFIT_COLORS, c = cs[Math.floor(t / 1.6) % cs.length].id;
    g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(4, 10, 36, 36);
    Kabe.outfitIcon(g, P, it.id, 22, 28, 1.15, t, c);
    var look = kind === 'wear' ? { wear: it.id, color: c } : { wear: 'stripe', color: 'red', hat: it.id, hatColor: c };
    Kabe.withOutfit(look, function () { Kabe.ghost(g, P, 'sheet', POSE[Math.floor(t / 1.2) % POSE.length], 70, 34, t, 1, 1); });
  }));
}
Kabe.OUTFIT_ITEMS.wear.forEach(function (it) { item(document.getElementById('wear'), 'wear', it); });
Kabe.OUTFIT_ITEMS.hat.forEach(function (it) { item(document.getElementById('hat'), 'hat', it); });
</script>
