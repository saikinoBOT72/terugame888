<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="壁蹴りタワー">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1b1426">

<title>壁蹴りタワー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="catalog/project/tokens.css">
<style>
  /* Layout: one fixed 360x640 game frame, centered and scaled; menus are rounded cards over it.
     Look: 統一カタログ（catalog/project/tokens.css）のゾーンの色。赤はマフラーとハートだけなので、ボタンは ui-ink、強調は glow。 */
  :root {
    --cave: var(--bg-top);
    --panel: var(--ui-panel);
    --cream: var(--ui-ink);
    --dim: var(--ui-muted);
    --pink: var(--ui-ink);      /* ボタン */
    --pink-deep: var(--ui-muted);
    --teal: var(--glow);        /* 強調・フォーカス */
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  /* アプリのように：ダブルタップのズーム・長押しの拡大鏡やメニュー・文字の選択を止める */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
  *, *::before, *::after { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  img, canvas { -webkit-user-drag: none; }
  html { box-sizing: border-box; }
  body {
    background: var(--cave); color: var(--cream); overflow: hidden;
    font: 500 13px/1.6 var(--font-round);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { width: 100%; height: 100%; display: grid; place-items: center; }
  #frame { position: relative; --u: 1; border-radius: calc(var(--u) * 10px); overflow: hidden; }
  #cv { display: block; touch-action: none; cursor: pointer; }
  .layer { position: absolute; left: 0; top: 0; pointer-events: none; }
  #gl[hidden], #hud[hidden] { display: none; }
  .ov {
    position: absolute; inset: 0; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    padding: calc(var(--u) * 18px); background: rgba(30, 24, 38, .45);
  }
  .card {
    width: 100%; box-sizing: border-box; display: grid; justify-items: center; gap: calc(var(--u) * 10px);
    background: var(--panel); border-radius: calc(var(--u) * 18px);
    padding: calc(var(--u) * 22px) calc(var(--u) * 18px);
    box-shadow: 0 calc(var(--u) * 6px) 0 rgba(0,0,0,.25);
    text-align: center; font-size: calc(var(--u) * 13px);
  }
  .ov h1 { margin: 0; font-weight: 800; font-size: calc(var(--u) * 34px); line-height: 1.15; letter-spacing: .04em; }
  .ov h1 span { color: var(--teal); }
  .ov h2 { margin: 0; font-weight: 800; font-size: calc(var(--u) * 24px); }
  .ov p { margin: 0; color: var(--dim); }
  .tagline { color: var(--teal) !important; font-size: calc(var(--u) * 13px); }
  .how { display: grid; gap: calc(var(--u) * 4px); text-align: left; font-size: calc(var(--u) * 12.5px); }
  .how div { display: flex; gap: calc(var(--u) * 8px); align-items: baseline; }
  .how b { font-weight: 800; color: var(--teal); min-width: calc(var(--u) * 84px); }
  .btn {
    font: inherit; font-weight: 800; font-size: calc(var(--u) * 17px); color: var(--ink);
    background: var(--pink); border: 0; border-radius: 999px;
    padding: calc(var(--u) * 10px) calc(var(--u) * 34px); cursor: pointer;
    box-shadow: 0 calc(var(--u) * 4px) 0 var(--pink-deep);
  }
  .btn:active { transform: translateY(calc(var(--u) * 3px)); box-shadow: 0 calc(var(--u) * 1px) 0 var(--pink-deep); }
  .sub {
    font: inherit; font-size: calc(var(--u) * 12.5px); color: var(--cream); background: transparent;
    border: 2px solid rgba(255,244,230,.25); border-radius: 999px; padding: calc(var(--u) * 5px) calc(var(--u) * 16px); cursor: pointer;
  }
  .btn:focus-visible, .sub:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .row { display: flex; gap: calc(var(--u) * 8px); flex-wrap: wrap; justify-content: center; }
  .small { font-size: calc(var(--u) * 11px); }
  .stats { display: grid; grid-template-columns: auto auto; gap: calc(var(--u) * 2px) calc(var(--u) * 20px); margin: 0; font-variant-numeric: tabular-nums; text-align: left; font-size: calc(var(--u) * 14px); }
  .stats dt { color: var(--dim); } .stats dd { margin: 0; text-align: right; font-weight: 800; }
  .stats .new { color: var(--teal); }
  /* タイトル（仮）：絵を見せるため板は使わず、上にロゴ・下にボタン */
  #ovTitle {
    flex-direction: column; justify-content: space-between; padding-top: calc(var(--u) * 70px); padding-bottom: calc(var(--u) * 40px);
    background: linear-gradient(rgba(30,24,38,.8), rgba(30,24,38,.1) 42%, rgba(30,24,38,.1) 58%, rgba(30,24,38,.8));
  }
  .logo { display: grid; justify-items: center; gap: calc(var(--u) * 8px); text-align: center; }
  .logo h1 { font-size: calc(var(--u) * 44px); text-shadow: 0 calc(var(--u) * 4px) 0 rgba(0,0,0,.35); }
  .logo .kari { font-size: calc(var(--u) * 10px); color: var(--dim); border: 1px solid rgba(255,244,230,.3); border-radius: 999px; padding: 0 calc(var(--u) * 8px); }
  .titleBottom { display: grid; justify-items: center; gap: calc(var(--u) * 12px); }
  .blink { animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .ver { position: absolute; left: calc(var(--u) * 10px); bottom: calc(var(--u) * 8px); font-size: calc(var(--u) * 10px); color: var(--dim); opacity: .8; }
  .sub:disabled { opacity: .6; cursor: default; }
  a.sub { text-decoration: none; display: inline-block; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  /* ガチャ画面：上に玉、下に持っている水晶のカード。水晶の色はレア度（--tone） */
  .gcard { gap: calc(var(--u) * 8px); padding: calc(var(--u) * 14px) calc(var(--u) * 14px) calc(var(--u) * 16px); }
  .ghead { width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .ghead h2 { font-size: calc(var(--u) * 20px); }
  .coins { display: inline-flex; align-items: center; gap: calc(var(--u) * 2px); background: rgba(0,0,0,.22); border-radius: 999px; padding: calc(var(--u) * 2px) calc(var(--u) * 12px) calc(var(--u) * 2px) calc(var(--u) * 4px); font-weight: 800; font-size: calc(var(--u) * 15px); font-variant-numeric: tabular-nums; }
  .uic { display: block; }
  .gstage { width: calc(var(--u) * 288px); height: calc(var(--u) * 118px); border-radius: calc(var(--u) * 14px);
    background: radial-gradient(ellipse 60% 75% at 50% 62%, color-mix(in srgb, var(--glow) 16%, transparent), transparent 70%),
      linear-gradient(180deg, rgba(0,0,0,.34), rgba(0,0,0,.14) 70%, rgba(255,255,255,.04));
    box-shadow: inset 0 calc(var(--u) * 2px) calc(var(--u) * 10px) rgba(0,0,0,.35), inset 0 -1px 0 rgba(255,255,255,.06); }
  .gresult { min-height: 1.6em; font-weight: 800; color: var(--cream) !important; font-size: calc(var(--u) * 13px); }
  .gresult .st { color: var(--tone, var(--teal)); margin-right: .3em; }
  .gresult .tag { color: var(--teal); font-size: .85em; margin-left: .4em; }
  .btn small { font-size: .72em; font-weight: 800; opacity: .7; margin-left: .35em; }
  .lavaBtn {
    font: inherit; font-weight: 800; font-size: calc(var(--u) * 12px); width: 100%; cursor: pointer;
    color: var(--ink); background: var(--rise); border: 0; border-radius: 999px; padding: calc(var(--u) * 7px) calc(var(--u) * 12px);
    box-shadow: 0 calc(var(--u) * 3px) 0 color-mix(in srgb, var(--rise) 60%, #000);
  }
  .lavaBtn:active { transform: translateY(calc(var(--u) * 2px)); box-shadow: 0 calc(var(--u) * 1px) 0 color-mix(in srgb, var(--rise) 60%, #000); }
  .lavaBtn:disabled { background: rgba(0,0,0,.22); color: var(--dim); box-shadow: none; cursor: default; transform: none; font-weight: 500; }
  .lavaBtn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .tradeRow { display: grid; grid-template-columns: 1fr auto; gap: calc(var(--u) * 6px); width: 100%; }
  .healBtn {
    font: inherit; font-weight: 800; font-size: calc(var(--u) * 12px); cursor: pointer; white-space: nowrap;
    color: var(--cream); background: rgba(0,0,0,.25); border: 2px solid rgba(255,244,230,.25); border-radius: 999px; padding: calc(var(--u) * 5px) calc(var(--u) * 12px);
  }
  .healBtn .hp { color: var(--scarf); }
  .healBtn:disabled { opacity: .5; cursor: default; font-weight: 500; }
  .healBtn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .ginv { width: 100%; display: grid; gap: calc(var(--u) * 6px); }
  .ginvHead { display: flex; justify-content: space-between; font-size: calc(var(--u) * 11px); color: var(--dim); }
  .gtiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 6px); }
  .gtile {
    position: relative; font: inherit; color: var(--cream); cursor: pointer; text-align: center;
    background: rgba(0,0,0,.2); border: 2px solid transparent; border-radius: calc(var(--u) * 12px);
    padding: calc(var(--u) * 4px) calc(var(--u) * 2px) calc(var(--u) * 5px); display: grid; justify-items: center; gap: 0;
  }
  .gtile .nm { font-weight: 800; font-size: calc(var(--u) * 10.5px); line-height: 1.3; white-space: nowrap; }
  .gtile .lv { display: flex; gap: calc(var(--u) * 3px); margin-top: calc(var(--u) * 2px); }
  .gtile .lv i { width: calc(var(--u) * 5px); height: calc(var(--u) * 5px); border-radius: 50%; background: rgba(255,244,230,.22); }
  .gtile .lv i.f { background: var(--tone); }
  .gtile { background: radial-gradient(circle at 50% 34%, color-mix(in srgb, var(--tone) 22%, transparent), transparent 62%), rgba(0,0,0,.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 calc(var(--u) * -6px) calc(var(--u) * 10px) rgba(0,0,0,.18); }
  .gtile.on { border-color: var(--tone); background: radial-gradient(circle at 50% 34%, color-mix(in srgb, var(--tone) 34%, transparent), transparent 66%), color-mix(in srgb, var(--tone) 12%, rgba(0,0,0,.2));
    box-shadow: 0 0 calc(var(--u) * 12px) color-mix(in srgb, var(--tone) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.1); }
  .gtile.on::after { content: '装備'; position: absolute; top: calc(var(--u) * -6px); right: calc(var(--u) * -4px); font-size: calc(var(--u) * 9px); font-weight: 800; color: var(--ink); background: var(--tone); border-radius: 999px; padding: 0 calc(var(--u) * 6px); }
  .gtile.empty { cursor: default; opacity: .5; border: 2px dashed rgba(255,244,230,.18); background: transparent; min-height: calc(var(--u) * 62px); align-content: center; font-size: calc(var(--u) * 10px); color: var(--dim); }
  .gtile:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .gdesc { min-height: 2.9em; font-size: calc(var(--u) * 11.5px); line-height: 1.45; text-align: left; width: 100%; }
  .gdesc b { color: var(--cream); }
  .gshow { position: absolute; inset: 0; z-index: 5; cursor: pointer; touch-action: none; }
  .gshowfx { position: absolute; left: 0; top: 0; z-index: 6; pointer-events: none; }
  .rollRow { display: flex; gap: calc(var(--u) * 8px); width: 100%; justify-content: center; }
  .rollRow .btn { padding-left: calc(var(--u) * 20px); padding-right: calc(var(--u) * 20px); }
  .btn.alt { background: var(--teal); box-shadow: 0 calc(var(--u) * 4px) 0 color-mix(in srgb, var(--teal) 55%, #000); }
  /* 一時停止・おしまいの画面に出す水晶の行 */
  .grows { display: grid; gap: calc(var(--u) * 6px); width: 100%; }
  .grow { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 8px); align-items: center; text-align: left; background: rgba(0,0,0,.18); border-radius: calc(var(--u) * 12px); padding: calc(var(--u) * 4px) calc(var(--u) * 10px) calc(var(--u) * 4px) calc(var(--u) * 4px); }
  .grow b { font-size: calc(var(--u) * 12.5px); } .grow b .st { color: var(--tone); margin-right: .3em; }
  .grow span { display: block; color: var(--dim); font-size: calc(var(--u) * 11px); line-height: 1.4; }
  #pauseBtn {
    position: absolute; right: calc(var(--u) * 8px); bottom: calc(var(--u) * 8px);
    width: calc(var(--u) * 32px); height: calc(var(--u) * 32px); font: inherit; font-weight: 800; color: var(--cream);
    background: color-mix(in srgb, var(--ui-panel) 85%, transparent); border: 0; border-radius: 50%; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div id="frame">
    <canvas id="cv" aria-label="ゲーム画面"></canvas>
    <canvas id="gl" class="layer" aria-hidden="true"></canvas>
    <canvas id="hud" class="layer" aria-hidden="true"></canvas>
    <button id="pauseBtn" type="button" aria-label="一時停止" hidden>II</button>
    <section id="ovTitle" class="ov">
      <div class="logo">
        <span class="kari">仮タイトル</span>
        <h1>壁蹴り<br><span>タワー</span></h1>
        <p class="tagline">地の底から、壁を蹴って地上をめざせ</p>
      </div>
      <div class="titleBottom">
        <p class="blink">タップでスタート</p>
        <button class="btn" id="btnStart" type="button">はじめる</button>
        <p id="bestTitle"></p>
        <div class="row">
          <button class="sub" id="btnHow" type="button">遊び方</button>
          <button class="sub" id="btnMute" type="button">音：オン</button>
          <button class="sub" id="btnCalm" type="button">演出：ふつう</button>
          <button class="sub" id="btnFx" type="button">画質：きれい</button>
          <button class="sub" id="btnUpdate" type="button">アプデ</button>
          <a class="sub" id="lnkPools" href="pools.html">プール一覧</a>
        </div>
      </div>
      <span class="ver" id="ver"></span>
    </section>
    <section id="ovHow" class="ov" hidden>
      <div class="card">
        <h2>遊び方</h2>
        <div class="how">
          <div><b>壁でタップ</b><span>反対の壁へ蹴る</span></div>
          <div><b>空中でタップ</b><span>2段ジャンプ。押す時間で着地点が変わる</span></div>
          <div><b>壁は滑らない</b><span>着地点を選んで登ろう</span></div>
        </div>
        <p class="small">D：地形の線　V：パーツの到達チェック</p>
        <button class="btn" id="btnHowBack" type="button">もどる</button>
      </div>
    </section>
    <section id="ovPause" class="ov" hidden>
      <div class="card">
        <h2>ひとやすみ</h2>
        <div class="grows" id="pGems"></div>
        <button class="btn" id="btnResume" type="button">つづける</button>
        <button class="sub" id="btnQuit" type="button">タイトルへ</button>
      </div>
    </section>
    <section id="ovGacha" class="ov" hidden>
      <div class="card gcard">
        <div class="ghead">
          <h2>ガチャ所</h2>
          <span class="coins" aria-label="持っている結晶"><canvas class="uic" id="gCoin" data-w="24" data-h="24" aria-hidden="true"></canvas><b id="gCrys">0</b></span>
        </div>
        <canvas class="uic gstage" id="gStage" data-w="288" data-h="118" role="img" aria-label="ガチャの玉"></canvas>
        <p id="gResult" class="gresult" aria-live="polite"></p>
        <div class="rollRow"><button class="btn" id="btnRoll" type="button"></button><button class="btn alt" id="btnRoll3" type="button"></button></div>
        <div class="tradeRow"><button class="lavaBtn" id="btnLava" type="button"></button><button class="healBtn" id="btnHeal" type="button"></button></div>
        <div class="ginv">
          <div class="ginvHead"><span>持っている水晶（押して装備）</span><span id="gSlots"></span></div>
          <div id="gList" class="gtiles"></div>
          <p id="gDesc" class="gdesc small"></p>
        </div>
        <button class="sub" id="btnGachaGo" type="button">出発する</button>
      </div>
    </section>
    <canvas class="uic gshow" id="gShow" data-w="360" data-h="640" role="img" aria-label="ガチャの演出（タップで先へ）" hidden></canvas>
    <section id="ovEnd" class="ov" hidden>
      <div class="card">
        <h2 id="endTitle">溶岩に呑まれた</h2>
        <dl class="stats" id="endStats"></dl>
        <div class="grows" id="eGems"></div>
        <button class="btn" id="btnRetry" type="button">もう一度</button>
        <button class="sub" id="btnToTitle" type="button">タイトルへ</button>
      </div>
    </section>
  </div>
</div>

<script src="catalog/project/components/bundle.js"></script>
<script src="data/pieces.js"></script>
<script>
(() => {
'use strict';
const VERSION = '2026.11.29c';
const A = {};   // おばけの動きの差分（resetAnim で中身を入れる）   // push のたびに上げる（アプデボタンがこれで新旧を見分ける）

/* =====================================================================
   動きの数値（simulator.html で決めた値）
   ===================================================================== */
const MOVE = {
  kickVx: 180, kickVy: 300, gravity: 420, maxFall: 0,
  airJumps: 1, airVy: 300, airMode: 'keep',
  slide: 0, slideAccel: 7, carry: 0,   // carry：上昇中に壁へ着いたとき上へ滑る勢い（0＝なし）
  // 斜めの壁から蹴るときの倍率（横, 上）。下向きの斜面は横向き多め、上向きの斜面は上向き多め
  kickDownSlope: { vx: 1.5, vy: 0.85 },   // 上:横 が 1 より小さい（45度より浅い）と、張り付いた斜面にぶつからない
  kickUpSlope: { vx: 0.7, vy: 1.25 },
  buffer: 0.14, speed: 1,
};

/* ---------- 画面と単位 ---------- */
const CELL = 18, COLS = 20;          // 1マス18px、横20マス
const W = CELL * COLS, H = 640;
const R = 11, HB = 10, HIT = 8;      // 見た目の半径 / 地形との当たり / トゲ・敵との当たり
const PX_PER_M = 120;                // 1m＝120px（体感に合わせて、はじめの60pxの2倍の長さ。数字は1/2）
const DT = 1 / 120;                  // 物理は固定ステップ（チェックと同じ動きになるように）

const MAX_HP = 3, INVINCIBLE = 1.1;
const LAVA = { delay: 3, speed: 50 };   // 一定の速さ（px/秒）。追いつき・加速なし
// 障害物：箱の大きさ、回る棒の長さ、出入りトゲ q のずれ（秒）、トゲの面の厚み、扇風機の押す強さ
const OB = { boxX: { w: 26, h: 18 }, boxY: { w: 20, h: 26 }, spin: 40, popOff: 1.6, teeth: 5 };
const FAN = { acc: 1000, max: 230 };
// 壁に hold 秒ついていると wobble 秒グラグラして、反対向きに push px/秒で離れて落ちる（すべりの水晶があれば、ゆっくり滑り落ちる）
const CLING = { hold: 2, wobble: 2, push: 50 };
// 地上の仕掛け：振り子（鎖の長さ・ゆれの角度・周期・鉄球の当たり）、筒（撃つ間隔・弾の速さ・光る秒・弾の当たり）、
// バネ（上への速さ）、崩れる足場（ぐらつく秒・となりのマスへ伝わる秒・消えている秒・組み上がる秒）
const SURF = { pendLen: 54, pendAmp: 1.05, pendPeriod: 2.6, pendHit: 10, canPeriod: 2.8, canSpeed: 120, canWarn: 0.5, ballHit: 5.5, springV: 470, crumbleWarn: 0.6, crumbleStep: 0.12, crumbleGone: 8, crumbleGrow: 0.3 };
const KICK_GRACE = 0.2;   // 壁を蹴った直後、その壁のトゲには当たらない時間（トゲの真下から跳んでも痛くない）

/* ---------- ローグライク：結晶（お金）→ ステージ上のガチャ所で水晶を引く → 2枠に装備。次のプレイには持ち越さない ---------- */

  const m = world.rows.length * CELL / PX_PER_M, pool = poolAt(m);
