<!-- @dsCard group="危険なもの" height=230 width=760 subtitle="光線。消える→予告の点滅→点く をくり返す" -->
<div id="root"></div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap';document.head.appendChild(l);})();
var root = document.getElementById('root');
var G = Kabe.grid(['#......#', '#......#', '#......#', '#......#', '#......#', '#......#'], '.');
Kabe.zoneRow(root, { w: 144, h: 108, zoom: 2, label: '光線', draw: function (g, P, t) {
  Kabe.terrain(g, P, G, t);
  Kabe.beam(g, P, 18, 126, 31, t);
  Kabe.beam(g, P, 18, 126, 76, t, { offset: 0.9 });
} });
</script>
