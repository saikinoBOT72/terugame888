<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>2人対戦 — おばけじゃんぴんぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #120d18; --cream: #fff4e6; --dim: #a99db5; --glow: #ffd98a; --p1: #8fd0ff; --p2: #ffb38a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: "M PLUS Rounded 1c", system-ui, sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; }
  .side { position: relative; flex: 1; min-width: 0; }
  .side iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .tag { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); padding: 2px 12px; border-radius: 999px; font-weight: 800; font-size: 15px; color: #120d18; pointer-events: none; z-index: 2; white-space: nowrap; }
  #s0 .tag { background: var(--p1); } #s1 .tag { background: var(--p2); }
  #mid { width: 4px; background: #000; }
  .ov { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,7,14,.78); z-index: 5; text-align: center; }
  .ov[hidden] { display: none; }
  .card { padding: 24px 28px; max-width: min(92vw, 560px); }
  h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 44px); }
  p { margin: 6px 0; color: var(--dim); font-size: 15px; line-height: 1.6; }
  .pads { display: flex; gap: 14px; justify-content: center; margin: 16px 0; }
  .pad { min-width: 150px; padding: 10px 14px; border-radius: 14px; border: 2px solid rgba(255,244,230,.2); font-weight: 800; }
  .pad.on { border-color: currentColor; }
  .pad small { display: block; font-weight: 500; color: var(--dim); font-size: 12px; margin-top: 2px; }
  #pad0 { color: var(--p1); } #pad1 { color: var(--p2); }
  button { font: inherit; font-weight: 800; font-size: 20px; color: #120d18; background: var(--glow); border: 0; border-radius: 999px; padding: 12px 34px; cursor: pointer; margin-top: 10px; }
  a.back { display: inline-block; margin-top: 14px; color: var(--dim); font-size: 13px; }
  #count { font-size: clamp(80px, 18vw, 180px); font-weight: 800; color: var(--glow); background: transparent; pointer-events: none; }
  .res { font-size: clamp(22px, 4vw, 34px); font-weight: 800; margin: 10px 0; }
  .res .w0 { color: var(--p1); } .res .w1 { color: var(--p2); }
  .done { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,7,14,.5); font-weight: 800; font-size: 26px; z-index: 3; pointer-events: none; }
  .done[hidden] { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="side" id="s0"><span class="tag" id="t0">1P</span><div class="done" id="d0" hidden></div></div>
  <div id="mid"></div>
  <div class="side" id="s1"><span class="tag" id="t1">2P</span><div class="done" id="d1" hidden></div></div>
</div>

<div class="ov" id="ovStart">
  <div class="card">
    <h1>2人対戦</h1>
    <p>同じ縦穴を、左右に分かれて登る。<br>2人とも落ちたら終わり。高く登った方の勝ち。</p>
    <div class="pads">
      <div class="pad" id="pad0">1P（左）<small id="pk0">キーボード W A S D</small></div>
      <div class="pad" id="pad1">2P（右）<small id="pk1">キーボード ↑ ← ↓ →</small></div>
    </div>
    <p>コントローラー：A で蹴る・十字キー左右で向き・下か B で「下」の水晶。<br>ガチャ所では左右でボタンを選んで A。iPad は左右の画面をタップしても遊べる。</p>
    <button id="btnStart" type="button">はじめる</button>
    <p id="startHint">A ボタン・Enter でもはじまる</p>
    <a class="back" href="./">← もどる</a>
  </div>
</div>
<div class="ov" id="ovCount" hidden><div id="count">3</div></div>
<div class="ov" id="ovEnd" hidden>
  <div class="card">
    <div class="res" id="resTitle"></div>
    <p id="resSub"></p>
    <button id="btnAgain" type="button">もう一回</button>
    <p>A ボタン・Enter でもう一回</p>
    <a class="back" href="./">← もどる</a>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const ready = [false, false], score = [null, null], frames = [];
let phase = 'start', seed = 0, actx = null;

// 音：親ページで1つ作り、2つの画面が使う（iPad はタップした所でしか音を出せないため）
function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
window.__vsAudio = () => { unlockAudio(); return actx; };
window.__vsReady = side => { ready[side] = true; };
window.__vsEnd = (side, m) => {
  score[side] = m;
  const d = $('d' + side); d.textContent = m + 'm'; d.hidden = false;
  if (score[0] != null && score[1] != null) setTimeout(showResult, 900);
};

// 2つの画面（本編を ?vs=0|1 で開く）
for (const i of [0, 1]) {
  const f = document.createElement('iframe');
  f.src = `index.html?vs=${i}&seed=1`; f.title = i ? '2P' : '1P'; f.setAttribute('allow', 'autoplay');
  $('s' + i).prepend(f); frames.push(f);
}
const api = i => { try { return frames[i].contentWindow.__vs; } catch (e) { return null; } };

function start() {
  if (phase !== 'start' && phase !== 'end') return;
  if (!ready[0] || !ready[1] || !api(0) || !api(1)) { $('startHint').textContent = 'よみこみ中…もう少し待ってね'; return; }
  unlockAudio();
  phase = 'count'; $('ovStart').hidden = $('ovEnd').hidden = true; $('ovCount').hidden = false;
  score[0] = score[1] = null; $('d0').hidden = $('d1').hidden = true;
  seed = (Math.random() * 4294967295) >>> 0 || 1;
  let n = 3; $('count').textContent = n;
  const tick = () => {
    n--;
    if (n > 0) { $('count').textContent = n; setTimeout(tick, 700); return; }
    $('ovCount').hidden = true; phase = 'play';
    api(0).start(seed); api(1).start(seed);
  };
  setTimeout(tick, 700);
}
function showResult() {
  phase = 'end';
  const [a, b] = score;
  $('resTitle').innerHTML = a === b ? '引き分け！' : `<span class="w${a > b ? 0 : 1}">${a > b ? '1P' : '2P'} の勝ち！</span>`;
  $('resSub').textContent = `1P ${a}m ・ 2P ${b}m`;
  $('ovEnd').hidden = false;
}
$('btnStart').onclick = start; $('btnAgain').onclick = start;

// 入力：k は L 左・R 右・A 蹴る・D 下
function input(side, k, down) {
  if (phase === 'play') { const a = api(side); if (a) a.input(k, down); return; }
  if (down && k === 'A') { unlockAudio(); start(); }
}
const KEYS = { a: [0, 'L'], d: [0, 'R'], w: [0, 'A'], s: [0, 'D'], ' ': [0, 'A'],
  ArrowLeft: [1, 'L'], ArrowRight: [1, 'R'], ArrowUp: [1, 'A'], ArrowDown: [1, 'D'], Enter: [1, 'A'] };
function onKey(key, down, repeat) {
  const m = KEYS[key.length === 1 ? key.toLowerCase() : key]; if (!m || repeat) return;
  input(m[0], m[1], down);
}
window.__vsKey = onKey;   // 画面（iframe）に入力が向いていても、ここに届く
addEventListener('keydown', e => { if (KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]) e.preventDefault(); onKey(e.key, true, e.repeat); });
addEventListener('keyup', e => onKey(e.key, false, false));
addEventListener('pointerdown', unlockAudio, true);

// コントローラー：つないだ順に 1P・2P
const prev = [{}, {}];
function padKeys(p) {
  const b = i => p.buttons[i] && p.buttons[i].pressed, x = p.axes[0] || 0, y = p.axes[1] || 0;
  return { L: b(14) || x < -0.5, R: b(15) || x > 0.5, A: b(0) || b(3) || b(12) || y < -0.6, D: b(1) || b(2) || b(13) || y > 0.6 };
}
function pollPads() {
  const pads = [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(p => p && p.connected).slice(0, 2);
  for (const i of [0, 1]) {
    const p = pads[i];
    $('pad' + i).classList.toggle('on', !!p);
    $('pk' + i).textContent = p ? 'コントローラー OK' : i ? 'キーボード ↑ ← ↓ →' : 'キーボード W A S D';
    const now = p ? padKeys(p) : {};
    for (const k of ['L', 'R', 'A', 'D']) if (!!now[k] !== !!prev[i][k]) input(i, k, !!now[k]);
    prev[i] = now;
  }
}

// 毎フレーム：コントローラーを読んで、相手の位置を渡す
function loop() {
  pollPads();
  const a0 = api(0), a1 = api(1);
  if (a0 && a1) {
    const g0 = a0.get(), g1 = a1.get();
    a0.put(g1); a1.put(g0);
    if (phase === 'play') {
      $('t0').textContent = `1P ${g0 ? g0.m : 0}m`; $('t1').textContent = `2P ${g1 ? g1.m : 0}m`;
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
