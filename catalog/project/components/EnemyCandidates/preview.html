<style>
  .ec { padding: 10px; display: grid; gap: 10px; }
  .ec h3 { margin: 0; font-size: 13px; font-weight: 800; color: var(--ui-ink); }
  .ec .kabe-fig figcaption { text-align: center; line-height: 1.4; }
  .ec .kabe-fig b { color: var(--ui-ink); }
</style>
<div class="ec" id="root"></div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap';document.head.appendChild(l);})();
(function () {
  var K = Kabe, E = K.ell, PI = Math.PI;
  // 体（enemy）・羽や腹（enemy-light）。どちらも ink で縁取り、2段の影
  function body(g, P, path, off) { K.solid(g, path, P.enemy, P.enemyShade, P.ink, off == null ? 1.2 : off, 1.0); }
  function soft(g, P, path, off) { K.solid(g, path, P.enemyLight, P.enemyShade, P.ink, off == null ? 0.7 : off, 0.9); }
  function glowPart(g, P, path) { K.solid(g, path, P.glow, K.mix(P.glow, '#000000', 0.25), P.ink, 0.5, 0.85); }
  // 白目と黒目（プレイヤーの線の目と見分ける）
  function eyes(g, P, y, look, s, gap) {
    s = s || 1; gap = gap == null ? 2.4 : gap;
    [-gap, gap].forEach(function (ex) {
      g.fillStyle = '#ffffff'; E(g, ex, y, 1.8 * s, 2 * s); g.fill();
      g.fillStyle = P.ink; E(g, ex + look * 0.5 * s, y + 0.2 * s, 0.95 * s, 1.15 * s); g.fill();
      g.fillStyle = '#ffffff'; E(g, ex - 0.3 * s, y - 0.5 * s, 0.35 * s, 0.35 * s); g.fill();
    });
  }
  function belly(g, P, x, y, rx, ry) { g.fillStyle = P.enemyLight; E(g, x, y, rx, ry); g.fill(); }
  function blobs(g, list) { g.beginPath(); list.forEach(function (c) { g.moveTo(c[0] + c[2], c[1]); g.arc(c[0], c[1], c[2], 0, PI * 2); }); }
  function bolt(g, P, x, y, s) { glowPart(g, P, function () { g.beginPath(); g.moveTo(x - 1.2 * s, y); g.lineTo(x + 2 * s, y); g.lineTo(x + 0.3 * s, y + 3 * s); g.lineTo(x + 2.4 * s, y + 3 * s); g.lineTo(x - 1.6 * s, y + 8 * s); g.lineTo(x - 0.2 * s, y + 4.4 * s); g.lineTo(x - 2.4 * s, y + 4.4 * s); g.closePath(); }); }
  function spark(g, P, x, y, r) { g.fillStyle = P.glow; g.beginPath(); for (var i = 0; i < 8; i++) { var a = i / 8 * PI * 2, d = i % 2 ? r * 0.35 : r; g.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); } g.closePath(); g.fill(); }
  function tentacle(g, P, x, y, len, ph, t, dot) {
    var path = function () { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.sin(t * 4 + ph) * 2.2, y + len * 0.55, x + Math.sin(t * 4 + ph + 1) * 1.2, y + len); };
    g.lineCap = 'round'; path(); g.strokeStyle = P.ink; g.lineWidth = 2.6; g.stroke(); path(); g.strokeStyle = P.enemyLight; g.lineWidth = 1.2; g.stroke();
    if (dot) { var ex = x + Math.sin(t * 4 + ph + 1) * 1.2, ey = y + len; K.solid(g, function () { E(g, ex, ey, 1.5, 1.5); }, P.glow, K.mix(P.glow, '#000000', 0.25), P.ink, 0.4, 0.8); }
  }

  var C = {
    underground: { name: '地下：コウモリ', list: [
      { id: 'A', name: 'まんまる', note: '丸い体に短い耳。羽のふちが3つの山', draw: function (g, P, t, look) {
        var wy = Math.sin(t * 13) * 4;
        [-1, 1].forEach(function (s) { soft(g, P, function () { g.beginPath(); g.moveTo(s * 5, -2); g.quadraticCurveTo(s * 11, -8 + wy, s * 17, -5 + wy); g.quadraticCurveTo(s * 16, wy * 0.5, s * 13.5, 0.5 + wy * 0.4); g.quadraticCurveTo(s * 12, -1 + wy * 0.3, s * 10, 2 + wy * 0.3); g.quadraticCurveTo(s * 8.5, 0.5, s * 6.5, 3); g.closePath(); }); });
        [-1, 1].forEach(function (s) { body(g, P, function () { g.beginPath(); g.moveTo(s * 2.2, -5.5); g.lineTo(s * 4.4, -10); g.lineTo(s * 6.2, -4.5); g.closePath(); }, 0.5); });
        body(g, P, function () { E(g, 0, 0.5, 7.5, 7.2); });
        belly(g, P, 0, 3.4, 3.6, 2.5); K.shine(g, -3.6, -3.2, 1.8, 1.1, 0.55); eyes(g, P, -1, look);
        g.fillStyle = '#ffffff'; [-1.2, 1.2].forEach(function (x) { g.beginPath(); g.moveTo(x - 0.5, 2.4); g.lineTo(x + 0.5, 2.4); g.lineTo(x, 3.8); g.closePath(); g.fill(); });
      } },
      { id: 'B', name: 'おおつばさ', note: '小さな体に大きな羽。羽の骨が見える', draw: function (g, P, t, look) {
        var wy = Math.sin(t * 11) * 5;
        [-1, 1].forEach(function (s) {
          soft(g, P, function () { g.beginPath(); g.moveTo(s * 4, -2); g.quadraticCurveTo(s * 12, -11 + wy, s * 21, -7 + wy); g.lineTo(s * 19, 1 + wy * 0.5); g.quadraticCurveTo(s * 17, -1 + wy * 0.4, s * 15, 2 + wy * 0.4); g.quadraticCurveTo(s * 12.5, -0.5 + wy * 0.3, s * 10.5, 3 + wy * 0.3); g.quadraticCurveTo(s * 8, 1, s * 5, 3); g.closePath(); });
          g.strokeStyle = P.enemyShade; g.lineWidth = 0.7; g.lineCap = 'round'; g.beginPath(); g.moveTo(s * 6, -2); g.lineTo(s * 19, 0.5 + wy * 0.5); g.moveTo(s * 7, -2); g.lineTo(s * 15, 1.8 + wy * 0.4); g.stroke();
        });
        [-1, 1].forEach(function (s) { body(g, P, function () { E(g, s * 3.6, -5.2, 2, 2.6, s * 0.35); }, 0.4); });
        body(g, P, function () { E(g, 0, 0.5, 6.2, 6); });
        belly(g, P, 0, 3, 3, 2); K.shine(g, -2.8, -2.6, 1.5, 0.9, 0.55); eyes(g, P, -0.8, look, 0.9, 2.1);
      } },
      { id: 'C', name: 'おおみみ', note: '長くとがった耳が目印。羽は小さく速い', draw: function (g, P, t, look) {
        var wy = Math.sin(t * 22) * 3;
        [-1, 1].forEach(function (s) { soft(g, P, function () { g.beginPath(); g.moveTo(s * 5.5, 0); g.quadraticCurveTo(s * 10, -4 + wy, s * 13, -1 + wy); g.quadraticCurveTo(s * 11, 1.5 + wy * 0.5, s * 9, 1 + wy * 0.4); g.quadraticCurveTo(s * 8, 3, s * 6, 3); g.closePath(); }); });
        [-1, 1].forEach(function (s) {
          body(g, P, function () { g.beginPath(); g.moveTo(s * 1.4, -5); g.quadraticCurveTo(s * 3, -13, s * 6.5, -15); g.quadraticCurveTo(s * 7, -9, s * 5.8, -3.5); g.closePath(); }, 0.6);
          g.fillStyle = P.enemyLight; g.beginPath(); g.moveTo(s * 2.8, -6); g.quadraticCurveTo(s * 3.8, -11, s * 5.8, -12.6); g.quadraticCurveTo(s * 5.8, -8.5, s * 5, -5); g.closePath(); g.fill();
        });
        body(g, P, function () { E(g, 0, 1, 6.6, 6.2); });
        belly(g, P, 0, 3.6, 3, 2); K.shine(g, -3, -1.8, 1.5, 0.9, 0.55); eyes(g, P, 0, look, 1.15, 2.5);
      } },
      { id: 'D', name: 'マント', note: '羽をマントのように閉じて滑空。えりがとがる', draw: function (g, P, t, look) {
        var o = 0.5 + 0.5 * Math.sin(t * 5), tx = 8 + o * 10, ty = 10 - o * 13;
        [-1, 1].forEach(function (s) { soft(g, P, function () { g.beginPath(); g.moveTo(s * 3, -3); g.quadraticCurveTo(s * (tx * 0.8), -6 - o * 3, s * tx, ty); g.quadraticCurveTo(s * (tx * 0.7), ty + 1, s * (tx * 0.55), ty + 3); g.quadraticCurveTo(s * 4, 5, s * 2, 6); g.closePath(); }); });
        body(g, P, function () { g.beginPath(); g.moveTo(-6, -2); g.lineTo(-8, -8); g.lineTo(-3, -5); g.lineTo(0, -6); g.lineTo(3, -5); g.lineTo(8, -8); g.lineTo(6, -2); g.closePath(); }, 0.5);
        body(g, P, function () { E(g, 0, 0, 6.8, 6.6); });
        K.shine(g, -3, -3, 1.6, 1, 0.55); eyes(g, P, -0.5, look);
        g.strokeStyle = P.ink; g.lineWidth = 0.7; g.lineCap = 'round'; [-1, 1].forEach(function (s) { g.beginPath(); g.moveTo(s * 4.4, -3.6); g.lineTo(s * 1.2, -2.8); g.stroke(); });
      } }
    ] },
    surface: { name: '地上：鳥', list: [
      { id: 'A', name: 'ころ鳥', note: 'ひよこのような丸い体。頭に毛が2本', draw: function (g, P, t, look) {
        var a = Math.sin(t * 13) * 0.6;
        [-1, 1].forEach(function (s) { g.save(); g.translate(s * 6, 0); g.rotate(-s * a); soft(g, P, function () { E(g, s * 3.5, -0.5, 4.2, 2.6, s * 0.3); }); g.restore(); });
        g.strokeStyle = P.ink; g.lineWidth = 1; g.lineCap = 'round'; g.beginPath(); g.moveTo(-0.5, -7); g.quadraticCurveTo(-1.5, -10, 0.5, -11.5); g.moveTo(0.8, -7); g.quadraticCurveTo(1.5, -9.5, 3.2, -10); g.stroke();
        body(g, P, function () { E(g, 0, 0, 7.4, 7); });
        belly(g, P, 0, 3, 4, 2.8); K.shine(g, -3.4, -3, 1.8, 1, 0.55); eyes(g, P, -1.3, look);
        glowPart(g, P, function () { g.beginPath(); g.moveTo(look * 1, 0.6); g.lineTo(look * 4.6, 1.6); g.lineTo(look * 1, 2.8); g.closePath(); });
      } },
      { id: 'B', name: 'つばめ', note: '細い体ととがった羽、ふたまたの尾', draw: function (g, P, t, look) {
        var wy = Math.sin(t * 12) * 4, L = function (x) { return x * look; };
        body(g, P, function () { g.beginPath(); g.moveTo(L(-5), 0); g.lineTo(L(-13), -3); g.lineTo(L(-9.5), 0.8); g.lineTo(L(-13), 4); g.lineTo(L(-5), 2.5); g.closePath(); }, 0.5);
        [-1, 1].forEach(function (s) { soft(g, P, function () { g.beginPath(); g.moveTo(-3 * s, -3); g.quadraticCurveTo(-6 * s, -10 + wy, -14 * s, -12 + wy); g.quadraticCurveTo(-8 * s, -4 + wy * 0.4, -1 * s, -1); g.closePath(); }); });
        body(g, P, function () { E(g, 0, 0, 8, 5.6); });
        belly(g, P, L(2), 2.4, 4, 2); K.shine(g, -3.4, -2.4, 1.6, 0.9, 0.55); eyes(g, P, -1.2, look, 0.9, 2);
        glowPart(g, P, function () { g.beginPath(); g.moveTo(L(7), -0.6); g.lineTo(L(10.5), 0.4); g.lineTo(L(7), 1.4); g.closePath(); });
      } },
      { id: 'C', name: 'ふくろう', note: '大きな顔の円と大きな目。羽ばたきはゆっくり', draw: function (g, P, t, look) {
        var a = Math.sin(t * 6) * 0.5;
        [-1, 1].forEach(function (s) { g.save(); g.translate(s * 7, 1); g.rotate(-s * a); soft(g, P, function () { E(g, s * 2.6, 0, 3.4, 4.6, s * 0.2); }); g.restore(); });
        [-1, 1].forEach(function (s) { body(g, P, function () { g.beginPath(); g.moveTo(s * 2.5, -6.5); g.lineTo(s * 6.5, -10.5); g.lineTo(s * 6.8, -4); g.closePath(); }, 0.5); });
        body(g, P, function () { E(g, 0, 0.5, 8, 7.6); });
        g.fillStyle = P.enemyLight; E(g, -2.8, -1.2, 3.4, 3.2); g.fill(); E(g, 2.8, -1.2, 3.4, 3.2); g.fill();
        K.shine(g, -5, -4.4, 1.3, 0.8, 0.55); eyes(g, P, -1.2, look, 1.3, 2.8);
        glowPart(g, P, function () { g.beginPath(); g.moveTo(-1, 1.6); g.lineTo(1, 1.6); g.lineTo(0, 3.6); g.closePath(); });
      } },
      { id: 'D', name: 'はち鳥', note: '針のように長いくちばし。羽はぶれて見える', draw: function (g, P, t, look) {
        var L = function (x) { return x * look; };
        for (var i = 0; i < 3; i++) { var an = -0.9 + Math.sin(t * 30 + i * 2.1) * 0.7; g.globalAlpha = i ? 0.35 : 0.9; g.save(); g.translate(L(-1), -3); g.rotate(look * an); soft(g, P, function () { E(g, 0, -5, 2.2, 5.5); }, 0.4); g.restore(); }
        g.globalAlpha = 1;
        body(g, P, function () { g.beginPath(); g.moveTo(L(-4), 1); g.lineTo(L(-10), 3); g.lineTo(L(-9), 5.6); g.lineTo(L(-3.5), 3.5); g.closePath(); }, 0.5);
        body(g, P, function () { E(g, 0, 1, 6, 5.2); });
        belly(g, P, L(1.5), 3, 3, 1.8); K.shine(g, -2.6, -1.8, 1.4, 0.8, 0.55); eyes(g, P, -0.2, look, 0.9, 2);
        glowPart(g, P, function () { g.beginPath(); g.moveTo(L(5), -0.6); g.lineTo(L(13), 0.4); g.lineTo(L(5), 1.2); g.closePath(); });
      } }
    ] },
    sky: { name: '上空：雷雲の子', list: [
      { id: 'A', name: 'もくもく', note: '丸い雲のかたまり。下に稲妻のしっぽ', draw: function (g, P, t, look) {
        if ((t * 2.3) % 1 < 0.7) bolt(g, P, 0, 4, 1.1);
        body(g, P, function () { blobs(g, [[-5, 1.5, 4.6], [0, -2, 6], [5, 1.5, 4.6], [-2, 3, 4.6], [2.5, 3, 4.6]]); });
        K.shine(g, -3, -4.6, 1.8, 1, 0.55); eyes(g, P, 0, look);
      } },
      { id: 'B', name: 'とげ雲', note: '雲の上に短いとげ。まわりに火花が散る', draw: function (g, P, t, look) {
        body(g, P, function () { g.beginPath(); g.moveTo(-8, 3); g.quadraticCurveTo(-10, -2, -5.5, -3.5); g.lineTo(-5, -8.5); g.lineTo(-2.2, -5.2); g.lineTo(0, -9.5); g.lineTo(2.2, -5.2); g.lineTo(5, -8.5); g.lineTo(5.5, -3.5); g.quadraticCurveTo(10, -2, 8, 3); g.quadraticCurveTo(7, 6.5, 0, 6.2); g.quadraticCurveTo(-7, 6.5, -8, 3); g.closePath(); });
        K.shine(g, -4.6, -1.6, 1.6, 0.9, 0.55); eyes(g, P, 0.4, look);
        var k = (t * 1.7) % 1; if (k < 0.4) { spark(g, P, -11, -2 + k * 4, 2.4); spark(g, P, 11, 4 - k * 4, 2); }
      } },
      { id: 'C', name: 'かみなり玉', note: '丸い玉に稲妻の帯。火花が2つまわる', draw: function (g, P, t, look) {
        body(g, P, function () { E(g, 0, 0, 7.6, 7.4); });
        g.save(); E(g, 0, 0, 7.6, 7.4); g.clip();
        g.fillStyle = P.glow; g.beginPath(); g.moveTo(-9, 2); for (var x = -9; x <= 9; x += 3) g.lineTo(x, (x / 3) % 2 ? 1 : 3.4); g.lineTo(9, 5.4); for (x = 9; x >= -9; x -= 3) g.lineTo(x, ((x / 3) % 2 ? 1 : 3.4) + 2.2); g.closePath(); g.fill(); g.restore();
        K.shine(g, -3.4, -3.6, 1.8, 1, 0.55); eyes(g, P, -1.6, look);
        g.strokeStyle = P.ink; g.lineWidth = 0.7; g.lineCap = 'round'; [-1, 1].forEach(function (s) { g.beginPath(); g.moveTo(s * 4.6, -5.2); g.lineTo(s * 1.2, -4.2); g.stroke(); });
        for (var i = 0; i < 2; i++) { var an = t * 3 + i * PI; spark(g, P, Math.cos(an) * 11, Math.sin(an) * 5, 2); }
      } },
      { id: 'D', name: '雨雲こぞう', note: '小さな角が2本。雨つぶを落としながら飛ぶ', draw: function (g, P, t, look) {
        for (var i = 0; i < 3; i++) { var k = (t * 1.4 + i / 3) % 1; g.globalAlpha = 1 - k; g.fillStyle = P.enemyLight; g.beginPath(); var dx = -4 + i * 4, dy = 6 + k * 9; g.moveTo(dx, dy - 2); g.quadraticCurveTo(dx + 1.3, dy, dx, dy + 1); g.quadraticCurveTo(dx - 1.3, dy, dx, dy - 2); g.fill(); }
        g.globalAlpha = 1;
        [-1, 1].forEach(function (s) { glowPart(g, P, function () { g.beginPath(); g.moveTo(s * 2, -6); g.lineTo(s * 3.6, -10.5); g.lineTo(s * 5, -5.5); g.closePath(); }); });
        body(g, P, function () { blobs(g, [[-5.5, 1.5, 4], [0, -1, 5.6], [5.5, 1.5, 4], [-2.5, 2.8, 4], [2.5, 2.8, 4]]); });
        K.shine(g, -3, -3.6, 1.6, 0.9, 0.55); eyes(g, P, 0, look, 0.9);
        g.strokeStyle = P.ink; g.lineWidth = 0.7; g.beginPath(); g.arc(0, 3.2, 1.2, 0.1 * PI, 0.9 * PI); g.stroke();
      } }
    ] },
    space: { name: '宇宙：クラゲ', list: [
      { id: 'A', name: 'かさクラゲ', note: 'ふちが波打つかさと、ゆれる触手4本', draw: function (g, P, t, look) {
        for (var i = 0; i < 4; i++) tentacle(g, P, -4.5 + i * 3, 3, 8, i, t);
        body(g, P, function () { g.beginPath(); g.moveTo(-8.5, 3.5); g.bezierCurveTo(-9, -9, 9, -9, 8.5, 3.5); for (var j = 0; j < 4; j++) { var a = 8.5 - j * 4.25, b = a - 4.25; g.quadraticCurveTo((a + b) / 2, 6.4, b, 3.5); } g.closePath(); });
        K.shine(g, -3.8, -3.4, 1.8, 1, 0.6); eyes(g, P, -0.6, look);
      } },
      { id: 'B', name: 'ちょうちん', note: '体の中で光る芯。ひらひらが3枚', draw: function (g, P, t, look) {
        [-3.5, 0, 3.5].forEach(function (x, i) { soft(g, P, function () { E(g, x, 6 + Math.sin(t * 3 + i) * 0.6, 2.2, 2.8); }, 0.4); });
        tentacle(g, P, -1.5, 7, 7, 0, t); tentacle(g, P, 1.5, 7, 6, 2, t);
        body(g, P, function () { E(g, 0, 0, 7.6, 7); });
        var pulse = 0.85 + Math.sin(t * 2) * 0.15, gl = g.createRadialGradient(0, 1.5, 0.5, 0, 1.5, 5); gl.addColorStop(0, K.alpha(P.glow, pulse)); gl.addColorStop(1, K.alpha(P.glow, 0));
        g.fillStyle = gl; E(g, 0, 1.5, 5, 5); g.fill(); g.fillStyle = P.glow; E(g, 0, 2.2, 1.6, 1.6); g.fill();
        K.shine(g, -3.6, -3.4, 1.7, 1, 0.6); eyes(g, P, -2, look, 0.9);
      } },
      { id: 'C', name: 'ほしクラゲ', note: '5本の腕の星形。ゆっくり回りながら漂う', draw: function (g, P, t, look) {
        var rot = Math.sin(t * 0.9) * 0.4;
        body(g, P, function () { g.beginPath(); for (var i = 0; i < 10; i++) { var a = rot - PI / 2 + i / 10 * PI * 2, r = i % 2 ? 4.6 : 9.5; var x = Math.cos(a) * r, y = Math.sin(a) * r; if (i === 0) g.moveTo(x, y); else g.lineTo(x, y); } g.closePath(); }, 1.0);
        g.fillStyle = P.enemyLight; E(g, 0, 1.2, 3.4, 2.2); g.fill();
        K.shine(g, -2.4, -3, 1.3, 0.8, 0.6); eyes(g, P, -0.6, look, 0.85, 2);
      } },
      { id: 'D', name: 'UFOクラゲ', note: '円盤の体と小さなドーム。光る点が並ぶ', draw: function (g, P, t, look) {
        for (var i = 0; i < 3; i++) tentacle(g, P, -4 + i * 4, 3, 7, i * 1.5, t, true);
        soft(g, P, function () { g.beginPath(); g.moveTo(-5.5, -2); g.bezierCurveTo(-5.5, -9.5, 5.5, -9.5, 5.5, -2); g.closePath(); });
        body(g, P, function () { E(g, 0, 0, 11, 3.8); });
        var pulse = 0.85 + Math.sin(t * 2) * 0.15; g.fillStyle = K.alpha(P.glow, pulse); [-7, -3.5, 0, 3.5, 7].forEach(function (x) { E(g, x, 1.2, 0.9, 0.9); g.fill(); });
        K.shine(g, -2.4, -6, 1.3, 0.8, 0.7); eyes(g, P, -4.4, look, 0.75, 1.8);
      } }
    ] }
  };

  var root = document.getElementById('root'), W = 112, H = 64, Z = 1.55;
  K.ZONES.forEach(function (z, zi) {
    var sec = C[z.id], h = document.createElement('h3'); h.textContent = sec.name; root.appendChild(h);
    var row = document.createElement('div'); row.className = 'kabe-row'; row.style.padding = '0'; root.appendChild(row);
    sec.list.forEach(function (c, ci) {
      var fig = document.createElement('figure'); fig.className = 'kabe-fig';
      var cv = K.canvas(W, H, Z, sec.name + ' 案' + c.id + ' ' + c.name);
      var cap = document.createElement('figcaption'); cap.innerHTML = '<b>案' + c.id + '　' + c.name + '</b><br>' + c.note;
      fig.appendChild(cv.c); fig.appendChild(cap); row.appendChild(fig);
      K.animate(function (t) {
        var P = K.pal(z.id), g = cv.g, tt = t + ci * 0.37 + zi * 0.21, look = Math.cos(tt * 0.7) > 0 ? 1 : -1;
        g.setTransform(cv.k, 0, 0, cv.k, 0, 0); g.clearRect(0, 0, W, H);
        K.background(g, P, 0, 0, W, H, t, 0);
        g.save(); g.translate(34, 35 + Math.sin(tt * 2) * 1.5); g.scale(1.6, 1.6); c.draw(g, P, tt, look); g.restore();
        g.fillStyle = K.alpha(P.uiPanel, 0.55); K.rr(g, 70, 10, 38, 46, 6); g.fill();
        K.ghost(g, P, 'sheet', 'stand', 81, 37, tt, 1, 1);
        g.save(); g.translate(99, 31 + Math.sin(tt * 2) * 1); c.draw(g, P, tt, look); g.restore();
      });
    });
  });
})();
</script>
