<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>2人対戦 — おばけじゃんぴんぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #120d18; --cream: #fff4e6; --dim: #a99db5; --glow: #ffd98a; --p1: #8fd0ff; --p2: #ffb38a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: "M PLUS Rounded 1c", system-ui, sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; }
  .side { position: relative; flex: 1; min-width: 0; }
  .side iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .tag { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); padding: 2px 12px; border-radius: 999px; font-weight: 800; font-size: 15px; color: #120d18; pointer-events: none; z-index: 2; white-space: nowrap; }
  #s0 .tag { background: var(--p1); } #s1 .tag { background: var(--p2); }
  #mid { width: 4px; background: #000; }
  .ov { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,7,14,.78); z-index: 5; text-align: center; }
  .ov[hidden] { display: none; }
  .card { padding: 24px 28px; max-width: min(92vw, 560px); }
  h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 44px); }
  p { margin: 6px 0; color: var(--dim); font-size: 15px; line-height: 1.6; }
  .pads { display: flex; gap: 14px; justify-content: center; margin: 16px 0; }
  .pad { min-width: 150px; padding: 10px 14px; border-radius: 14px; border: 2px solid rgba(255,244,230,.2); font-weight: 800; }
  .pad.on { border-color: currentColor; }
  .pad small { display: block; font-weight: 500; color: var(--dim); font-size: 12px; margin-top: 2px; }
  #pad0 { color: var(--p1); } #pad1 { color: var(--p2); }
  button { font: inherit; font-weight: 800; font-size: 20px; color: #120d18; background: var(--glow); border: 0; border-radius: 999px; padding: 12px 34px; cursor: pointer; margin-top: 10px; }
  a.back { display: inline-block; margin-top: 14px; color: var(--dim); font-size: 13px; }
  #count { font-size: clamp(80px, 18vw, 180px); font-weight: 800; color: var(--glow); background: transparent; pointer-events: none; }
  .res { font-size: clamp(22px, 4vw, 34px); font-weight: 800; margin: 10px 0; }
  .res .w0 { color: var(--p1); } .res .w1 { color: var(--p2); }
  .done { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,7,14,.5); font-weight: 800; font-size: 26px; z-index: 3; pointer-events: none; }
  .done[hidden] { display: none; }
  .warn { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 4px 14px; border-radius: 999px; background: rgba(20,15,28,.85); font-weight: 800; font-size: 16px; z-index: 2; pointer-events: none; white-space: nowrap; }
  .warn.near { background: #c94a2a; }
  .warn[hidden] { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="side" id="s0"><span class="tag" id="t0">1P</span><span class="warn" id="w0" hidden></span><div class="done" id="d0" hidden></div></div>
  <div id="mid"></div>
  <div class="side" id="s1"><span class="tag" id="t1">2P</span><span class="warn" id="w1" hidden></span><div class="done" id="d1" hidden></div></div>
</div>

<div class="ov" id="ovStart">
  <div class="card">
    <h1>2人対戦</h1>
    <p>同じ縦穴を、左右に分かれて登る。溶岩は2人で1つ（ガチャ所でも止まらない）。<br>先に落ちた方の負け。</p>
    <div class="pads">
      <div class="pad" id="pad0">1P（左）<small id="pk0">キーボード W A S D</small></div>
      <div class="pad" id="pad1">2P（右）<small id="pk1">キーボード ↑ ← ↓ →</small></div>
    </div>
    <p>コントローラー：A で蹴る・十字キー左右で向き・下か B で「下」の水晶。<br>ガチャ所では左右でボタンを選んで A。iPad は左右の画面をタップしても遊べる。</p>
    <button id="btnStart" type="button">はじめる</button>
    <p id="startHint">参加したら A ボタン・Enter でもはじまる</p>
    <p id="padList" style="font-size:12px"></p>
    <a class="back" href="./">← もどる</a>
  </div>
</div>
<div class="ov" id="ovCount" hidden><div id="count">3</div></div>
<div class="ov" id="ovEnd" hidden>
  <div class="card">
    <div class="res" id="resTitle"></div>
    <p id="resSub"></p>
    <button id="btnAgain" type="button">もう一回</button>
    <p>A ボタン・Enter でもう一回</p>
    <a class="back" href="./">← もどる</a>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const ready = [false, false], frames = [];
let phase = 'start', seed = 0, actx = null, endAt = 0;
const lava = { y: 200, delay: 3 };   // 2人で1つの溶岩（ゲームの座標。上がマイナス）

// 音：親ページで1つ作り、2つの画面が使う（iPad はタップした所でしか音を出せないため）
function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
window.__vsAudio = () => { unlockAudio(); return actx; };
window.__vsReady = side => { ready[side] = true; };
window.__vsEnd = () => {};   // 勝ち負けは毎フレームの loop で見る（先に落ちた方の負け）
// ガチャ所の「溶岩を近づける」：2人の溶岩が上がる（相手の 2m 下までは本編側で止めてある）
window.__vsLava = y => { lava.y = Math.min(lava.y, y); lava.delay = 0; };

// 2つの画面（本編を ?vs=0|1 で開く）
for (const i of [0, 1]) {
  const f = document.createElement('iframe');
  f.src = `index.html?vs=${i}&seed=1`; f.title = i ? '2P' : '1P'; f.setAttribute('allow', 'autoplay');
  $('s' + i).prepend(f); frames.push(f);
}
const api = i => { try { return frames[i].contentWindow.__vs; } catch (e) { return null; } };

function start() {
  if (phase !== 'start' && phase !== 'end') return;
  if (!ready[0] || !ready[1] || !api(0) || !api(1)) { $('startHint').textContent = 'よみこみ中…もう少し待ってね'; return; }
  unlockAudio();
  phase = 'count'; $('ovStart').hidden = $('ovEnd').hidden = true; $('ovCount').hidden = false;
  $('d0').hidden = $('d1').hidden = true;
  seed = (Math.random() * 4294967295) >>> 0 || 1;
  let n = 3; $('count').textContent = n;
  const tick = () => {
    n--;
    if (n > 0) { $('count').textContent = n; setTimeout(tick, 700); return; }
    $('ovCount').hidden = true; phase = 'play';
    api(0).start(seed); api(1).start(seed);
    const g = api(0).get(); lava.y = g.lavaY; lava.delay = g.delay; lastT = performance.now();
  };
  setTimeout(tick, 700);
}
const CAUSE = { lava: '呑まれた', spike: 'トゲで力尽きた', box: 'トゲの箱で力尽きた', spin: '回る棒で力尽きた', pend: '振り子で力尽きた', ball: '鉄球で力尽きた', mine: '機雷で力尽きた', bend: 'トゲブロックで力尽きた' };
// 勝負がついた：out[i] が true の人が落ちた（2人同時なら高い方の勝ち）
function decide(out, g) {
  phase = 'over';
  for (const i of [0, 1]) { if (!out[i]) api(i).halt(); $('w' + i).hidden = true; }
  let win = out[0] && out[1] ? (g[0].m === g[1].m ? -1 : g[0].m > g[1].m ? 0 : 1) : out[0] ? 1 : 0;
  for (const i of [0, 1]) if (out[i]) { const d = $('d' + i); d.textContent = '×'; d.hidden = false; }
  setTimeout(() => {
    phase = 'end';
    $('resTitle').innerHTML = win < 0 ? '引き分け！' : `<span class="w${win}">${win ? '2P' : '1P'} の勝ち！</span>`;
    const lose = g.map((x, i) => out[i] ? `${i ? '2P' : '1P'} は${x.cause === 'lava' ? x.rise + 'に' : ''}${CAUSE[x.cause] || '落ちた'}` : '').filter(Boolean).join('・');
    $('resSub').textContent = `${lose}（1P ${g[0].m}m ・ 2P ${g[1].m}m）`;
    $('ovEnd').hidden = false; endAt = performance.now();
  }, 1200);
}
$('btnStart').onclick = start; $('btnAgain').onclick = start;

// 入力：k は L 左・R 右・A 蹴る・D 下
function input(side, k, down) {
  if (phase === 'play') { const a = api(side); if (a) a.input(k, down); return; }
  if (down && k === 'A' && performance.now() - endAt > 1500) { unlockAudio(); start(); }   // 結果が出てすぐの連打では始めない
}
const KEYS = { a: [0, 'L'], d: [0, 'R'], w: [0, 'A'], s: [0, 'D'], ' ': [0, 'A'],
  ArrowLeft: [1, 'L'], ArrowRight: [1, 'R'], ArrowUp: [1, 'A'], ArrowDown: [1, 'D'], Enter: [1, 'A'] };
function onKey(key, down, repeat) {
  const m = KEYS[key.length === 1 ? key.toLowerCase() : key]; if (!m || repeat) return;
  input(m[0], m[1], down);
}
window.__vsKey = onKey;   // 画面（iframe）に入力が向いていても、ここに届く
addEventListener('keydown', e => { if (KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key]) e.preventDefault(); onKey(e.key, true, e.repeat); });
addEventListener('keyup', e => onKey(e.key, false, false));
addEventListener('pointerdown', unlockAudio, true);

// コントローラー：ボタンを押した順に 1P・2P（参加）。リモコンなどコントローラー扱いの機器が混ざっても、押さなければ入らない
// Safari は入力が向いているページにしか状態を渡さないことがあるので、親と左右の画面の両方から読んで新しい方を使う
const slot = [null, null], prev = [{}, {}];
function padKeys(p) {
  const b = i => p.buttons[i] && p.buttons[i].pressed, x = p.axes[0] || 0, y = p.axes[1] || 0;
  return { L: b(14) || x < -0.5, R: b(15) || x > 0.5, A: b(0) || b(3) || b(12) || y < -0.6, D: b(1) || b(2) || b(13) || y > 0.6 };
}
function allPads() {
  const map = new Map(), navs = [navigator];
  for (const f of frames) { try { navs.push(f.contentWindow.navigator); } catch (e) {} }
  for (const n of navs) {
    let list; try { list = n.getGamepads ? n.getGamepads() : []; } catch (e) { continue; }
    for (const p of list || []) if (p && p.connected) { const o = map.get(p.index); if (!o || p.timestamp > o.timestamp) map.set(p.index, p); }
  }
  return map;
}
const anyPressed = p => p.buttons.some(b => b && b.pressed) || p.axes.some(a => Math.abs(a) > 0.6);
const padName = p => (p.id || '').replace(/\s*\(.*$/, '').slice(0, 24) || 'コントローラー';
function pollPads() {
  const pads = allPads();
  for (const i of [0, 1]) if (slot[i] != null && !pads.has(slot[i])) { slot[i] = null; prev[i] = {}; }   // 外れた
  for (const [idx, p] of pads) {
    if (slot.includes(idx) || !anyPressed(p)) continue;
    const i = slot.indexOf(null); if (i < 0) break;
    slot[i] = idx; prev[i] = padKeys(p);   // 参加したボタンは操作にしない
  }
  for (const i of [0, 1]) {
    const p = slot[i] != null ? pads.get(slot[i]) : null;
    $('pad' + i).classList.toggle('on', !!p);
    $('pk' + i).textContent = p ? padName(p) : (i ? 'キーボード ↑ ← ↓ →' : 'キーボード W A S D') + '／コントローラーはボタンで参加';
    if (!p) continue;
    const now = padKeys(p);
    for (const k of ['L', 'R', 'A', 'D']) if (!!now[k] !== !!prev[i][k]) input(i, k, !!now[k]);
    prev[i] = now;
  }
  const list = [...pads.values()].map(p => `${p.index}: ${padName(p)}${slot.includes(p.index) ? `（${slot.indexOf(p.index) + 1}P）` : ''}`);
  const el = $('padList'); const t = list.length ? '見つかったコントローラー ' + list.join(' ・ ') : 'コントローラーが見つからない（つないだらボタンを押してね）';
  if (el.textContent !== t) el.textContent = t;
}

// 溶岩：基本の速さ ×（ブレーキ（下にいる人が3m以内で持っていれば）＋ 2人の欲ばりの上乗せ）。どちらかが一時停止中は止める
let lastT = performance.now();
function lavaStep(g) {
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (phase !== 'play' || g.some(x => x.st === 'pause')) return;
  if (lava.delay > 0) { lava.delay -= dt; return; }
  lava.y -= g[0].speed * (Math.min(g[0].brake, g[1].brake) + g[0].greed + g[1].greed) * dt;
}
// 毎フレーム：コントローラーを読んで、溶岩を動かし、相手の位置と溶岩を渡す
function loop() {
  pollPads();
  const a0 = api(0), a1 = api(1), g = a0 && a1 ? [a0.get(), a1.get()] : null;
  if (g && g[0] && g[1]) {
    lavaStep(g);
    a0.put(g[1], lava); a1.put(g[0], lava);
    if (phase === 'play') {
      for (const i of [0, 1]) {
        $('t' + i).textContent = `${i ? '2P' : '1P'} ${g[i].m}m`;
        // ガチャ所の中は本編の「溶岩まで」が出ないので、ここで出す
        const w = $('w' + i); w.hidden = g[i].st !== 'gacha' || lava.delay > 0;
        if (!w.hidden) { w.textContent = `▼ ${g[i].rise}まで ${Math.max(0, g[i].dist).toFixed(1)}m`; w.classList.toggle('near', g[i].dist < 3); }
      }
      const out = g.map(x => x.st === 'dying' || x.st === 'end' || x.sunk);
      if (out[0] || out[1]) decide(out, g);
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
