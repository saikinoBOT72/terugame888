<!-- @dsCard group="ローグライク" height=500 width=760 subtitle="ガチャ所の家と、ガチャの画面の玉" -->
<style>
.gh-sec { padding: 10px 10px 0; font-size: 12px; color: var(--ui-muted); }
.gh-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 6px 10px 10px; }
</style>
<div class="gh-sec">棚の上の家（4ゾーンで実寸）</div>
<div id="zones"></div>
<div class="gh-sec">ガチャの画面：回す前と、出た瞬間（★★★）</div>
<div class="gh-pair" id="orbs"></div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap';document.head.appendChild(l);})();
var G = Kabe.grid(['##......', '##......', '##......', '##......', '#####...', '##......'], '#');
Kabe.zoneRow(document.getElementById('zones'), { w: 8 * 18, h: 6 * 18, zoom: 2, label: 'ガチャ所', draw: function (g, P, t) {
  Kabe.terrain(g, P, G, t);
  Kabe.gachaHouse(g, P, 64, 4 * 18, t, true);
  Kabe.ghost(g, P, 'sheet', 'stand', 104, 4 * 18 - 11, t, -1, 1);
} });
var orbs = document.getElementById('orbs');
[['回す前', 0], ['出た瞬間', 1]].forEach(function (o) {
  var fig = document.createElement('figure'); fig.className = 'kabe-fig';
  var cv = Kabe.canvas(170, 110, 2, o[0]), cap = document.createElement('figcaption'); cap.textContent = o[0];
  fig.appendChild(cv.c); fig.appendChild(cap); orbs.appendChild(fig);
  Kabe.animate(function (t) {
    var P = Kabe.pal('underground'), g = cv.g; g.setTransform(cv.k, 0, 0, cv.k, 0, 0); g.clearRect(0, 0, 170, 110);
    g.fillStyle = P.uiPanel; g.fillRect(0, 0, 170, 110);
    if (!o[1]) Kabe.gachaOrb(g, P, 85, 50, t, 0.15 + 0.15 * Math.sin(t));
    else { Kabe.gemBurst(g, P, 3, 85, 52, t, 1); Kabe.gem(g, P, 'turn', 3, 85, 52 + Math.sin(t * 2) * 1.5, 2.4, t); }
  });
});
</script>
