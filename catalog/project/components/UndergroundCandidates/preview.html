<!-- @dsCard group="危険なもの" height=720 width=760 subtitle="地下の敵（顔のない4案）と、危険なものの色（4案）。色を押すと敵の危険な部分の色も変わる" -->
<style>
  .uc { padding: 10px; display: grid; gap: 10px; }
  .uc h3 { margin: 0; font-size: 13px; font-weight: 800; color: var(--ui-ink); }
  .uc .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .uc .kabe-fig figcaption { text-align: center; line-height: 1.4; }
  .uc .kabe-fig b { color: var(--ui-ink); }
  .uc .pick { cursor: pointer; border-radius: 10px; padding: 4px; border: 2px solid transparent; background: none; font: inherit; color: inherit; }
  .uc .pick[aria-pressed="true"] { border-color: var(--ui-ink); }
  .uc .pick:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  @media (max-width: 520px) { .uc .grid2 { grid-template-columns: minmax(0, 1fr); } }
</style>
<div class="uc">
  <h3>地下の敵：顔のない4案（左が拡大、右は実寸で縦穴の中）</h3>
  <div class="grid2" id="enemies"></div>
  <h3>危険なものの色：トゲ・光線・敵の痛い所（押すと上の敵にも反映）</h3>
  <div class="kabe-row" id="colors" style="padding:0"></div>
</div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap';document.head.appendChild(l);})();
(function () {
  var K = Kabe, E = K.ell, PI = Math.PI;
  // 本体の鉄の色（決まったら地下の enemy / enemy-shade / enemy-light をこの値にする）
  var M = { base: '#8f88a6', shade: '#655f7d', light: '#c3bed6' };
  var HZ = [
    { name: 'コーラル（いま）', note: '赤いマフラーと近く、まぎらわしい', hazard: '#ff8a80', hazardShade: '#e0645d', hazardLight: '#ffc7bf' },
    { name: 'だいだい', note: '溶岩と同じ「熱い」色。地上の敵のオレンジと近い', hazard: '#ff9f43', hazardShade: '#d97a1f', hazardLight: '#ffd3a1' },
    { name: 'こはく', note: '暗い地下でいちばん目立つ。地上・上空の光る飾りと近い', hazard: '#ffc94a', hazardShade: '#d99a1c', hazardLight: '#ffe9a8' },
    { name: 'むらさき', note: '赤みをやめる案。宇宙の光る飾りと近い', hazard: '#c58cff', hazardShade: '#9a5fd6', hazardLight: '#e6ccff' }
  ];
  var cur = 0;
  function palWith(i) { var P = Object.assign({}, K.pal('underground')), h = HZ[i]; P.hazard = h.hazard; P.hazardShade = h.hazardShade; P.hazardLight = h.hazardLight; return P; }
  function metal(g, P, path, off) { K.solid(g, path, M.base, M.shade, P.ink, off == null ? 1.1 : off, 1.0); }
  function hz(g, P, path, off) { K.solid(g, path, P.hazard, P.hazardShade, P.ink, off == null ? 0.6 : off, 0.9); }
  function inner(g, c) { g.strokeStyle = c; g.lineWidth = 0.7; g.lineCap = 'round'; }

  var C = [
    { id: 'A', name: 'トゲ鉄球', note: '転がりながら飛ぶ鉄の玉。トゲ8本が回る', draw: function (g, P, t, dir) {
      var rot = t * dir * 2.4, i;
      for (i = 0; i < 8; i++) (function (a) {
        var cx = Math.cos(a), cy = Math.sin(a);
        hz(g, P, function () { g.beginPath(); g.moveTo(cx * 5.4 - cy * 1.8, cy * 5.4 + cx * 1.8); g.lineTo(cx * 10.2, cy * 10.2); g.lineTo(cx * 5.4 + cy * 1.8, cy * 5.4 - cx * 1.8); g.closePath(); }, 0.4);
      })(rot + i * PI / 4);
      var ball = function () { E(g, 0, 0, 6.8, 6.8); };
      metal(g, P, ball, 1.3);
      g.save(); ball(); g.clip(); inner(g, M.shade); g.beginPath(); g.ellipse(0, 0, 6.8, 2.4, rot, 0, PI * 2); g.stroke(); g.restore();
      [0, PI].forEach(function (o) { var x = Math.cos(rot + o) * 6.8, y = Math.sin(rot + o) * 2.4, c = Math.cos(rot), s = Math.sin(rot);
        var px = x * c - y * s, py = x * s + y * c; if (Math.hypot(px, py) < 6) { g.fillStyle = M.shade; E(g, px + 0.3, py + 0.3, 1.1, 1.1); g.fill(); g.fillStyle = M.light; E(g, px, py, 0.8, 0.8); g.fill(); } });
      K.shine(g, -2.8, -3, 2, 1.1, 0.6);
    } },
    { id: 'B', name: '回転ノコ', note: 'レールに沿って行き来する丸ノコ。刃のふちが危険の色', rail: true, draw: function (g, P, t, dir) {
      var rot = t * dir * 9, n = 12, st = PI * 2 / n;
      hz(g, P, function () { g.beginPath(); for (var i = 0; i < n; i++) { var a = rot + i * st; g.lineTo(Math.cos(a) * 7.2, Math.sin(a) * 7.2); g.lineTo(Math.cos(a + st * 0.7) * 9.8, Math.sin(a + st * 0.7) * 9.8); } g.closePath(); }, 0.5);
      inner(g, P.hazardLight); g.beginPath(); g.arc(0, 0, 7.6, PI * 1.05, PI * 1.6); g.stroke();
      metal(g, P, function () { E(g, 0, 0, 5.6, 5.6); }, 0.9);
      for (var j = 0; j < 3; j++) { var a2 = rot * 0.999 + j * PI * 2 / 3; g.fillStyle = M.shade; E(g, Math.cos(a2) * 3.4, Math.sin(a2) * 3.4, 1.1, 1.1); g.fill(); }
      K.solid(g, function () { E(g, 0, 0, 1.7, 1.7); }, M.light, M.shade, P.ink, 0.4, 0.8);
      K.shine(g, -2.4, -2.6, 1.5, 0.8, 0.6);
    } },
    { id: 'C', name: '掘削ドリル', note: '進む向きに回るドリルの先。上に小さなランプ', draw: function (g, P, t, dir) {
      var L = function (x) { return x * dir; }, sp = (t * 10) % 3;
      [-1, 1].forEach(function (s) { metal(g, P, function () { g.beginPath(); g.moveTo(L(-6), s * 3.6); g.quadraticCurveTo(L(-9.6), s * 5.4, L(-10.4), s * 7.2); g.quadraticCurveTo(L(-7), s * 6.6, L(-3.6), s * 3.6); g.closePath(); }, 0.4); });
      metal(g, P, function () { K.rr(g, dir > 0 ? -9 : -2, -5, 11, 10, 4.5); }, 1.1);
      inner(g, M.shade); g.beginPath(); g.moveTo(L(-5.6), -4.6); g.lineTo(L(-5.6), 4.6); g.stroke();
      K.shine(g, L(-5) - 1, -2.6, 1.8, 0.9, 0.6);
      var bit = function () { g.beginPath(); g.moveTo(L(3), -4.6); g.quadraticCurveTo(L(9), -2.4, L(12.6), 0); g.quadraticCurveTo(L(9), 2.4, L(3), 4.6); g.closePath(); };
      hz(g, P, bit, 0.6);
      g.save(); bit(); g.clip(); g.strokeStyle = P.hazardShade; g.lineWidth = 1.1;
      for (var x = -3; x < 12; x += 3) { var xx = x + sp; g.beginPath(); g.moveTo(L(xx), -5); g.lineTo(L(xx + 2.2), 5); g.stroke(); } g.restore();
      K.solid(g, function () { K.rr(g, dir > 0 ? 1.4 : -3.4, -5.4, 2, 10.8, 1); }, M.light, M.shade, P.ink, 0.4, 0.8);
      var lx = L(-4), ly = -6.2, gl = g.createRadialGradient(lx, ly, 0.5, lx, ly, 6); gl.addColorStop(0, K.alpha(P.glow, 0.45 * (0.85 + Math.sin(t * 2) * 0.15))); gl.addColorStop(1, K.alpha(P.glow, 0));
      g.fillStyle = gl; E(g, lx, ly, 6, 6); g.fill();
      K.solid(g, function () { g.beginPath(); g.arc(lx, ly + 0.8, 1.8, PI, 0); g.closePath(); }, P.glow, K.mix(P.glow, '#000000', 0.25), P.ink, 0.3, 0.8);
    } },
    { id: 'D', name: '火の玉', note: '溶岩から飛び出した火のかたまり。炎のしっぽがゆらぐ', draw: function (g, P, t, dir) {
      var L = function (x) { return x * dir; }, f = function (k) { return Math.sin(t * 9 + k) * 1.2; };
      var gl = g.createRadialGradient(0, 0, 1, 0, 0, 15); gl.addColorStop(0, K.alpha(P.riseLight, 0.4)); gl.addColorStop(1, K.alpha(P.riseLight, 0)); g.fillStyle = gl; E(g, 0, 0, 15, 15); g.fill();
      for (var i = 0; i < 3; i++) { var k = (t * 1.8 + i / 3) % 1; g.fillStyle = K.alpha(P.riseTop, 1 - k); E(g, L(-8 - k * 12), (i - 1) * 3 + Math.sin(t * 5 + i) * 1.5, 1.2 * (1 - k * 0.5), 1.2 * (1 - k * 0.5)); g.fill(); }
      var flame = function (s) { g.beginPath(); g.moveTo(L(2) * s, -6.4 * s); g.quadraticCurveTo(L(-4) * s, -7.8 * s, L(-12) + f(0), -7.4 * s + f(1)); g.quadraticCurveTo(L(-8.4) * s, -4.2 * s, L(-6.6) * s, -2.6 * s); g.quadraticCurveTo(L(-11) * s, -2.4 * s, L(-16.5) + f(2), f(3) * 0.6); g.quadraticCurveTo(L(-11) * s, 2.4 * s, L(-6.6) * s, 2.6 * s); g.quadraticCurveTo(L(-8.4) * s, 4.2 * s, L(-12) + f(4), 7.4 * s + f(5)); g.quadraticCurveTo(L(-4) * s, 7.8 * s, L(2) * s, 6.4 * s); g.arc(L(1) * s, 0, 6.5 * s, PI / 2, -PI / 2, dir > 0); g.closePath(); };
      K.solid(g, function () { flame(1); }, P.rise, K.mix(P.rise, '#000000', 0.22), P.ink, 1.1, 1.0);
      g.save(); g.translate(L(1.5), 0); g.scale(0.62, 0.62); g.fillStyle = P.riseLight; flame(1); g.fill(); g.restore();
      g.fillStyle = P.riseTop; E(g, L(1.6), 0.4, 2.8, 2.6); g.fill();
      K.shine(g, L(1) - 2.4, -3.2, 1.5, 0.8, 0.6);
    } }
  ];

  var enemiesEl = document.getElementById('enemies'), colorsEl = document.getElementById('colors');
  var SCENE = K.grid(['#....#', '#....#', '#....#', '#....#', '#....#'], '.');
  C.forEach(function (c, ci) {
    var W = 180, H = 80, fig = document.createElement('figure'); fig.className = 'kabe-fig';
    var cv = K.canvas(W, H, 2, '地下の敵 案' + c.id + ' ' + c.name);
    var cap = document.createElement('figcaption'); cap.innerHTML = '<b>案' + c.id + '　' + c.name + '</b><br>' + c.note;
    fig.appendChild(cv.c); fig.appendChild(cap); enemiesEl.appendChild(fig);
    K.animate(function (t) {
      var P = palWith(cur), g = cv.g, tt = t + ci * 0.4;
      g.setTransform(cv.k, 0, 0, cv.k, 0, 0); g.clearRect(0, 0, W, H);
      K.background(g, P, 0, 0, W, H, t, 0);
      g.fillStyle = K.alpha(P.uiInk, 0.05); K.rr(g, 4, 4, 64, 72, 8); g.fill();
      g.save(); g.translate(36, 40 + Math.sin(tt * 2) * 1.2); g.scale(2.3, 2.3); c.draw(g, P, tt, 1); g.restore();
      K.terrain(g, P, SCENE, t, 72, -5);
      var ex = 126 + Math.sin(tt * 1.1) * 22, dir = Math.cos(tt * 1.1) > 0 ? 1 : -1, ey = c.rail ? 28 : 28 + Math.sin(tt * 2) * 4;
      if (c.rail) { g.fillStyle = K.alpha(P.terrainShade, 0.7); K.rr(g, 90, 27.2, 72, 1.6, 0.8); g.fill(); }
      K.ghost(g, P, 'sheet', 'cling', 100, 60, tt, 1, 1);
      g.save(); g.translate(ex, ey); c.draw(g, P, tt, dir); g.restore();
    });
  });
  var CMAP = K.grid(['#....#', '#^..^#', '#^..^#', '#....#'], '.'), picks = [];
  HZ.forEach(function (h, hi) {
    var W = 108, H = 72, btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pick kabe-fig'; btn.setAttribute('aria-pressed', hi === cur ? 'true' : 'false');
    var cv = K.canvas(W, H, 1.6, '危険なものの色 ' + h.name);
    var cap = document.createElement('span'); cap.className = 'kabe-cap'; cap.style.display = 'block'; cap.style.textAlign = 'center'; cap.innerHTML = '<b style="color:var(--ui-ink)">' + h.name + '</b><br>' + h.note;
    btn.appendChild(cv.c); btn.appendChild(cap); colorsEl.appendChild(btn); picks.push(btn);
    btn.onclick = function () { cur = hi; picks.forEach(function (b, i) { b.setAttribute('aria-pressed', i === cur ? 'true' : 'false'); }); };
    K.animate(function (t) {
      var P = palWith(hi), g = cv.g; g.setTransform(cv.k, 0, 0, cv.k, 0, 0); g.clearRect(0, 0, W, H);
      K.background(g, P, 0, 0, W, H, t, 0); K.terrain(g, P, CMAP, t);
      K.ghost(g, P, 'sheet', 'jump', 54, 38, t, 1, 1);
    });
  });
})();
</script>
