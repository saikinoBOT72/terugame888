/* ---------- 高さ100mごとのプール ---------- */
const POOLS = [
  { from: 0, name: '地底の洞窟', pieces: ['z1_open', 'z1_alternate', 'z1_longwall', 'z1_funnel', 'z1_shelves', 'z1_pillar', 'z1_blocks', 'z1_sideleft'] },

];
const poolAt = m => { let p = POOLS[0]; for (const q of POOLS) if (m >= q.from) p = q; return p; };

/* =====================================================================
   地形（マス目 → 当たり判定の線分）
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

function newWorld() { return { rows: [], edges: [], edgeRow: -1, placed: [], ends: new Map() }; }
// 行 r は y = -(r+1)*CELL 〜 -r*CELL（上がマイナス）。r < 0 は地面、範囲外の列は壁
function raw(w, c, r) { if (c < 0 || c >= COLS || r < 0) return '#'; const row = w.rows[r]; return row ? row[c] : '.'; }
const isWall = t => t === '#';
function tile(w, c, r) {
  const t = raw(w, c, r);
  if (t === '/') {   // ◢（右下が壁）か ◤（左上が壁）
    const br = isWall(raw(w, c + 1, r)) + isWall(raw(w, c, r - 1)), tl = isWall(raw(w, c - 1, r)) + isWall(raw(w, c, r + 1));
    return br >= tl ? 'BR' : 'TL';
  }
  if (t === '\\') {  // ◣（左下が壁）か ◥（右上が壁）
    const bl = isWall(raw(w, c - 1, r)) + isWall(raw(w, c, r - 1)), tr = isWall(raw(w, c + 1, r)) + isWall(raw(w, c, r + 1));
    return bl >= tr ? 'BL' : 'TR';
  }
  return t;
}
const SIDES = { '#': 'LRTB', BR: 'RB', BL: 'LB', TL: 'LT', TR: 'RT' };
const solidSide = (t, s) => (SIDES[t] || '').includes(s);
function addEdge(w, ax, ay, bx, by, nx, ny, kind, r) {
  const e = { ax, ay, bx, by, nx, ny, kind, minX: Math.min(ax, bx), maxX: Math.max(ax, bx), minY: Math.min(ay, by), maxY: Math.max(ay, by), smoothA: false, smoothB: false };
  (w.edges[r] || (w.edges[r] = [])).push(e);
  // まっすぐつながる線同士のつなぎ目は「角」として当たらないようにする（マスの境目で引っかからない）
  for (const [px, py, end] of [[ax, ay, 'A'], [bx, by, 'B']]) {
    const k = `${px},${py},${nx.toFixed(3)},${ny.toFixed(3)},${kind}`, other = w.ends.get(k);
    if (other) { e['smooth' + end] = true; other.e['smooth' + other.end] = true; } else w.ends.set(k, { e, end });
  }
}
function buildEdges(w, upto) {
  const S = Math.SQRT1_2;
  for (let r = w.edgeRow + 1; r <= upto; r++) {
    if (r === 0) for (let c = 0; c < COLS; c++) if (!solidSide(tile(w, c, 0), 'B')) addEdge(w, c * CELL, 0, (c + 1) * CELL, 0, 0, -1, 'wall', 0);
    for (let c = 0; c < COLS; c++) {
      const t = tile(w, c, r), x0 = c * CELL, x1 = x0 + CELL, yT = -(r + 1) * CELL, yB = -r * CELL;
      if (!SIDES[t]) continue;
      if (solidSide(t, 'L') && !solidSide(tile(w, c - 1, r), 'R')) addEdge(w, x0, yB, x0, yT, -1, 0, 'wall', r);
      if (solidSide(t, 'R') && !solidSide(tile(w, c + 1, r), 'L')) addEdge(w, x1, yB, x1, yT, 1, 0, 'wall', r);
      if (solidSide(t, 'T') && !solidSide(tile(w, c, r + 1), 'B')) addEdge(w, x0, yT, x1, yT, 0, -1, 'wall', r);
      if (solidSide(t, 'B') && !solidSide(tile(w, c, r - 1), 'T')) addEdge(w, x0, yB, x1, yB, 0, 1, 'wall', r);
      if (t === 'BR') addEdge(w, x0, yB, x1, yT, -S, -S, 'wall', r);
      if (t === 'BL') addEdge(w, x0, yT, x1, yB, S, -S, 'wall', r);
      if (t === 'TL') addEdge(w, x1, yT, x0, yB, S, S, 'wall', r);
      if (t === 'TR') addEdge(w, x0, yT, x1, yB, -S, S, 'wall', r);
    }
  }
  w.edgeRow = Math.max(w.edgeRow, upto);
}
function appendRows(w, rows) {
  const r0 = w.rows.length;
  for (const row of rows) w.rows.push(row);
  buildEdges(w, w.rows.length - 2);   // いちばん上の行は、上が決まってから
  return r0;
}
// トゲのマス → 当たる四角（となりの壁にくっついた側）

   到達チェック（詰まないかを調べる）
   パーツの上下につなぎ口と同じ形を足した小さな世界を作り、
   入口の全部の位置から「蹴る＋2段ジャンプを押す時間」を総当たりで試す。
     ok        = 入口のどこから入っても、ダメージなしで出口まで行ける（必須）
     hurtSpots = そこに着地すると、ダメージを受けないと先へ進めない場所の数（「着地点を誤ると痛い」場所。あってよい）

function checkPiece(id) {

let state = 'title', world = null, P = null, G = null, inputBuf = 0, debug = false, showCheck = false;
const cam = { y: 0, shake: 0 };
const checkCache = {};
let particles = [], floaters = [];

function placePiece(id) {
  const pc = PIECES[id], r0 = appendRows(world, pc.rows);
  world.placed.push({ id, r0, r1: r0 + pc.rows.length - 1 });
}
const connector = row => row.replace(/[^#]/g, '.');
function nextPiece() {
  const lastP = world.placed[world.placed.length - 1], topRow = PIECES[lastP.id].rows[PIECES[lastP.id].rows.length - 1];
  const m = world.rows.length * CELL / PX_PER_M, pool = poolAt(m);
  const recent = world.placed.slice(-2).map(p => p.id);
  let cands = pool.pieces.filter(id => connector(PIECES[id].rows[0]) === connector(topRow) && !recent.includes(id));
  if (!cands.length) cands = pool.pieces.filter(id => connector(PIECES[id].rows[0]) === connector(topRow));
  const within = (m - pool.from) / 100;   // プールの中で上に行くほど難しいパーツが出やすい
  const wt = id => { const d = PIECES[id].diff; return d <= 1 + within * 2.5 ? 1 : 0.25; };
  let r = Math.random() * cands.reduce((s, id) => s + wt(id), 0);
  for (const id of cands) if ((r -= wt(id)) < 0) return id;
  return cands[0];
}
function ensureAhead() {
  while (-world.rows.length * CELL > cam.y - H * 1.5) placePiece(nextPiece());
}

function newGame() {
  world = newWorld();
  placePiece('z1_start');
  P = newBody(2 * CELL + HB, -HB, -1);
  P.squash = 0; live = null;
  G = { time: 0, airT: 0, hp: MAX_HP, inv: 0, best: 0, cause: '', lavaY: 200, lavaDelay: LAVA.delay, mark: 0 };
  cam.y = 60 - H; cam.shake = 0; inputBuf = 0; particles = []; floaters = [];
  bands.clear();

}
function heightM() { return Math.max(0, -P.y - HB) / PX_PER_M; }

}
function tryAct() {

    kick(world, P); inputBuf = 0; P.squash = -0.28; sfx.kick();

    const r = Math.floor(-P.y / CELL), c = Math.floor(P.x / CELL), dir = Math.sign(P.vx);
    if (dir) { let k = 0; while (k < COLS && !isWall(raw(world, c + dir * (k + 1), r))) k++; const dist = dir > 0 ? (c + k + 1) * CELL - HB - P.x : P.x - (c - k) * CELL - HB; if (dist / Math.abs(P.vx) < 0.08) return; }

  };
}
function bandCanvas(b) {
  if (bands.has(b)) return bands.get(b);
  if (world.rows.length < (b + 1) * BAND + 2) return null;   // 上の行がまだない
  const r0 = b * BAND, pad = 2 * CELL, yTop = -(r0 + BAND) * CELL - pad, hpx = BAND * CELL + pad * 2, k = scale * dpr;
  const c = document.createElement('canvas'); c.width = Math.ceil(W * k); c.height = Math.ceil(hpx * k);
  const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, 0, -yTop * k);
  Kabe.terrain(g, PAL, bandGrid(r0), 0, 0, -(r0 + BAND) * CELL);
  const out = { c, yTop, hpx };
  bands.set(b, out);
  return out;
}

/* ---------- プレイヤー（B1「ふんわり」） ---------- */
// カタログのポーズへ少しずつ寄せる（マフラーとすそが体より遅れてついてくる）
let live = null;
function poseId() {
  if (state === 'dying' || G.inv > INVINCIBLE - 0.45) return 'hurt';
  if (P.side) return 'cling';
  if (P.ground) return 'stand';
  return G.airT > 0 ? 'air' : 'jump';
}
function updatePose(dt) {
  const id = poseId(), Q = Kabe.POSES[id];
  // 毎回作り直す（前のポーズの ring などが残らないように）。マフラーとすそだけ引き継ぐ
  const sc = live ? live.scarf : Q.scarf.map(p => p.slice()), hem = live ? live.hem : (Q.hem || 0);
  live = Kabe.POSES.live = Object.assign({}, Q, { scarf: sc, hem, id });
  const k = Math.min(1, dt * 10);
  sc.forEach((p, i) => { const kk = k * (1 - i * 0.14); p[0] += (Q.scarf[i][0] - p[0]) * kk; p[1] += (Q.scarf[i][1] - p[1]) * kk; });
  live.hem += ((Q.hem || 0) - live.hem) * k * 0.7;
}
function drawPlayer() {
  const p = P, t = G.time;
  if (!live) updatePose(1);
  const face = p.side ? -p.side : (p.face || 1);
  ctx.globalAlpha = G.inv > 0 ? 0.65 : 1;
  ctx.save(); ctx.translate(p.x, p.y);
  if (p.side) ctx.rotate(Math.atan2(p.wn.y, p.wn.x) - (p.side < 0 ? 0 : Math.PI));
  const air = !canAct(p), st = air ? Math.min(0.1, Math.abs(p.vy) / 4000) : 0;
  ctx.scale(1 + p.squash * 0.35 - st, 1 - p.squash * 0.3 + st);
  Kabe.ghost(ctx, PAL, 'sheet', 'live', 0, 0, t, face, 1);
  ctx.restore();
  ctx.globalAlpha = 1;
  if (air && p.air > 0) { ctx.fillStyle = PAL.playerShade; ctx.beginPath(); ctx.arc(p.x, p.y + 19, 1.6, 0, Math.PI * 2); ctx.fill(); }
}

/* ---------- 敵・溶岩・エフェクト ---------- */
function drawLava() {
  const y = G.lavaY, bottom = cam.y + H + 20;
  if (y > bottom) return;
  Kabe.rise(ctx, PAL, 0, y, W, bottom - y, G.time);
}
function drawParticles() {
  for (const q of particles) {
    const a = Math.max(0, q.life / q.max);
    if (q.kind === 'dust') { ctx.fillStyle = rgba(PAL.terrainLight, a * 0.85); ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1.6 - a * 0.6), 0, Math.PI * 2); ctx.fill(); }
    else if (q.kind === 'ring') { ctx.strokeStyle = rgba(PAL.playerShade, a); ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(q.x, q.y, 12 + (1 - a) * 16, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    else if (q.kind === 'spark') { ctx.fillStyle = rgba(PAL.hazard, a); ctx.beginPath(); ctx.arc(q.x, q.y, 2, 0, Math.PI * 2); ctx.fill(); }
    else if (q.kind === 'puff') { ctx.globalAlpha = a; ctx.fillStyle = q.r > 5 ? PAL.scarf : PAL.playerBody; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1.5 - a * 0.5), 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  }
  ctx.font = `800 15px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life); ctx.fillStyle = PAL.glow; ctx.fillText(f.text, f.x, f.y); }
  ctx.globalAlpha = 1;
}

/* ---------- 画面の表示（丸い板 ui-panel 85%・文字 ui-ink） ---------- */
function pill(x, y, w, h, color) { ctx.fillStyle = color || rgba(PAL.uiPanel, 0.85); rr(ctx, x, y, w, h, h / 2); ctx.fill(); }
function drawHud() {
  pill(HUD_GAP, HUD_GAP, 64, 22);
  for (let i = 0; i < MAX_HP; i++) Kabe.heart(ctx, PAL, 22 + i * 18, 13, i < G.hp);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const label = `${Math.floor(G.best)}m`;
  ctx.font = `800 15px ${FONT}`; const tw = ctx.measureText(label).width;
  ctx.font = `500 10px ${FONT}`; const zone = poolAt(G.best).name, zw = ctx.measureText(zone).width;
  const pw = Math.max(tw, zw) + 28;
  pill(W / 2 - pw / 2, HUD_GAP, pw, 36);
  ctx.fillStyle = PAL.uiInk; ctx.font = `800 15px ${FONT}`; ctx.fillText(label, W / 2, HUD_GAP + 13);
  ctx.fillStyle = PAL.uiMuted; ctx.font = `500 10px ${FONT}`; ctx.fillText(zone, W / 2, HUD_GAP + 27);
  const time = G.time.toFixed(1) + 's';
  ctx.font = `500 11px ${FONT}`; const tmw = ctx.measureText(time).width + 20;
  pill(W - HUD_GAP - tmw, HUD_GAP, tmw, 22);
  ctx.fillStyle = PAL.uiInk; ctx.fillText(time, W - HUD_GAP - tmw / 2, HUD_GAP + 11.5);
  if (state === 'play' && G.lavaY > cam.y + H) {
    const m = Math.max(0, Math.round((G.lavaY - P.y) / PX_PER_M)), txt = `▼ 溶岩まで ${m}m`, near = m < 6;
    ctx.font = `800 12px ${FONT}`; const w2 = ctx.measureText(txt).width + 24;
    pill(W / 2 - w2 / 2, H - HUD_GAP - 22, w2, 22, near ? PAL.rise : null);
    ctx.fillStyle = near ? PAL.ink : PAL.uiInk; ctx.fillText(txt, W / 2, H - HUD_GAP - 10.5);
  }
  if (showCheck) { ctx.textAlign = 'left'; ctx.font = '11px system-ui'; ctx.fillStyle = '#0f0'; ctx.fillText(checkLabel, 8, 58); }
}

function draw() {
  const k = scale * dpr;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (!world) return;
  Kabe.background(ctx, PAL, 0, 0, W, H, G ? G.time : 0, cam.y);
  const sx = cam.shake ? (Math.random() - 0.5) * cam.shake : 0, sy = cam.shake ? (Math.random() - 0.5) * cam.shake : 0;
  ctx.save(); ctx.translate(sx, -cam.y + sy);
  const b0 = Math.floor(-(cam.y + H) / CELL / BAND) - 1, b1 = Math.floor(-cam.y / CELL / BAND) + 1;
  for (let b = b0; b <= b1; b++) { const band = bandCanvas(b); if (band) ctx.drawImage(band.c, 0, band.yTop, W, band.hpx); }
  if (debug) {
    ctx.font = '10px system-ui'; ctx.textAlign = 'left';
    for (const p of world.placed) { const y = -p.r0 * CELL; ctx.fillStyle = 'rgba(242,181,68,.7)'; ctx.fillRect(0, y, W, 1); ctx.fillText(p.id, 40, y - 4); }
    for (const list of world.edges) if (list) for (const e of list) {
      ctx.strokeStyle = e.ny < -0.8 ? '#0f0' : e.ny > 0.8 ? '#f44' : '#4af';
      ctx.beginPath(); ctx.moveTo(e.ax, e.ay); ctx.lineTo(e.bx, e.by); ctx.stroke();
    }
  }
  if (showCheck) drawCheck();
  if (state !== 'dying' && state !== 'end') drawPlayer();
  drawParticles();
  drawLava();
  ctx.restore();
  if (state !== 'title') drawHud();
}
// V：今いるパーツの到達チェック結果を重ねる（緑＝安全に出口へ行ける着地点、橙＝ダメージを受けないと進めない、赤＝詰み）
let checkLabel = '';
function drawCheck() {
  const pl = world.placed.find(p => -P.y / CELL >= p.r0 - 0.5 && -P.y / CELL <= p.r1 + 1) || world.placed[world.placed.length - 1];
  if (!checkCache[pl.id]) { checkCache[pl.id] = checkPiece(pl.id); }
  const res = checkCache[pl.id], base = -pl.r0 * CELL;
  checkLabel = `${pl.id}: ${res.ok ? 'OK' : 'NG'}  入口 ${res.entryOk}/${res.entries}  痛い場所 ${res.hurtSpots}  詰み ${res.softlocks}`;
  const col = { good: 'rgba(80,255,120,.8)', hurt: 'rgba(255,170,40,.9)', lock: 'rgba(255,40,40,1)' };
  for (const p of res.points) { ctx.fillStyle = col[p.kind]; ctx.fillRect(p.x - 2, base + p.y - 2, 4, 4); }
}

/* =====================================================================
   効果音（やわらか）
   ===================================================================== */
let actx = null, noiseBuf = null, muted = store.get('kabe_muted', false);
function audio() {
  if (muted) return null;
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, dur, type, vol, f2 = 0, delay = 0, attack = 0.004) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, hp, lp = 12000) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, s = a.createBufferSource(), g = a.createGain(), f1 = a.createBiquadFilter(), f2 = a.createBiquadFilter();
  s.buffer = noiseBuf; f1.type = 'highpass'; f1.frequency.value = hp; f2.type = 'lowpass'; f2.frequency.value = lp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f1).connect(f2).connect(g).connect(a.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  kick() { tone(300, 0.14, 'triangle', 0.12, 520); noise(0.04, 0.03, 3000, 6000); },
  air() { tone(660, 0.22, 'sine', 0.1, 990, 0, 0.01); tone(990, 0.18, 'sine', 0.05, 1320, 0.05, 0.01); },
  land() { tone(160, 0.08, 'sine', 0.1, 110, 0, 0.003); noise(0.04, 0.025, 400, 2000); },
  hurt() { tone(420, 0.3, 'triangle', 0.12, 160, 0, 0.003); tone(400, 0.3, 'triangle', 0.08, 150, 0.02, 0.003); },
  die() { tone(520, 0.5, 'triangle', 0.12, 140, 0, 0.003); tone(260, 0.6, 'sine', 0.1, 70, 0.08, 0.01); },
  lava() { tone(240, 0.9, 'sine', 0.14, 60, 0, 0.01); noise(0.8, 0.05, 100, 900); },
  tick() { tone(1320, 0.25, 'sine', 0.06, 0, 0, 0.005); },
  start() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.35, 'sine', 0.08, 0, i * 0.1, 0.01)); },
};

/* ---------- menus & loop ---------- */
const ov = { title: $('ovTitle'), how: $('ovHow'), pause: $('ovPause'), end: $('ovEnd') };
function showOnly(n) { for (const k in ov) ov[k].hidden = k !== n; }
function renderBest() { const b = store.get('kabe_best', 0); $('bestTitle').textContent = b ? `最高 ${b}m` : ''; }
function startGame() { showOnly(null); newGame(); state = 'play'; $('pauseBtn').hidden = false; acc = 0; last = performance.now(); sfx.start(); }
function showEnd() {
  const m = Math.floor(G.best), best = store.get('kabe_best', 0);
  if (m > best) store.set('kabe_best', m);
  $('endTitle').textContent = { lava: '溶岩に呑まれた', spike: 'トゲで力尽きた' }[G.cause] || 'おしまい';
  const st = $('endStats'); st.textContent = '';
  for (const [a, b, isNew] of [['高さ', m + 'm', m > best], ['タイム', G.time.toFixed(1) + '秒'], ['最高', Math.max(m, best) + 'm']]) {
    const dt = document.createElement('dt'); dt.textContent = a; const dd = document.createElement('dd'); dd.textContent = b + (isNew ? ' 新記録' : ''); if (isNew) dd.className = 'new'; st.append(dt, dd);
  }
  showOnly('end'); $('btnRetry').focus({ preventScroll: true });
}
const muteLabel = () => { $('btnMute').textContent = muted ? '音：オフ' : '音：オン'; };
$('btnMute').onclick = () => { muted = !muted; store.set('kabe_muted', muted); muteLabel(); if (!muted) sfx.tick(); };
muteLabel();
$('btnHow').onclick = () => showOnly('how');
$('btnHowBack').onclick = () => showOnly('title');
$('ovTitle').addEventListener('pointerdown', e => { if (!e.target.closest('button')) startGame(); });
// アプデ：置き場所の最新版を取りにいき、版が違えば読み直す（取れないときはそのまま読み直す）
$('ver').textContent = 'v' + VERSION;
$('btnUpdate').onclick = async () => {
  const b = $('btnUpdate'); b.disabled = true; b.textContent = '確認中…';
  try {
    const r = await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
    const m = r.ok && (await r.text()).match(/VERSION = '(\d[^']*)'/);
    if (m && m[1] === VERSION) { b.textContent = '最新です'; setTimeout(() => { b.textContent = 'アプデ'; b.disabled = false; }, 1500); return; }
  } catch (e) {}
  location.replace(location.pathname + '?v=' + Date.now());
};
$('btnStart').onclick = startGame; $('btnRetry').onclick = startGame; $('btnQuit').onclick = startGame;
$('btnToTitle').onclick = () => { state = 'title'; newGame(); renderBest(); showOnly('title'); };
$('btnResume').onclick = () => { showOnly(null); state = 'play'; last = performance.now(); };
$('pauseBtn').onclick = () => { if (state === 'play') { state = 'pause'; showOnly('pause'); } };
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowUp') {
    if (e.target.tagName === 'BUTTON' && state !== 'play') return;
    e.preventDefault(); if (e.repeat) return;
    if (state === 'title') { if (!ov.title.hidden) startGame(); } else press();
  } else if (e.key === 'Escape' || e.key === 'p') { if (state === 'play') $('pauseBtn').onclick(); else if (state === 'pause') $('btnResume').onclick(); }
  else if (e.key === 'd' || e.key === 'D') debug = !debug;
  else if (e.key === 'v' || e.key === 'V') showCheck = !showCheck;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') $('pauseBtn').onclick(); });

let last = performance.now(), acc = 0;
function loop(now) {
  const frame = Math.min(0.1, Math.max(0, now - last) / 1000) * MOVE.speed; last = now;
  if (state === 'play') { acc += frame; while (acc >= DT && state === 'play') { update(DT); acc -= DT; } }
  else if (state === 'title') { G.time += frame; updatePose(frame); }
  else if (state === 'dying') G.time += frame;
  updateEffects(frame);
  draw();
  requestAnimationFrame(loop);
}
resize(); renderBest(); newGame();
if (document.fonts && document.fonts.load) document.fonts.load(`800 15px "M PLUS Rounded 1c"`).catch(() => {});
requestAnimationFrame(loop);
window.__kabe = { checkAll, checkPiece, _dbg: { newWorld, appendRows, newBody, kick, physStep, airJump, canAct, spikeHit, collide }, CHECK, PIECES, get state() { return state; }, get P() { return P; }, get G() { return G; }, get world() { return world; }, press, startGame };
})();
</script>
