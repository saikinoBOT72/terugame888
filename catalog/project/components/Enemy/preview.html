<!-- @dsCard group="危険なもの" height=440 width=760 subtitle="敵。上の段は地下の4種類（縦穴の中・実寸）、下の段はゾーンごと（左が拡大、右は実寸）" -->
<style>.en h3 { margin: 10px 10px 0; font-size: 13px; font-weight: 800; color: var(--ui-ink); }</style>
<div class="en"><h3>地下：トゲ鉄球（O）・回転ノコ（S）・掘削ドリル（D）・火の玉（F）</h3><div id="under"></div><h3>ゾーンごと</h3><div id="root"></div></div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap';document.head.appendChild(l);})();
(function () {
  var K = Kabe, under = document.getElementById('under'), names = { ball: 'トゲ鉄球', saw: '回転ノコ', drill: '掘削ドリル', fire: '火の玉' };
  var G = K.grid(['#......#', '#......#', '#......#', '#......#'], '.');
  under.classList.add('kabe-row');
  K.UNDER_KINDS.forEach(function (kind, i) {
    var fig = document.createElement('figure'); fig.className = 'kabe-fig';
    var cv = K.canvas(144, 72, 1.2, '地下の敵 ' + names[kind]); var cap = document.createElement('figcaption'); cap.textContent = names[kind];
    fig.appendChild(cv.c); fig.appendChild(cap); under.appendChild(fig);
    K.animate(function (t) {
      var P = K.pal('underground'), g = cv.g, tt = t + i * 0.5; g.setTransform(cv.k, 0, 0, cv.k, 0, 0); g.clearRect(0, 0, 144, 72);
      K.background(g, P, 0, 0, 144, 72, t, 0); K.terrain(g, P, G, t);
      var x = 72 + Math.sin(tt * 1.1) * 38, dir = Math.cos(tt * 1.1) > 0 ? 1 : -1, bob = { ball: 6, saw: 0, drill: 0, fire: 9 }[kind];
      if (kind === 'saw') K.rail(g, P, 18, 126, 30);
      K.ghost(g, P, 'sheet', 'cling', 28, 56, tt, 1, 1);
      K.enemy(g, P, x, 30 + Math.sin(tt * 2) * bob, tt, 1, dir, kind);
    });
  });
  K.zoneRow(document.getElementById('root'), { w: 112, h: 72, zoom: 1.5, label: '敵', draw: function (g, P, t) {
    var look = Math.cos(t * 0.7) > 0 ? 1 : -1;
    K.enemy(g, P, 36, 36 + Math.sin(t * 2) * 1.5, t, 1.8, look);
    g.fillStyle = K.alpha(P.uiPanel, 0.55); K.rr(g, 72, 14, 36, 46, 6); g.fill();
    K.ghost(g, P, 'sheet', 'stand', 82, 42, t, 1, 1);
    K.enemy(g, P, 99, 32 + Math.sin(t * 2), t, 1, look);
  } });
})();
</script>
