<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--BODY-START-->
<title>アセット見本帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* Layout: one column of style sections; each section = sample scene on the left, asset cards on the right (stacks on phones).
     The page itself is a quiet dark frame so the four art directions can be compared side by side. */
  :root {
    --page: #121318;
    --panel: #1a1c23;
    --line: #2a2d37;
    --ink: #ebe8e1;
    --dim: #959baa;
    --mark: #f2b544;
    --font-head: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.6 var(--font-body); }
  .wrap {
    max-width: 1180px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header.wrap { padding-block: 28px 8px; display: grid; gap: 10px; }
  h1 { font-family: var(--font-head); font-weight: 700; font-size: 28px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
  .lead { margin: 0; color: var(--dim); max-width: 68ch; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  nav a {
    color: var(--ink); text-decoration: none; font-size: 13px;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--panel);
  }
  nav a:hover, nav a:focus-visible { border-color: var(--mark); outline: none; }
  main.wrap { display: grid; gap: 40px; padding-block: 20px 48px; }
  section.style { display: grid; gap: 14px; scroll-margin-top: 16px; }
  .style-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .style-head h2 { font-family: var(--font-head); font-weight: 700; font-size: 21px; margin: 0; }
  .style-head .tag { font-size: 12px; color: var(--mark); letter-spacing: .08em; }
  .style-desc { margin: 0; color: var(--dim); max-width: 70ch; }
  .swatches { display: flex; gap: 4px; flex-wrap: wrap; }
  .swatches span { width: 22px; height: 22px; border-radius: 3px; border: 1px solid rgba(255,255,255,.12); }
  .body { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .scene { display: grid; gap: 6px; }
  .scene canvas { width: 100%; max-width: 360px; height: auto; display: block; border-radius: 4px; border: 1px solid var(--line); }
  .cap { font-size: 12px; color: var(--dim); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 6px; min-width: 0; }
  .card canvas { width: 100%; height: auto; display: block; border-radius: 3px; }
  .card.pixel canvas { image-rendering: pixelated; }
  .card b { font-weight: 600; font-size: 13px; }
  .card .cap { line-height: 1.45; }
  .sfx { display: grid; gap: 14px; }
  .sfx-set { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 8px; }
  .sfx-set h3 { margin: 0; font-family: var(--font-head); font-size: 16px; }
  .sfx-set p { margin: 0; color: var(--dim); font-size: 13px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit; font-size: 13px; color: var(--ink); background: #262a34; border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--mark); }
  button:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  footer.wrap { padding-block: 0 40px; color: var(--dim); }
  @media (max-width: 720px) {
    .body { grid-template-columns: minmax(0, 1fr); }
    .scene canvas { margin: 0 auto; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>
<header class="wrap">
  <h1>アセット見本帳</h1>
  <p class="lead">壁蹴りタワーの見た目の方向性を4つ並べた見本です。どれもゲームと同じ大きさ（1マス18px、プレイヤーの直径22px）で描いていて、素材は3倍に拡大して見せています。左の場面は、実際のパーツと同じマス目で組んだものです。下の方に効果音の見本もあります。</p>
  <nav id="nav" aria-label="方向性へ移動"></nav>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap">
  <p>気に入った方向性（A〜D）と、混ぜたいところ（例：「Aの壁にCのプレイヤー」）を教えてください。決まったら、その方向で素材を作り込みます。</p>
</footer>

<script>
(() => {
'use strict';
const CELL = 18, R = 11;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- マス目（ゲームと同じ読み方） ---------- */
const SCENE = [
  '##................##',
  '##................##',
  '##..........###...##',
  '##...............^##',
  '##...............^##',
  '##\\............../##',
  '###\\............/###',
  '####\\........../####',
  '#####\\......../#####',
  '######^.......######',
  '######^.......######',
  '######........######',
  '#####/........\\#####',
  '####/..........\\####',
  '###/............\\###',
  '##/..............\\##',
  '##................##',
  '##................##',
  '##^...............##',
  '##^...............##',
  '##................##',
  '##.....####.......##',
  '##................##',
  '##...............^##',
  '##................##',
  '##................##',
  '##................##',
  '##................##',
];
// map は上の行から。outside = 範囲外を壁にするか
function makeGrid(map, outside) {
  const rows = map.length, cols = map[0].length;
  const raw = (c, r) => (c < 0 || c >= cols || r < 0 || r >= rows) ? outside : map[r][c];
  const isW = t => t === '#';
  const tile = (c, r) => {
    const t = raw(c, r);
    if (t === '/') return isW(raw(c + 1, r)) + isW(raw(c, r + 1)) >= isW(raw(c - 1, r)) + isW(raw(c, r - 1)) ? 'BR' : 'TL';
    if (t === '\\') return isW(raw(c - 1, r)) + isW(raw(c, r + 1)) >= isW(raw(c + 1, r)) + isW(raw(c, r - 1)) ? 'BL' : 'TR';
    return t;
  };
  const SIDES = { '#': 'LRTB', BR: 'RB', BL: 'LB', TL: 'LT', TR: 'RT' };
  const has = (t, s) => (SIDES[t] || '').includes(s);
  const exposed = (c, r) => {
    const t = tile(c, r);
    return { t: has(t, 'T') && !has(tile(c, r - 1), 'B'), b: has(t, 'B') && !has(tile(c, r + 1), 'T'), l: has(t, 'L') && !has(tile(c - 1, r), 'R'), r: has(t, 'R') && !has(tile(c + 1, r), 'L') };
  };
  const spikeDir = (c, r) => isW(raw(c - 1, r)) ? 'L' : isW(raw(c + 1, r)) ? 'R' : isW(raw(c, r + 1)) ? 'B' : isW(raw(c, r - 1)) ? 'T' : 'L';
  return { rows, cols, raw, tile, exposed, spikeDir };
}
function drawGrid(ctx, S, g, t, ox = 0, oy = 0) {
  for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) {
    const k = g.tile(c, r), x = ox + c * CELL, y = oy + r * CELL;
    if (k === '#') S.block(ctx, x, y, g.exposed(c, r), c, r);
    else if (k === 'BR' || k === 'BL' || k === 'TL' || k === 'TR') S.slope(ctx, x, y, k, g.exposed(c, r), c, r);
  }
  for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) if (g.raw(c, r) === '^') S.spike(ctx, ox + c * CELL, oy + r * CELL, g.spikeDir(c, r), t);
}

/* ---------- 共通の小道具 ---------- */
const tri = (ctx, a, b, c, d, e, f) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); };
const slopePts = (x, y, k) => { const X = x + CELL, Y = y + CELL;
  return k === 'BR' ? [X, y, X, Y, x, Y] : k === 'BL' ? [x, y, X, Y, x, Y] : k === 'TL' ? [x, y, X, y, x, Y] : [x, y, X, y, X, Y]; };
const diag = (x, y, k) => { const X = x + CELL, Y = y + CELL; return (k === 'BR' || k === 'TL') ? [x, Y, X, y] : [x, y, X, Y]; };
const upFacing = k => k === 'BR' || k === 'BL';
// トゲは「左の壁から右向き」で描き、向きに合わせて回す
function withDir(ctx, x, y, dir, fn) {
  ctx.save(); ctx.translate(x + CELL / 2, y + CELL / 2);
  ctx.rotate({ L: 0, R: Math.PI, T: Math.PI / 2, B: -Math.PI / 2 }[dir]);
  ctx.translate(-CELL / 2, -CELL / 2); fn(); ctx.restore();
}
function heartPath(ctx, x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y - s * 0.1, x - s * 0.55, y - s * 0.1, x - s * 0.55, y + s * 0.25);
  ctx.bezierCurveTo(x - s * 0.55, y + s * 0.55, x - s * 0.1, y + s * 0.7, x, y + s * 0.9);
  ctx.bezierCurveTo(x + s * 0.1, y + s * 0.7, x + s * 0.55, y + s * 0.55, x + s * 0.55, y + s * 0.25);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 0.1, x, y - s * 0.1, x, y + s * 0.3); ctx.closePath();
}
// ドット絵：文字の配列を 2px のドットで描く
function sprite(ctx, art, pal, x, y, px = 2, flip = false) {
  const w = art[0].length;
  for (let j = 0; j < art.length; j++) for (let i = 0; i < w; i++) {
    const ch = art[j][flip ? w - 1 - i : i]; if (ch === '.' || !pal[ch]) continue;
    ctx.fillStyle = pal[ch]; ctx.fillRect(x + i * px, y + j * px, px, px);
  }
}

/* =====================================================================
   A. ドット絵（石と苔）
   ===================================================================== */
const PIX_PLAYER = [
  '....kkkk....',
  '..kkwwwwkk..',
  '.kwwwwwwwwk.',
  '.kwwwwwbwbk.',
  'kwwwwwwbwbwk',
  'krrrrrrrrrrk',
  'kwwwwwwwwwwk',
  'kwwwwwwwwwwk',
  '.kwwwwwwwwk.',
  '.kkwwwwwwkk.',
  '..kkkkkkkk..',
];
const PIX_PLAYER_HURT = PIX_PLAYER.map((s, j) => j === 3 ? '.kwwwwxwxwk.' : j === 4 ? 'kwwwwwwxwxwk' : s);
const PIX_BAT = [[
  'p............p',
  'pp..........pp',
  '.ppp.kkkk.ppp.',
  '..pppkeekppp..',
  '...ppkkkkpp...',
  '......kk......',
], [
  '..............',
  '......kk......',
  '....pkeekp....',
  '..pppkkkkppp..',
  '.ppp......ppp.',
  'pp..........pp',
]];
const PIX_HEART = ['.kk.kk.', 'krrkrrk', 'krrrrrk', '.krrrk.', '..krk..', '...k...'];
const A = {
  id: 'pixel', letter: 'A', name: 'ドット絵（石と苔）', tag: 'PIXEL', pixel: true,
  desc: '2pxのドットで描く、苔むした石の塔。上を向いた面に苔が生え、松明の灯りで照らされる。懐かしいけれど情報量は多め。',
  swatches: ['#0f1714', '#3d5649', '#557564', '#8fc46a', '#f2ecd6', '#e0533d', '#6a58a8', '#ff8a3d'],
  bg(ctx, x, y, w, h) {
    ctx.fillStyle = '#0f1714'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#15221c';
    for (let r = 0; r * 18 < h; r++) for (let c = -1; c * 36 < w; c++) {
      if (hash(r, c) < 0.5) continue;
      ctx.fillRect(x + c * 36 + (r % 2 ? 18 : 0) + 2, y + r * 18 + 2, 32, 14);
    }
  },
  block(ctx, x, y, e, c = 0, r = 0) {
    ctx.fillStyle = '#3d5649'; ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = '#22302a'; ctx.fillRect(x, y + 8, CELL, 2); ctx.fillRect(x, y + 16, CELL, 2);
    const j1 = (r % 2) ? 12 : 4, j2 = (r % 2) ? 4 : 12;
    ctx.fillRect(x + j1, y, 2, 8); ctx.fillRect(x + j2, y + 10, 2, 6);
    ctx.fillStyle = '#557564'; ctx.fillRect(x, y, CELL, 2); ctx.fillRect(x, y + 10, CELL, 2);
    ctx.fillStyle = '#22302a';
    if (e.l) ctx.fillRect(x, y, 2, CELL);
    if (e.r) ctx.fillRect(x + CELL - 2, y, 2, CELL);
    if (e.b) { ctx.fillStyle = '#1a241f'; ctx.fillRect(x, y + CELL - 2, CELL, 2); }
    if (e.t) {
      ctx.fillStyle = '#6f9b4f'; ctx.fillRect(x, y, CELL, 4);
      ctx.fillStyle = '#8fc46a'; ctx.fillRect(x, y, CELL, 2);
      ctx.fillStyle = '#6f9b4f'; for (let i = 0; i < 9; i++) if (hash(c * 9 + i, r) > 0.62) ctx.fillRect(x + i * 2, y + 4, 2, 2);
    }
  },
  slope(ctx, x, y, k) {
    for (let j = 0; j < 9; j++) {
      const a = k === 'BR' ? 8 - j : k === 'BL' ? 0 : k === 'TL' ? 0 : j, b = k === 'BR' ? 8 : k === 'BL' ? j : k === 'TL' ? 8 - j : 8;
      ctx.fillStyle = j % 4 === 3 ? '#22302a' : '#3d5649'; ctx.fillRect(x + a * 2, y + j * 2, (b - a + 1) * 2, 2);
      const ex = k === 'BR' || k === 'TL' ? (k === 'BR' ? a : b) : (k === 'BL' ? b : a);
      ctx.fillStyle = upFacing(k) ? '#8fc46a' : '#1a241f'; ctx.fillRect(x + ex * 2, y + j * 2, 2, 2);
    }
  },
  spike(ctx, x, y, dir) {
    withDir(ctx, x, y, dir, () => {
      ctx.fillStyle = '#4a4f5c'; ctx.fillRect(0, 1, 2, 16);
      for (const ty of [1, 9]) {
        const rows = [[4, '#d6d9e2'], [12, '#d6d9e2'], [12, '#8a8fa0'], [4, '#8a8fa0']];
        rows.forEach(([len, col], i) => { ctx.fillStyle = col; ctx.fillRect(2, ty + i * 2, len, 2); });
      }
    });
  },
  player(ctx, cx, cy, pose, face, t) {
    const pal = { k: '#1a1424', w: pose === 'hurt' ? '#ffc2c2' : '#f2ecd6', b: '#1a1424', r: '#e0533d', x: '#1a1424' };
    const art = pose === 'hurt' ? PIX_PLAYER_HURT : PIX_PLAYER, flip = face < 0;
    // マフラーのしっぽ（顔と反対側）
    const wave = Math.round(Math.sin(t * 10)) * 2, back = -face;
    ctx.fillStyle = '#e0533d';
    const tx = cx + back * 12, sy = pose === 'jump' || pose === 'air' ? 4 : -2;
    ctx.fillRect(back > 0 ? tx - 2 : tx - 4, cy - 2 + sy * 0.5, 6, 2); ctx.fillRect(back > 0 ? tx + 2 : tx - 8, cy + wave + sy, 6, 2);
    sprite(ctx, art, pal, cx - 12, cy - 11, 2, flip);
    ctx.fillStyle = '#c9bfa6';
    if (pose === 'cling') { const hx = face > 0 ? cx - 13 : cx + 11; ctx.fillRect(hx, cy - 6, 2, 4); ctx.fillRect(hx, cy + 4, 2, 4); }
    else { ctx.fillRect(cx - 6, cy + 10, 4, 2); ctx.fillRect(cx + 2, cy + 10, 4, 2); }
    if (pose === 'air') { ctx.fillStyle = '#bfe8ff'; for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; ctx.fillRect(Math.round(cx + Math.cos(a) * 17) - 1, Math.round(cy + Math.sin(a) * 17) - 1, 2, 2); } }
  },
  bat(ctx, cx, cy, t) { sprite(ctx, PIX_BAT[Math.abs(Math.floor(t * 6)) % 2], { p: '#6a58a8', k: '#3b2f5c', e: '#ff4f6a' }, cx - 14, cy - 6); },
  lava(ctx, x, y, w, h, t) {
    for (let i = 0; i < w / 2; i++) {
      const s = Math.round(Math.sin(i * 0.5 + t * 3) * 1.2 + Math.sin(i * 0.21 - t * 2)) * 2;
      const yy = y + 4 + s;
      ctx.fillStyle = '#ffd36a'; ctx.fillRect(x + i * 2, yy, 2, 2);
      ctx.fillStyle = '#ff8a3d'; ctx.fillRect(x + i * 2, yy + 2, 2, 4);
      ctx.fillStyle = '#d2452b'; ctx.fillRect(x + i * 2, yy + 6, 2, y + h - yy - 6);
      for (let j = 0; j < 6; j++) if (hash(i, j) > 0.88) { ctx.fillStyle = '#a8331f'; ctx.fillRect(x + i * 2, yy + 10 + j * 6, 2, 2); }
    }
    for (let k = 0; k < 4; k++) { const bx = x + ((hash(k, 3) * w + t * 10) % w), by = y + h - ((t * 14 + k * 13) % (h - 6)); ctx.fillStyle = '#ffd36a'; ctx.fillRect(Math.floor(bx / 2) * 2, Math.floor(by / 2) * 2, 2, 2); }
  },
  heart(ctx, x, y, full) { sprite(ctx, PIX_HEART, { k: '#1a1424', r: full ? '#ff5d6c' : '#3a3340' }, x, y); },
  hudFont: 'bold 12px ui-monospace, Menlo, monospace', hudInk: '#f2ecd6',
};

/* =====================================================================
   B. 影絵（シルエット）
   ===================================================================== */
const B = {
  id: 'silhouette', letter: 'B', name: '影絵（夕暮れのシルエット）', tag: 'SILHOUETTE',
  desc: '地形も敵も真っ黒な影。背景の夕焼けと、溶岩の光だけに色がある。形がはっきり読めて、トゲの危なさが一目でわかる。',
  swatches: ['#1c1430', '#3a2648', '#f0874d', '#f6a96b', '#0d0a12', '#ff5a5a', '#fff1b8'],
  bg(ctx, x, y, w, h) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#1c1430'); g.addColorStop(0.55, '#5a2f52'); g.addColorStop(1, '#f0874d');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(42,28,61,.55)';
    for (let i = 0; i < 5; i++) { const bx = x + hash(i, 1) * w, bw = 20 + hash(i, 2) * 30, bh = h * (0.3 + hash(i, 3) * 0.5); ctx.fillRect(bx, y + h - bh, bw, bh); }
  },
  block(ctx, x, y, e) {
    ctx.fillStyle = '#0d0a12'; ctx.fillRect(x, y, CELL, CELL);
    if (e.t) { ctx.fillStyle = '#f6a96b'; ctx.fillRect(x, y, CELL, 2); }
    ctx.fillStyle = '#7a4560';
    if (e.l) ctx.fillRect(x, y, 1, CELL);
    if (e.r) ctx.fillRect(x + CELL - 1, y, 1, CELL);
  },
  slope(ctx, x, y, k) {
    ctx.fillStyle = '#0d0a12'; tri(ctx, ...slopePts(x, y, k)); ctx.fill();
    const [a, b, c, d] = diag(x, y, k);
    ctx.strokeStyle = upFacing(k) ? '#f6a96b' : '#7a4560'; ctx.lineWidth = upFacing(k) ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
  },
  spike(ctx, x, y, dir) {
    withDir(ctx, x, y, dir, () => {
      ctx.fillStyle = '#0d0a12';
      for (const ty of [1, 9]) { tri(ctx, 0, ty, 0, ty + 8, 14, ty + 4); ctx.fill(); }
      ctx.strokeStyle = 'rgba(246,169,107,.8)'; ctx.lineWidth = 1;
      for (const ty of [1, 9]) { ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(14, ty + 4); ctx.stroke(); }
    });
  },
  player(ctx, cx, cy, pose, face, t) {
    const back = -face, wave = Math.sin(t * 9) * 3;
    ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx + back * 4, cy - 1);
    ctx.quadraticCurveTo(cx + back * 14, cy - 4 + wave, cx + back * 22, cy + (pose === 'cling' ? 4 : 8) + wave); ctx.stroke();
    ctx.fillStyle = '#0d0a12'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    if (pose === 'cling') { ctx.beginPath(); ctx.arc(cx - face * 10, cy - 5, 3, 0, Math.PI * 2); ctx.arc(cx - face * 10, cy + 6, 3, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#fff';
    if (pose === 'hurt') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; for (const ex of [1, 5]) { ctx.beginPath(); ctx.moveTo(cx + face * ex - 2, cy - 5); ctx.lineTo(cx + face * ex + 2, cy - 1); ctx.moveTo(cx + face * ex + 2, cy - 5); ctx.lineTo(cx + face * ex - 2, cy - 1); ctx.stroke(); } }
    else for (const ex of [1, 6]) { ctx.beginPath(); ctx.ellipse(cx + face * ex, cy - 3, 1.6, 2.6, 0, 0, Math.PI * 2); ctx.fill(); }
    if (pose === 'air') { ctx.strokeStyle = 'rgba(255,241,184,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, 17, 0, Math.PI * 2); ctx.stroke(); }
  },
  bat(ctx, cx, cy, t) {
    const f = Math.sin(t * 14) * 6;
