<!-- @dsCard group="キャラ（候補）" height=320 width=760 subtitle="4案を並べて見る" -->
<div id="root"></div>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap';document.head.appendChild(l);})();
var root = document.getElementById('root');
var c = Kabe.canvas(430, 140, 2, 'キャラ4案'); root.appendChild(c.c); root.style.padding = '10px';
var names = ['B1 ふんわり', 'B2 ながすそ', 'B3 ずきん', 'B4 ちびすそ'], ids = ['sheet', 'sheetLong', 'sheetHood', 'sheetChibi'];
Kabe.animate(function (t) {
  var P = Kabe.pal('underground'), g = c.g; g.setTransform(c.k, 0, 0, c.k, 0, 0); g.clearRect(0, 0, 430, 140);
  g.font = '800 10px "M PLUS Rounded 1c", sans-serif'; g.textAlign = 'center';
  for (var i = 0; i < 4; i++) { var x = 58 + i * 105; g.fillStyle = Kabe.alpha(P.uiInk, 0.05); Kabe.rr(g, x - 48, 6, 96, 128, 10); g.fill(); Kabe.ghost(g, P, ids[i], 'stand', x + 8, 66, t, 1, 3); g.fillStyle = P.uiInk; g.fillText(names[i], x, 126); }
});
</script>
